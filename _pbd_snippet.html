<!-- PULSE build-status widget (snippet-injected 2026-06-26; data via deploy permalink, no deploy needed) -->
<div id="pulse-build-dash" style="position:fixed;right:14px;bottom:14px;z-index:99999;width:300px;max-width:90vw;background:rgba(20,16,12,0.96);color:#ECE3D2;border:1px solid rgba(203,161,53,.3);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;overflow:hidden">
  <div onclick="this.parentNode.classList.toggle('pbd-collapsed')" style="cursor:pointer;padding:9px 13px;background:linear-gradient(135deg,#C8821E,#8C2D3C);color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center;font-size:12px">
    <span>&#128296; Build status &mdash; <span id="pbd-mini">live</span></span><span id="pbd-toggle" style="font-size:11px;opacity:.85">&#9652;</span>
  </div>
  <div class="pbd-body" style="padding:12px 13px">
    <div style="font-weight:700;margin-bottom:1px">&#9999;&#65039; Writing (Q&amp;As)</div>
    <div style="display:flex;justify-content:space-between"><span id="pbd-w-txt">&hellip;</span><b id="pbd-w-pct" style="color:#7CCF6A"></b></div>
    <div style="background:#322a20;border-radius:6px;height:8px;margin:3px 0 10px;overflow:hidden"><div id="pbd-w-bar" style="background:#7CCF6A;height:8px;width:0%;transition:width .6s"></div></div>
    <div style="font-weight:700;margin-bottom:1px">&#128444;&#65039; Images (DuckDuckGo)</div>
    <div style="display:flex;justify-content:space-between"><span id="pbd-i-txt">&hellip;</span><b id="pbd-i-pct" style="color:#CBA135"></b></div>
    <div style="background:#322a20;border-radius:6px;height:8px;margin:3px 0 10px;overflow:hidden"><div id="pbd-i-bar" style="background:#CBA135;height:8px;width:0%;transition:width .6s"></div></div>
    <div id="pbd-visitors" style="color:#A99B86;margin-bottom:8px"></div>
    <div id="pbd-pillars" style="max-height:150px;overflow:auto;font-size:12px;border-top:1px solid rgba(203,161,53,.15);padding-top:7px"></div>
    <div style="color:#7d7060;font-size:10px;margin-top:7px">updates every 5 min &middot; <span id="pbd-time"></span></div>
  </div>
</div>
<style>#pulse-build-dash.pbd-collapsed .pbd-body{display:none}#pulse-build-dash.pbd-collapsed #pbd-toggle{transform:rotate(180deg);display:inline-block}</style>
<script>
(function(){
  var SRC='https://6a3e0d3b71402da974ea1764--pulserevops.netlify.app/.netlify/functions/pulse-progress';
  function pct(n,d){return d?Math.min(100,Math.round(n/d*100)):0;}
  function g(id){return document.getElementById(id);}
  function load(){
    fetch(SRC,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      var T=d.target||8730;
      g('pbd-mini').textContent=pct(d.written,T)+'% built';
      g('pbd-w-txt').textContent=(d.written||0).toLocaleString()+' of '+T.toLocaleString();
      g('pbd-w-pct').textContent=pct(d.written,T)+'%'; g('pbd-w-bar').style.width=pct(d.written,T)+'%';
      g('pbd-i-txt').textContent=(d.imgDone||0).toLocaleString()+' of '+T.toLocaleString();
      g('pbd-i-pct').textContent=pct(d.imgDone,T)+'%'; g('pbd-i-bar').style.width=pct(d.imgDone,T)+'%';
      g('pbd-visitors').innerHTML='&#128101; <b>'+(d.visits||0).toLocaleString()+'</b> visitors today &middot; '+(d.clicks||0)+' clicks';
      var ph='';(d.pillars||[]).forEach(function(p){var pc=pct(p.written,p.gap);ph+='<div style="margin:5px 0"><div style="display:flex;justify-content:space-between"><span>'+p.name+'</span><span style="color:#A99B86">'+p.written+'/'+p.gap+'</span></div><div style="background:#322a20;border-radius:4px;height:5px;overflow:hidden"><div style="background:#C8821E;height:5px;width:'+pc+'%"></div></div></div>';});
      g('pbd-pillars').innerHTML=ph||'<span style="color:#7d7060">warming up&hellip;</span>';
      g('pbd-time').textContent=new Date().toLocaleTimeString();
    }).catch(function(){});
  }
  load(); setInterval(load,20000);
})();
</script>
