[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
# SVG assets (img/auto placeholders, pillar logos, graphics/) — explicit MIME so nosniff
# does not block browsers when Netlify would otherwise guess octet-stream. Netlify usually
# serves image/svg+xml already; this is belt-and-suspenders (Apache uses AddType in .htaccess).
[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"
# PWA manifests MUST be served as JSON or Android Chrome rejects them (nosniff above makes
# the default octet-stream fatal) — this is what blocked the /seo + /publish app install.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
# Annabella's Salisbury Fall 2026 calendar feed — served as a real .ics so phones offer
# "Subscribe to Calendar" (one link → all 9 dates, auto-refreshes when the file is edited).
[[headers]]
  for = "/annabella-su.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=\"annabella-su.ics\""
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/annabella-su-1week.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline; filename=\"annabella-su-1week.ics\""
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/annabella-su-3day.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline; filename=\"annabella-su-3day.ics\""
