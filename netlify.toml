# Netlify configuration — always redirect to pulserevops.com
# This ensures Google and all traffic indexes pulserevops.com, not the .netlify.app URL

[functions]
  directory = "netlify/functions"

[build]
  functions = "netlify/functions"

# ─── SCHEDULED FUNCTIONS ────────────────────────────────────────────────
# ALL CRONS DISABLED 2026-04-30 per owner request — "turn all spending off".
# To re-enable a single cron: uncomment its [functions."..."] block + schedule.
# To re-enable everything at once: revert this commit.
#
# Re-enabled 2026-05-01 — daily Apollo playbook generator (top 5 missing).
# Cost cap: ~$1-2/day (5 Haiku calls × ~$0.20-0.40 each).
# Apollo daily DISABLED 2026-05-07 — was using Anthropic API (~$1-2/day = ~$30-60/mo).
# Re-enable once migrated to Groq free tier.
# [functions."apollo-daily-publish-background"]
#   schedule = "0 7 * * *"

# Volume cron — Gemini Flash free-tier writer (pulse-volume-gemini).
# DISABLED 2026-05-12 — replaced by pulse-cycle-tick-background which handles
# write + index + polish in a single unified cron at 15-min cadence (96/day).
# [functions."pulse-volume-gemini"]
#   schedule = "0 * * * *"

# Unified cycle — every 15 min: SELF-HEAL fakes → POLISH 5 newest non-10
# entries (24h+ old) to 10/10. Writes disabled per owner request 2026-05-12.
# 96 cycles/day × 5 polishes = up to 480 polishes/day. Internal-call cost
# ~144 credits/mo, well inside $20 Pro budget.
#
# DISABLED 2026-05-14 per owner — this cron was re-baselining Claude Opus
# bespoke rewrites back to quality_score:5 every 15 min (its "self-heal"
# step treated freshly-written baseline entries as fakes). Library rewrites
# are now driven manually via Claude Code; re-enable only if that changes.
# [functions."pulse-cycle-tick-background"]
#   schedule = "*/15 * * * *"

# Quality auditor — runs hourly at :30 (offset from volume writer at :00).
# Audits 20 entries/run × 24 = 480 audits/day. Mechanical checks are free
# (logic only); Groq grader (free tier) fires at most 6 times per run for
# entries already at 9+/10. Failures push to repair_queue.json for the
# wake-loop to fix. $0 — no Anthropic spend.
#
# DISABLED 2026-05-14 per owner — secondary suspect in the qs-revert issue
# (pushes "failing" entries to repair_queue.json). Disabled alongside the
# unified cycle while library rewrites are Claude-Code-driven.
# [functions."pulse-audit-background"]
#   schedule = "30 * * * *"

# IndexNow batch — every hour, pings Bing/Yandex/Seznam for new entries.
# Bumped from 4h to 1h cadence 2026-05-06 because volume cron pushes 480/day +
# /resume widget shows 60% of library still pending Google crawl.
[functions."pulse-machine-indexnow-batch-background"]
  schedule = "0 * * * *"

# Sports picks — daily at 14:00 UTC (9am ET). Pulls odds from The Odds API,
# synthesizes one bet per major sport. Requires ODDS_API_KEY env var.
[functions."pulse-sports-fetch-background"]
  schedule = "0 14 * * *"

# Sports settler — daily at 11:00 UTC (6am ET). Marks prior-day picks
# win/loss from ESPN public scoreboard, updates lifetime + per-sport stats.
[functions."pulse-sports-settle-background"]
  schedule = "0 11 * * *"

# Weekly stale-touch — every Monday at 13:00 UTC (8am ET). Finds the 5 oldest
# 10/10 entries by polished_at and refreshes their dateModified timestamps so
# Google sees them as recently updated. Pure metadata bump, no body edit.
# Fights "query deserves freshness" decay on aging entries.
[functions."pulse-stale-touch-background"]
  schedule = "0 13 * * 1"

# Daily retro-linking — every day at 15:00 UTC (10am ET). For every 10/10
# entry polished in the last 24h, finds up to 3 older 10/10 entries with
# strong tag overlap and appends a "Recently Added — Related" link to the
# new entry. Boosts internal-link discovery + crawl pathing.
[functions."pulse-retro-link-background"]
  schedule = "0 15 * * *"

# Deep-queue publisher — every 10 minutes. Reads pre-written deep-dive entries
# from _deep_queue.json (authored by Claude Code locally, never by cron AI) and
# publishes one entry per fire through the 5→6→7→8→9→10 polish ladder. Pure
# publish-only maintenance; no AI generation in this cron. When queue is empty,
# function exits idle. Heartbeat → _deep_queue_heartbeat.json. To add entries
# to the queue, run lab/deep-queue-add.js with the spec object(s). Schedule:
# 144 fires/day; will idle until queue is populated.
[functions."pulse-deep-queue-tick-background"]
  schedule = "*/10 * * * *"

