# ─── REVIEW-MIRROR CLEANUP (added 2026-06-29): the sitemap historically emitted a
# /<pillar>/<id>/reviews variant for every entry, but no route ever served them →
# ~30,731 indexed URLs went 404 after the deploy switchover. 301 every /<pillar>/<id>/reviews
# to the canonical /knowledge/<id> entry to consolidate link equity + drop the dupes.
# 3-segment + trailing literal "reviews", so it can't collide with 2-segment pillar routes.
[[redirects]]
  from = "/:pillar/:id/reviews"
  to = "/knowledge/:id"
  status = 301

# Tag landing pages — each unique library tag gets its own SEO-indexable URL.
# Aggregates entries with that tag + co-occurring tags + JSON-LD CollectionPage.
# /knowledge/tag/discount-governance → curated cluster page.
# Order matters: this MUST come before /knowledge/:id so the literal "tag"
# segment doesn't get matched as an :id.
[[redirects]]
  from = "/knowledge/tag/:tag"
  to = "/.netlify/functions/pulse-machine-tag?tag=:tag"
  status = 200

# Per-entry server-rendered pages — each library entry gets its own
# indexable URL with full HTML, JSON-LD schema, OG cards.
[[redirects]]
  from = "/knowledge/:id"
  to = "/.netlify/functions/pulse-machine-entry?id=:id"
  status = 200

