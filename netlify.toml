# Netlify configuration — always redirect to pulserevops.com
# This ensures Google and all traffic indexes pulserevops.com, not the .netlify.app URL

[functions]
  directory = "netlify/functions"

[build]
  functions = "netlify/functions"

# ─── SCHEDULED FUNCTIONS ────────────────────────────────────────────────
# Daily press-scraper: hits Anthropic API with web_search, pulls new
# press mentions of Kory White / PULSE RevOps / The Executive Review,
# dedupes against blob _index by URL hash, appends new entries.
# Cron: 13:00 UTC = 9am ET. Adjust as needed.
[functions."press-scrape"]
  schedule = "0 13 * * *"

[[redirects]]
  from = "https://*.netlify.app/*"
  to = "https://pulserevops.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Tell Google which domain is canonical
    Link = "<https://pulserevops.com/>; rel=\"canonical\""
