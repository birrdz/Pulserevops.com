[[redirects]]
  from = "/fresh"
  to = "/.netlify/functions/fresh-hub"
  status = 200

[[redirects]]
  from = "https://*.netlify.app/*"
  to = "https://pulserevops.com/:splat"
  status = 301
  force = true

# Collapse www → apex (FB/LinkedIn sometimes hit www. variants)
[[redirects]]
  from = "https://www.pulserevops.com/*"
  to = "https://pulserevops.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pulserevops.com/*"
  to = "https://pulserevops.com/:splat"
  status = 301
  force = true

# ─── CLEAN-URL ALIASES — easy-to-share short URLs for DMs / business cards
[[redirects]]
  from = "/knowledge"
  to = "/knowledge.html"
  status = 200

# /themachine/library — clean cold-pitch URL for the library
[[redirects]]
  from = "/themachine/library"
  to = "/knowledge.html"
  status = 200

# /village (alias /agents) — The Village: a live, public visualization of
# every Machine worker (writing / polishing / indexing / auditing) and a
# direct count of how many are working the library right now.
[[redirects]]
  from = "/village"
  to = "/agents.html"
  status = 200
[[redirects]]
  from = "/agents"
  to = "/agents.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Owner-only Intent dashboard (whale-watch). Auth via ?key=pulsemachine.
[[redirects]]
  from = "/intent"
  to = "/intent.html"
  status = 200

# /themachine — clean public URL for the Machine Room. File stays at
# /pulse-new.html (no rename, no path-of-truth confusion). Old shares + Google
# index entries 301 to the new canonical URL.
[[redirects]]
  from = "/pulse-new.html"
  to = "/themachine"
  status = 301
  force = true
[[redirects]]
  from = "/pulse-new"
  to = "/themachine"
  status = 301
  force = true
[[redirects]]
  from = "/themachine"
  to = "/pulse-new.html"
  status = 200

# Public privacy policy
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# /resume removed 2026-05-08 per owner — public site no longer surfaces the
# resume page. The queue widget moved to a dedicated /queue route.
[[redirects]]
  from = "/queue"
  to = "/queue.html"
  status = 200

# Secret /sports page — password-gated landing for the daily best-bets feature.
# noindex,nofollow set in the page head; this redirect just gives a clean URL.
[[redirects]]
  from = "/sports"
  to = "/sports.html"
  status = 200

# 319 Blue Bay Road listing — friendly clean URLs
[[redirects]]
  from = "/319-blue-bay-road-stevensville-md"
  to = "/319-blue-bay-road-stevensville-md.html"
  status = 200

[[redirects]]
  from = "/319-blue-bay-road"
  to = "/319-blue-bay-road-stevensville-md.html"
  status = 301

[[redirects]]
  from = "/home-for-sale"
  to = "/319-blue-bay-road-stevensville-md.html"
  status = 301

# Kory White personal brand page — friendly clean URLs
[[redirects]]
  from = "/kory-white-maryland"
  to = "/kory-white-maryland.html"
  status = 200

[[redirects]]
  from = "/kory-white"
  to = "/kory-white-maryland.html"
  status = 301

# Pretty URLs for pillar pages — /pillars/<slug> without .html
[[redirects]]
  from = "/pillars/:slug"
  to = "/pillars/:slug.html"
  status = 200

# Dynamic library RSS — always reflects live blob state
[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/pulse-machine-rss"
  status = 200

# Dynamic library sitemap (per-entry deep links)
[[redirects]]
  from = "/sitemap-knowledge.xml"
  to = "/.netlify/functions/pulse-machine-sitemap"
  status = 200

# Tool landing pages — each PULSE dashboard tool gets its own SEO-indexable
# URL. /tools/gross-profit-calculator → marketing-grade page with deep-link
# to /dashboard.html#anchor.
[[redirects]]
  from = "/tools"
  to = "/.netlify/functions/tools-page"
  status = 200
[[redirects]]
  from = "/tools/"
  to = "/.netlify/functions/tools-page"
  status = 200
[[redirects]]
  from = "/tools/:slug"
  to = "/.netlify/functions/tools-page?slug=:slug"
  status = 200

# Tag landing pages — each unique library tag gets its own SEO-indexable URL.
# Aggregates entries with that tag + co-occurring tags + JSON-LD CollectionPage.
# /knowledge/tag/discount-governance → curated cluster page.
# Order matters: this MUST come before /knowledge/:id so the literal "tag"
# segment doesn't get matched as an :id.
[[redirects]]
  from = "/knowledge/tag/:tag"
  to = "/.netlify/functions/pulse-machine-tag?tag=:tag"
  status = 200

# Per-entry server-rendered pages — each library entry gets its own
# indexable URL with full HTML, JSON-LD schema, OG cards.
[[redirects]]
  from = "/knowledge/:id"
  to = "/.netlify/functions/pulse-machine-entry?id=:id"
  status = 200

[[redirects]]
  from = "/press-kit"
  to = "/press/press-kit.html"
  status = 200

[[redirects]]
  from = "/press-kit/"
  to = "/press/press-kit.html"
  status = 200

[[redirects]]
  from = "/kit"
  to = "/press/press-kit.html"
  status = 200

[[redirects]]
  from = "/media"
  to = "/press/press-kit.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Tell Google which domain is canonical
    Link = "<https://pulserevops.com/>; rel=\"canonical\""
