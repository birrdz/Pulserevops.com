<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Homepage square box preview</title>
<style>
body{margin:0;background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;font-family:system-ui,sans-serif;color:#aaa}
h1{color:#eee;font-size:1rem;margin:0 0 18px;font-weight:800}
.row{display:flex;gap:16px;overflow-x:auto;padding:8px;max-width:100%}
.rcard{display:flex;flex-direction:column;flex:0 0 220px;width:220px;height:340px;text-decoration:none;background:#000;border:7px solid #EAC15C;box-sizing:border-box;overflow:hidden;color:inherit}
.rcard-imgwrap{display:block;width:100%;height:198px;flex:0 0 198px;overflow:hidden;background:#000}
.rcard-imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
.rc{padding:8px 10px 0;color:#EAC15C;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;text-align:center}
.rt{padding:8px 12px 16px;color:#F6C445;font-family:Georgia,serif;font-size:1.42rem;line-height:1.16;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center}
.rt>span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-align:center;width:100%;max-height:calc(1.16em * 3)}
.note{margin-top:18px;font-size:.8rem;max-width:420px;text-align:center;line-height:1.4}
</style></head><body>
<h1>Main-page square box (exact rcard)</h1>
<div class=row>
  <a class=rcard href="#" style="--tc:#EAC15C">
    <span class=rcard-imgwrap><img src="/assets/qa/aq9999.sq.jpg?v=5" width=220 height=198 alt="" class=is-on></span>
    <div class=rc>Aquariums</div>
    <div class=rt><span>How do reef tanks keep aquarium water clear and stable?</span></div>
  </a>
  <a class=rcard href="#" style="opacity:.45">
    <span class=rcard-imgwrap><img src="/assets/qa/aq9999.sq.jpg?v=5" width=220 height=198 alt=""></span>
    <div class=rc>Neighbor tile</div>
    <div class=rt><span>How the row looks next to yours…</span></div>
  </a>
</div>
<p class=note>Same size as live homepage: 220×340, 7px gold border, 198px image band, category + title under — your face in the box.</p>
</body></html>
