<script type="importmap">
{
  "imports": {
    "three":      "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ════════════════════════════════════════════════════════════════════════
// Pulse Derby — 3D horse race with stat-driven simulation + betting.
//
// Tech: Three.js (CDN, no build), procedural horse geometry, oval track
// with banked turns. Each race is a Monte Carlo simulation: per-frame
// speed = baseSpeed × stamina-curve × stochastic noise.
// ════════════════════════════════════════════════════════════════════════

const N_HORSES = 6;
const TRACK_LEN = 1000; // virtual race distance (m)
const TRACK_RADIUS = 60;
const TRACK_STRAIGHT = 120;

// Horse name generator — punchy, brand-friendly
const NAMES_A = ['Pulse','Velocity','Phantom','Sterling','Atomic','Iron','Royal','Midnight','Comet','Apex','Lucky','Maverick','Crimson','Silver','Thunder','Vortex','Tycoon','Ember','Cobalt','Onyx'];
const NAMES_B = ['Runner','Spirit','Blaze','Surge','Justice','Stride','Drift','Kicker','Heart','Vanguard','Spark','Crown','Talon','Reign','Bolt','Glory','Mirage','Quest','Halo','Echo'];
function randomName() {
  return NAMES_A[Math.floor(Math.random()*NAMES_A.length)] + ' ' + NAMES_B[Math.floor(Math.random()*NAMES_B.length)];
}

// Distinct vivid colors per gate
const COLORS = [
  0xFFD740, // gold
  0x7BB6FF, // sky
  0xff5b6b, // red
  0x7BFF8F, // mint
  0xC5B5FF, // lavender
  0xFFB347, // orange
  0xff80c8, // pink
  0x39FF14, // neon green
];

// ──────────────────────────────────────────────────────────────────────
// Game state
// ──────────────────────────────────────────────────────────────────────
const state = {
  balance: loadBalance(),
  raceNum: 1,
  horses: [],
  bets: {},     // horseId → wager
  raceActive: false,
  raceStartTime: 0,
  finished: [],
};

function loadBalance() {
  try { var v = parseInt(localStorage.getItem('derby_balance')); return isNaN(v) ? 1000 : v; } catch(_){ return 1000; }
}
function saveBalance() { try { localStorage.setItem('derby_balance', String(state.balance)); } catch(_){} }

function generateHorses() {
  state.horses = [];
  for (let i = 0; i < N_HORSES; i++) {
    // Stats — speed = base running speed (m/s), stamina = how well speed holds
    // past 70% of race, luck = per-frame noise factor
    const speed   = 14 + Math.random() * 4;       // 14-18 m/s base
    const stamina = 0.55 + Math.random() * 0.4;   // 0.55-0.95
    const luck    = 0.05 + Math.random() * 0.10;  // 0.05-0.15 noise σ
    // Composite power score determines true ranking probability
    const power = speed * (0.6 + 0.4 * stamina);
    // Form — last 5 finishes (1=best)
    const form = Array.from({length:5}, () => Math.ceil(Math.random()*6));
    state.horses.push({
      id: i, gate: i + 1, name: randomName(),
      color: COLORS[i % COLORS.length],
      speed, stamina, luck, power, form,
      x: 0,        // distance traveled along track
      lane: i,     // outer lane idx
      mesh: null,
    });
  }
  // Odds derived from power, normalized
  const totalInvPower = state.horses.reduce((s,h) => s + 1/h.power, 0);
  state.horses.forEach(h => {
    const trueProb = (1/h.power) / totalInvPower;
    // Add house edge of ~15%
    const oddsDecimal = (1 / trueProb) * 0.85;
    h.odds = oddsDecimal;
    h.oddsAm = decimalToAmerican(oddsDecimal);
  });
  state.horses.sort((a,b) => a.odds - b.odds); // favorite first
  state.horses.forEach((h, i) => h.displayOrder = i);
  state.bets = {};
  state.finished = [];
}

function decimalToAmerican(d) {
  // d is decimal odds (e.g. 2.5 = +150 / 3.5 = +250 / 1.5 = -200)
  if (d >= 2) return '+' + Math.round((d - 1) * 100);
  return '-' + Math.round(100 / (d - 1));
}

// ──────────────────────────────────────────────────────────────────────
// Three.js scene
// ──────────────────────────────────────────────────────────────────────
let scene, camera, renderer, composer, clock;
let trackGroup, horseMeshes = [], grandstandGroup;

// Real horse GLB from three.js's public examples assets (CC0).
// Pre-rigged with a gallop morph-target animation we'll drive via AnimationMixer.
let LOADED_HORSE = null;
let LOADED_HORSE_CLIP = null;
async function loadHorseModel() {
  const url = 'https://threejs.org/examples/models/gltf/Horse.glb';
  return new Promise((resolve) => {
    const loader = new GLTFLoader();
    loader.load(url, (gltf) => {
      LOADED_HORSE = gltf.scene;
      LOADED_HORSE_CLIP = gltf.animations && gltf.animations[0] ? gltf.animations[0] : null;
      // The original mesh is enormous — base scale to fit our 2-3m horse footprint.
      // It also faces +Z by default; we'll rotate clones to face +X to match our track.
      resolve(true);
    }, undefined, (err) => {
      console.warn('horse model load failed, using procedural fallback', err);
      resolve(false);
    });
  });
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1a2c);
  scene.fog = new THREE.Fog(0x0a1a2c, 200, 600);

  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 80, 180);
  camera.lookAt(0, 0, 0);

  // Lighting — warm key light low (golden-hour) + cool fill from above
  const sun = new THREE.DirectionalLight(0xffe4a0, 1.4);
  sun.position.set(80, 100, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -200;
  sun.shadow.camera.right = 200;
  sun.shadow.camera.top = 200;
  sun.shadow.camera.bottom = -200;
  scene.add(sun);

  const fill = new THREE.HemisphereLight(0xbcd4ff, 0x2c4070, 0.6);
  scene.add(fill);

  // Sky
  const skyGeo = new THREE.SphereGeometry(500, 32, 16);
  const skyMat = new THREE.MeshBasicMaterial({
    color: 0x1a2440, side: THREE.BackSide,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // Sky HDRI — real sunset/sunrise sky from three.js public assets (CC0).
  // Loads async; default scene environment is RoomEnvironment until HDRI lands
  // so the scene never looks broken during the load.
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  new RGBELoader().load(
    'https://threejs.org/examples/textures/equirectangular/spruit_sunrise_1k.hdr',
    (hdr) => {
      hdr.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = hdr;
      scene.background = hdr;
      // Tone down the SkySphere we added — HDRI background replaces it
      const sky = scene.getObjectByName('skyDome');
      if (sky) sky.visible = false;
    },
    undefined,
    () => { /* fallback to RoomEnvironment if HDRI fails */ }
  );

  // Bloom postprocessing — makes the jockey silks + finish line glow cinematically
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.6, 0.9);
  composer.addPass(bloom);

  buildTrack();
  buildGrandstand();
  buildStartGates();
  buildHorses();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function buildTrack() {
  trackGroup = new THREE.Group();

  // Infield (oval green)
  const infieldShape = new THREE.Shape();
  infieldShape.moveTo(-TRACK_STRAIGHT/2, -TRACK_RADIUS);
  infieldShape.lineTo( TRACK_STRAIGHT/2, -TRACK_RADIUS);
  infieldShape.absarc( TRACK_STRAIGHT/2, 0, TRACK_RADIUS, -Math.PI/2, Math.PI/2);
  infieldShape.lineTo(-TRACK_STRAIGHT/2,  TRACK_RADIUS);
  infieldShape.absarc(-TRACK_STRAIGHT/2, 0, TRACK_RADIUS, Math.PI/2, -Math.PI/2);
  const infieldGeo = new THREE.ShapeGeometry(infieldShape);
  const infieldMat = new THREE.MeshStandardMaterial({ color: 0x2d6a3e, roughness: 0.95 });
  const infield = new THREE.Mesh(infieldGeo, infieldMat);
  infield.rotation.x = -Math.PI/2;
  infield.position.y = 0.05;
  infield.receiveShadow = true;
  trackGroup.add(infield);

  // Track surface — slightly larger oval, dirt brown
  const TRACK_WIDTH = 14;
  const trackOuterShape = new THREE.Shape();
  const oR = TRACK_RADIUS + TRACK_WIDTH;
  trackOuterShape.moveTo(-TRACK_STRAIGHT/2, -oR);
  trackOuterShape.lineTo( TRACK_STRAIGHT/2, -oR);
  trackOuterShape.absarc( TRACK_STRAIGHT/2, 0, oR, -Math.PI/2, Math.PI/2);
  trackOuterShape.lineTo(-TRACK_STRAIGHT/2,  oR);
  trackOuterShape.absarc(-TRACK_STRAIGHT/2, 0, oR, Math.PI/2, -Math.PI/2);
  const trackHole = new THREE.Path();
  trackHole.moveTo(-TRACK_STRAIGHT/2, -TRACK_RADIUS);
  trackHole.lineTo( TRACK_STRAIGHT/2, -TRACK_RADIUS);
  trackHole.absarc( TRACK_STRAIGHT/2, 0, TRACK_RADIUS, -Math.PI/2, Math.PI/2);
  trackHole.lineTo(-TRACK_STRAIGHT/2,  TRACK_RADIUS);
  trackHole.absarc(-TRACK_STRAIGHT/2, 0, TRACK_RADIUS, Math.PI/2, -Math.PI/2);
  trackOuterShape.holes.push(trackHole);
  const trackGeo = new THREE.ShapeGeometry(trackOuterShape);
  const trackMat = new THREE.MeshStandardMaterial({ color: 0x8b6035, roughness: 1.0 });
  const track = new THREE.Mesh(trackGeo, trackMat);
  track.rotation.x = -Math.PI/2;
  track.position.y = 0.02;
  track.receiveShadow = true;
  trackGroup.add(track);

  // Lane lines (white)
  for (let lane = 1; lane < N_HORSES; lane++) {
    const r = TRACK_RADIUS + (TRACK_WIDTH / N_HORSES) * lane;
    const laneShape = new THREE.Shape();
    laneShape.moveTo(-TRACK_STRAIGHT/2, -r);
    laneShape.lineTo( TRACK_STRAIGHT/2, -r);
    laneShape.absarc( TRACK_STRAIGHT/2, 0, r, -Math.PI/2, Math.PI/2);
    laneShape.lineTo(-TRACK_STRAIGHT/2,  r);
    laneShape.absarc(-TRACK_STRAIGHT/2, 0, r, Math.PI/2, -Math.PI/2);
    const laneHole = new THREE.Path();
    const ri = r - 0.15;
    laneHole.moveTo(-TRACK_STRAIGHT/2, -ri);
    laneHole.lineTo( TRACK_STRAIGHT/2, -ri);
    laneHole.absarc( TRACK_STRAIGHT/2, 0, ri, -Math.PI/2, Math.PI/2);
    laneHole.lineTo(-TRACK_STRAIGHT/2,  ri);
    laneHole.absarc(-TRACK_STRAIGHT/2, 0, ri, Math.PI/2, -Math.PI/2);
    laneShape.holes.push(laneHole);
    const laneGeo = new THREE.ShapeGeometry(laneShape);
    const laneMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
    const laneMesh = new THREE.Mesh(laneGeo, laneMat);
    laneMesh.rotation.x = -Math.PI/2;
    laneMesh.position.y = 0.05;
    trackGroup.add(laneMesh);
  }

  // Finish line — white stripe across all lanes at x=0 on the home stretch (z=-r)
  const finishGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 1.5);
  const finishMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const finish = new THREE.Mesh(finishGeo, finishMat);
  finish.rotation.x = -Math.PI/2;
  finish.position.set(0, 0.06, -(TRACK_RADIUS + TRACK_WIDTH/2));
  trackGroup.add(finish);

  // Rail posts
  for (let i = 0; i < 48; i++) {
    const t = i / 48;
    const pos = trackPosition(t * TRACK_LEN, 0);
    const railGeo = new THREE.BoxGeometry(0.4, 1.0, 0.4);
    const railMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const post = new THREE.Mesh(railGeo, railMat);
    post.position.set(pos.x, 0.5, pos.z + (pos.z < 0 ? -1 : 1) * (pos.z === 0 ? 0 : 0.5));
    trackGroup.add(post);
  }

  scene.add(trackGroup);
}

function buildGrandstand() {
  grandstandGroup = new THREE.Group();
  // Tiered stands — 3 rows of bleachers at increasing height behind the finish
  const standZ = -(TRACK_RADIUS + 22);
  for (let row = 0; row < 4; row++) {
    const tier = new THREE.Mesh(
      new THREE.BoxGeometry(90, 2.5, 4.5),
      new THREE.MeshStandardMaterial({ color: 0x3a4a6a, roughness: 0.85 })
    );
    tier.position.set(0, 1.5 + row * 2.2, standZ - row * 3.0);
    tier.castShadow = true;
    tier.receiveShadow = true;
    grandstandGroup.add(tier);
  }
  // Roof — slanted, with pulse-orange accent strip glowing under it
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(94, 0.6, 22),
    new THREE.MeshStandardMaterial({ color: 0x1a2238, roughness: 0.6 })
  );
  roof.position.set(0, 12.5, standZ - 4);
  roof.rotation.x = -0.18;
  grandstandGroup.add(roof);
  const roofLight = new THREE.Mesh(
    new THREE.BoxGeometry(92, 0.3, 1.5),
    new THREE.MeshBasicMaterial({ color: 0xE8710A })
  );
  roofLight.position.set(0, 11.4, standZ + 5);
  grandstandGroup.add(roofLight);

  // Crowd — many small bobbing boxes in 5 rows across the bleachers
  const crowd = new THREE.Group();
  const crowdColors = [0xff5b6b, 0x7BB6FF, 0xFFD740, 0x7BFF8F, 0xC5B5FF, 0xFFB347, 0xff80c8, 0xffffff, 0x39FF14, 0xE8710A];
  for (let row = 0; row < 4; row++) {
    const y = 3.0 + row * 2.2;
    const z = standZ - row * 3.0 + 1.4;
    const count = 60 - row * 4;
    for (let i = 0; i < count; i++) {
      const x = -42 + (84 / count) * i + (Math.random() - 0.5) * 0.8;
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.7, 0.45),
        new THREE.MeshStandardMaterial({ color: crowdColors[Math.floor(Math.random()*crowdColors.length)], roughness: 0.8 })
      );
      head.position.set(x, y, z);
      head._bobPhase = Math.random() * Math.PI * 2;
      head._bobBase = y;
      crowd.add(head);
    }
  }
  grandstandGroup.add(crowd);
  grandstandGroup._crowd = crowd;

  // Stadium light poles — 4 around the track
  const polePositions = [
    [-TRACK_STRAIGHT/2 - 20, 0,  TRACK_RADIUS + 25],
    [ TRACK_STRAIGHT/2 + 20, 0,  TRACK_RADIUS + 25],
    [-TRACK_STRAIGHT/2 - 20, 0, -TRACK_RADIUS - 25],
    [ TRACK_STRAIGHT/2 + 20, 0, -TRACK_RADIUS - 25],
  ];
  polePositions.forEach(p => {
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 28, 8),
      new THREE.MeshStandardMaterial({ color: 0x222a3e })
    );
    pole.position.set(p[0], 14, p[2]);
    grandstandGroup.add(pole);
    // Light head — emissive box, gives the impression of a stadium spotlight
    const lightHead = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1.0, 1.8),
      new THREE.MeshBasicMaterial({ color: 0xfff4d4 })
    );
    lightHead.position.set(p[0], 28, p[2]);
    grandstandGroup.add(lightHead);
    // Actual point light from each pole for ambient bath
    const pl = new THREE.PointLight(0xfff0c4, 0.5, 250, 1.5);
    pl.position.set(p[0], 27, p[2]);
    grandstandGroup.add(pl);
  });

  scene.add(grandstandGroup);
}

// Start gates — 6 numbered boxes at the start line that animate up (open) when race begins
let startGatesGroup = null;
function buildStartGates() {
  if (startGatesGroup) scene.remove(startGatesGroup);
  startGatesGroup = new THREE.Group();
  // Position: at the start of the bottom straight (x = -TRACK_STRAIGHT/2, z varies by lane)
  for (let i = 0; i < N_HORSES; i++) {
    const lanePos = trackPosition(0, i);
    const gate = new THREE.Group();
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 3.5, 0.4),

      new THREE.BoxGeometry(0.1, 2.2, 1.6),

// 80s/90s Konami arcade-mascot chibi horses. Big eyes, bouncy proportions,
// bright primary colors with toon-outline (back-side hull) — the kind of
// horse you'd see in a Track & Field cabinet or Castlevania II credits.
// Realistic GLTF model is intentionally skipped per owner direction.
function buildHorses() {
  horseMeshes.forEach(g => scene.remove(g));
  horseMeshes = [];
  buildHorsesChibi();
}

// Outline helper — clones a mesh, scales slightly, paints black on back side
// so it shows as a chunky cartoon outline around the silhouette.
function addOutline(parent, mesh, thickness) {
  const t = thickness != null ? thickness : 1.06;
  const outline = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })
  );
  outline.scale.set(t, t, t);
  outline.position.copy(mesh.position);
  outline.rotation.copy(mesh.rotation);
  parent.add(outline);
  return outline;
}

function buildHorsesChibi() {
  state.horses.forEach(h => {
    const g = new THREE.Group();

    // Bright flat color per gate, almost no roughness — Konami sprite vibe
    const coatMat = new THREE.MeshLambertMaterial({ color: h.color, emissive: h.color, emissiveIntensity: 0.18 });
    const darkMat = new THREE.MeshLambertMaterial({ color: 0x101820 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

    // ── Stout chibi BODY — fat cylinder oriented along X
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 1.2, 8, 14), coatMat);
    body.rotation.z = Math.PI / 2;
    body.position.set(-0.15, 1.5, 0);
    body.castShadow = true;
    g.add(body);
    addOutline(g, body, 1.08);

    // ── OVERSIZED HEAD — big round sphere (40% of body)
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.92, 18, 14), coatMat);
    head.position.set(1.5, 2.25, 0);
    head.castShadow = true;
    g.add(head);
    addOutline(g, head, 1.06);

    // Snout — small protrusion
    const snout = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.3, 6, 10), coatMat);
    snout.rotation.z = Math.PI / 2;
    snout.position.set(2.25, 2.1, 0);
    g.add(snout);
    addOutline(g, snout, 1.08);
    // Nostril dots
    [0.18, -0.18].forEach(zz => {
      const n = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), blackMat);
      n.position.set(2.55, 2.08, zz);
      g.add(n);
    });

    // ── CARTOON EYES — huge white spheres with black pupils
    const makeEye = (z) => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 10), whiteMat);
      eye.position.set(1.95, 2.45, z);
      g.add(eye);
      // Black outline ring
      const ring = new THREE.Mesh(new THREE.SphereGeometry(0.31, 14, 10), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }));
      ring.position.copy(eye.position);
      g.add(ring);
      // Pupil — small black dot in front
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), blackMat);
      pupil.position.set(2.13, 2.45, z + (z > 0 ? 0.05 : -0.05));
      g.add(pupil);
      // Sparkle (tiny white dot for cartoony shine)
      const sparkle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), whiteMat);
      sparkle.position.set(2.22, 2.52, z + (z > 0 ? 0.08 : -0.08));
      g.add(sparkle);
      return eye;
    };
    h._eyeL = makeEye( 0.55);
    h._eyeR = makeEye(-0.55);

    // ── EARS — floppy triangle cones on top of head
    [0.45, -0.45].forEach(zz => {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.55, 5), coatMat);
      ear.position.set(1.35, 3.05, zz);
      ear.rotation.z = zz > 0 ? -0.2 : 0.2;
      g.add(ear);
      addOutline(g, ear, 1.1);
    });

    // ── MANE — chunky dark spheres along the neck/back from head to body
    [[1.15, 2.7, 0],[0.85, 2.55, 0],[0.55, 2.35, 0]].forEach(p => {
      const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), darkMat);
      tuft.position.set(p[0], p[1], p[2]);
      g.add(tuft);
    });

    // ── TAIL — fat dark sphere/teardrop hanging off rear
    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 8), darkMat);
    tail.position.set(-1.5, 1.25, 0);
    tail.scale.set(0.6, 1.2, 0.6);
    g.add(tail);
    h._tail = tail;

    // ── JOCKEY — round body with happy helmet face
    const jockBody = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10), coatMat);
    jockBody.position.set(0.2, 2.6, 0);
    jockBody.scale.set(1, 1.1, 0.9);
    jockBody.castShadow = true;
    g.add(jockBody);
    addOutline(g, jockBody, 1.08);
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10), coatMat);
    helmet.position.set(0.2, 3.15, 0);
    g.add(helmet);
    addOutline(g, helmet, 1.08);
    // Helmet visor
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.62), darkMat);
    visor.position.set(0.32, 3.13, 0);
    g.add(visor);
    // Gate number disc on helmet top — bright white disc
    const numDisc = new THREE.Mesh(new THREE.CircleGeometry(0.22, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    numDisc.position.set(0.2, 3.55, 0);
    numDisc.rotation.x = -Math.PI / 2;
    g.add(numDisc);

    // ── LEGS — 4 thick stubby cylinders, animated as squash-and-bounce
    h._legs = [];
    const legAnchors = [
      { x:  0.55, z:  0.45, side: 'front-r' },
      { x:  0.55, z: -0.45, side: 'front-l' },
      { x: -0.55, z:  0.45, side: 'back-r'  },
      { x: -0.55, z: -0.45, side: 'back-l'  },
    ];
    legAnchors.forEach((a, i) => {
      const leg = new THREE.Group();
      const part = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.7, 6, 8), coatMat);
      part.position.y = -0.4;
      leg.add(part);
      addOutline(leg, part, 1.1);
      // Hoof (dark cap)
      const hoof = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), darkMat);
      hoof.position.y = -0.85;
      hoof.scale.set(1, 0.55, 1);
      leg.add(hoof);
      leg.position.set(a.x, 1.0, a.z);
      g.add(leg);
      h._legs.push({ group: leg, phase: i * Math.PI / 2, anchor: a });
    });

    // ── GROUND LANE-COLOR DISC — chunky color ring under the horse
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.0, 1.55, 24),
      new THREE.MeshBasicMaterial({ color: h.color, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.08;
    g.add(ring);

    addDustTrail(h);

    h.mesh = g;
    h._isChibi = true;
    scene.add(g);
    horseMeshes.push(g);
  });
}

function buildHorsesFromModel() {
  state.horses.forEach(h => {
    const g = new THREE.Group();
    // Clone the loaded horse and rescale to ~2.8m long
    const horse = LOADED_HORSE.clone(true);
    horse.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }});
    horse.scale.setScalar(0.018);
    horse.rotation.y = Math.PI / 2; // face +X (along track direction)
    horse.position.y = 0;
    g.add(horse);

    // AnimationMixer for built-in gallop morph clip
    const mixer = new THREE.AnimationMixer(horse);
    const action = mixer.clipAction(LOADED_HORSE_CLIP);
    action.play();
    action.paused = true; // unpause + speed up when race starts
    h._mixer = mixer;
    h._action = action;

    // Saddle blanket overlay in gate color (small floating colored slab on back —
    // makes each horse identifiable in a dark race without recoloring the model)
    const blanketMat = new THREE.MeshStandardMaterial({ color: h.color, emissive: h.color, emissiveIntensity: 0.4, roughness: 0.45 });
    const blanket = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.18, 1.1), blanketMat);
    blanket.position.set(0.0, 2.0, 0);
    blanket.castShadow = true;
    g.add(blanket);

    // Jockey on top of blanket — torso + helmet
    const jockeyBody = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.55), blanketMat);
    jockeyBody.position.set(0.1, 2.6, 0);
    jockeyBody.castShadow = true;
    g.add(jockeyBody);
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 10), blanketMat);
    helmet.position.set(0.1, 3.18, 0);
    helmet.castShadow = true;
    g.add(helmet);
    // White gate number plate
    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.16, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.45 })
    );
    plate.position.set(-0.2, 2.1, 0.6);
    g.add(plate);

    // Ground lane-color glow ring directly under the horse — visible from above
    const ringGeo = new THREE.RingGeometry(1.0, 1.4, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: h.color, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.08;
    g.add(ring);

    // Dust trail particles (same as procedural — kept)
    addDustTrail(h);

    h.mesh = g;
    h._modelGroup = horse;
    scene.add(g);
    horseMeshes.push(g);
  });
}

function addDustTrail(h) {
  const dustGeo = new THREE.BufferGeometry();
  const N = 60;
  const dustPos = new Float32Array(N * 3);
  const dustLife = new Float32Array(N);
  for (let k = 0; k < N; k++) { dustPos[k*3+1] = -100; dustLife[k] = 0; }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: 0xc9a677, size: 0.95, transparent: true, opacity: 0.6, sizeAttenuation: true, depthWrite: false,
  }));
  scene.add(dust);
  h._dust = { points: dust, life: dustLife, next: 0 };
}

function buildHorsesProcedural() {
  state.horses.forEach(h => {
    const g = new THREE.Group();

    // Coat color material (slight roughness — looks like real coat under sun)
    const coat = new THREE.MeshStandardMaterial({ color: 0x6b3a1a, roughness: 0.75, metalness: 0.04 });
    // Most horses are brown/bay/chestnut — but we still want each gate distinct.
    // Solution: coat = horse-realistic color, but blanket/saddle pad + jockey silks
    // = the bright gate color. Gives visual ID without making horses look like crayons.
    const bayPalette = [0x5a2e12, 0x6b3a1a, 0x4a2810, 0x7a4520, 0x3a2010, 0x8a5028, 0x2e1808, 0x6e4528];
    coat.color.setHex(bayPalette[h.id % bayPalette.length]);

    const accent = new THREE.MeshStandardMaterial({ color: h.color, roughness: 0.5, metalness: 0.1, emissive: h.color, emissiveIntensity: 0.18 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x0e0a06, roughness: 0.7 });

    // ── Body — long, slightly tapered (using two stacked boxes for taper feel)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.05, 0.95), coat);
    torso.position.y = 1.55;
    torso.castShadow = true;
    g.add(torso);
    // Rump cap (shorter, taller, slightly higher — gives that horse haunch shape)
    const rump = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.2, 0.9), coat);
    rump.position.set(-1.0, 1.6, 0);
    rump.castShadow = true;
    g.add(rump);
    // Chest cap (front of torso, slightly forward-protruding)
    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.15, 0.95), coat);
    chest.position.set(1.05, 1.55, 0);
    chest.castShadow = true;
    g.add(chest);

    // ── Saddle blanket (bright gate color, lays on the horse's back)
    const blanket = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 1.05), accent);
    blanket.position.set(0.2, 2.15, 0);
    blanket.castShadow = true;
    g.add(blanket);

    // ── Neck — angled up and forward from shoulders (~45°)
    const neck = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.3, 0.55), coat);
    neck.position.set(1.65, 2.25, 0);
    neck.rotation.z = Math.PI / 5; // tilt forward
    neck.castShadow = true;
    g.add(neck);

    // ── Head (wedge — thinner front, taller back)
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.45), coat);
    head.position.set(2.4, 2.85, 0);
    head.rotation.z = -0.15;
    head.castShadow = true;
    g.add(head);
    // Muzzle (smaller, lighter)
    const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.3, 0.36), coat);
    muzzle.position.set(2.8, 2.7, 0);
    g.add(muzzle);

    // ── Ears (two small triangular boxes on head top)
    [0.18, -0.18].forEach(z => {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.28, 4), coat);
      ear.position.set(2.25, 3.15, z);
      g.add(ear);
    });

    // ── Mane — dark slab along the neck top
    const mane = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.15, 0.62), dark);
    mane.position.set(1.6, 2.4, 0);
    mane.rotation.z = Math.PI / 5;
    g.add(mane);
    // Forelock between the ears
    const forelock = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.18, 0.4), dark);
    forelock.position.set(2.1, 3.08, 0);
    g.add(forelock);

    // ── Tail — angled-down dark slab from rear
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.1, 0.4), dark);
    tail.position.set(-1.55, 1.45, 0);
    tail.rotation.z = -Math.PI / 4;
    g.add(tail);
    h._tail = tail;

    // ── Jockey — body torso (silk color) + helmet (silk color) + arms forward
    const jockeyBody = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.55), accent);
    jockeyBody.position.set(0.4, 2.85, 0);
    jockeyBody.castShadow = true;
    g.add(jockeyBody);
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10), accent);
    helmet.position.set(0.4, 3.45, 0);
    helmet.castShadow = true;
    g.add(helmet);
    // Helmet visor (thin dark strip)
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.55), dark);
    visor.position.set(0.5, 3.4, 0);
    g.add(visor);
    // Arms reaching for reins
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.18, 0.18), accent);
    arm.position.set(1.0, 2.85, 0);
    arm.rotation.z = -0.25;
    g.add(arm);

    // Gate-number plate on the saddle pad (small bright cube — readable from above)
    const numPlate = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.4), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 }));
    numPlate.position.set(0.1, 2.25, 0.58);
    g.add(numPlate);

    // ── Legs — 4 thin tall legs, with upper + lower segments for a proper joint
    h._legs = [];
    // Order: front-left, front-right, back-left, back-right
    const legAnchors = [
      { x:  1.0, z:  0.32 }, // FL
      { x:  1.0, z: -0.32 }, // FR
      { x: -0.85, z:  0.32 }, // BL
      { x: -0.85, z: -0.32 }, // BR
    ];
    legAnchors.forEach((a, i) => {
      const legGroup = new THREE.Group();
      // Upper leg
      const upper = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.85, 0.28), coat);
      upper.position.y = -0.45;
      upper.castShadow = true;
      legGroup.add(upper);
      // Lower leg (hoof segment, slightly darker)
      const lower = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.8, 0.24), coat);
      lower.position.y = -1.25;
      lower.castShadow = true;
      legGroup.add(lower);
      // Hoof — small dark cap
      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.16, 0.3), dark);
      hoof.position.y = -1.7;
      legGroup.add(hoof);
      legGroup.position.set(a.x, 1.0, a.z);
      g.add(legGroup);
      h._legs.push({ group: legGroup, phase: i * Math.PI / 2 });
    });

    addDustTrail(h);

    h.mesh = g;
    scene.add(g);
    horseMeshes.push(g);
  });
}

// Parametric track position. d is distance along the path (m), laneOffset
// pushes outward from center radius. Track total length = 2 * straight + 2π * R.
function trackPosition(d, laneOffset) {
  const R = TRACK_RADIUS + 1 + laneOffset * (12 / N_HORSES); // inner edge + lane shift
  const halfStraight = TRACK_STRAIGHT / 2;
  const arcLen = Math.PI * R;
  const totalLen = 2 * TRACK_STRAIGHT + 2 * arcLen;
  d = ((d % totalLen) + totalLen) % totalLen; // wrap
  // Sequence: bottom straight (left→right) → right arc → top straight (right→left) → left arc
  if (d < TRACK_STRAIGHT) {
    return { x: -halfStraight + d, z: R, heading: 0 };
  }
  d -= TRACK_STRAIGHT;
  if (d < arcLen) {
    const angle = d / R - Math.PI/2; // from -π/2 (start) to π/2 (end)
    return { x: halfStraight + R * Math.cos(angle), z: R * Math.sin(angle), heading: angle + Math.PI/2 };
  }
  d -= arcLen;
  if (d < TRACK_STRAIGHT) {
    return { x: halfStraight - d, z: -R, heading: Math.PI };
  }
  d -= TRACK_STRAIGHT;
  const angle = d / R + Math.PI/2;
  return { x: -halfStraight + R * Math.cos(angle), z: R * Math.sin(angle), heading: angle + Math.PI/2 };
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
}

// ──────────────────────────────────────────────────────────────────────
// Race loop — frame-by-frame stat-driven simulation
// ──────────────────────────────────────────────────────────────────────
function startRace() {
  state.raceActive = true;
  state.raceStartTime = performance.now();
  state.finished = [];
  state.horses.forEach(h => h.x = 0);
  document.getElementById('leaderboard').style.display = 'block';
  document.getElementById('paddock').style.display = 'none';
  document.getElementById('result-banner').style.display = 'none';
}

function stepRace(dt) {
  // dt in seconds
  const T = (performance.now() - state.raceStartTime) / 1000;
  state.horses.forEach(h => {
    if (state.finished.includes(h.id)) return;
    // Speed curve: base × stamina decay past midway × per-frame Gaussian noise
    const progress = h.x / TRACK_LEN;
    const fatigueFactor = progress < 0.5 ? 1.0 : 1.0 - (1 - h.stamina) * (progress - 0.5) * 1.5;
    const noise = 1 + (Math.random() - 0.5) * 2 * h.luck;
    const v = h.speed * Math.max(0.4, fatigueFactor) * noise;
    h.x += v * dt;
    if (h.x >= TRACK_LEN) {
      state.finished.push(h.id);
      h.finishTime = T;
    }
  });
  if (state.finished.length === N_HORSES) endRace();
}

function endRace() {
  state.raceActive = false;
  const winnerId = state.finished[0];
  const winner = state.horses.find(h => h.id === winnerId);
  // Settle bets
  let totalPayout = 0;
  Object.keys(state.bets).forEach(hid => {
    if (parseInt(hid) === winnerId) {
      const bet = state.bets[hid];
      const horse = state.horses.find(x => x.id === parseInt(hid));
      totalPayout += Math.round(bet * horse.odds);
    }
  });
  const totalWagered = Object.values(state.bets).reduce((s,v) => s+v, 0);
  const net = totalPayout - totalWagered;
  state.balance += totalPayout; // bets were already deducted at place-time
  saveBalance();
  // Show result banner
  const rb = document.getElementById('result-banner');
  const payoutCls = net > 0 ? 'payout' : net < 0 ? 'payout loss' : 'payout';
  const payoutTxt = totalWagered === 0
    ? 'No bets placed.'
    : (net > 0 ? '+$' + net : (net < 0 ? '-$' + Math.abs(net) : 'Push'));
  rb.innerHTML =
      '<div class="title">Winner — Race ' + state.raceNum + '</div>'
    + '<div class="winner" style="color:#' + winner.color.toString(16).padStart(6,'0') + ';">#' + winner.gate + ' ' + winner.name + '</div>'
    + '<div class="' + payoutCls + '">' + payoutTxt + '</div>'
    + '<button onclick="window.__newRace()">Run Another Race</button>';
  rb.style.display = 'block';
}

window.__newRace = function() {
  state.raceNum++;
  generateHorses();
  buildHorses();
  document.getElementById('leaderboard').style.display = 'none';
  document.getElementById('result-banner').style.display = 'none';
  document.getElementById('hud-race-num').textContent = state.raceNum;
  renderPaddock();
};

function animate() {
  const dt = clock.getDelta();
  if (state.raceActive) stepRace(dt);
  // Drive built-in horse model gallop animation if present
  state.horses.forEach(h => {
    if (h._mixer) {
      if (state.raceActive) {
        h._action.paused = false;
        // Speed the gait with the horse's actual speed (cosmetic but feels right)
        h._mixer.timeScale = 1.0 + (h.speed - 14) * 0.18;
      } else {
        h._action.paused = true;
      }
      h._mixer.update(dt);
    }
  });
  // Bob the crowd
  if (grandstandGroup && grandstandGroup._crowd) {
    const t = performance.now() * 0.003;
    grandstandGroup._crowd.children.forEach((c, i) => {
      if (c._bobBase != null) c.position.y = c._bobBase + Math.sin(t + c._bobPhase) * 0.18;
    });
  }
  // Open the start gates over the first second of the race
  if (startGatesGroup) {
    const sinceStart = state.raceActive ? (performance.now() - state.raceStartTime) / 1000 : -1;
    startGatesGroup.children.forEach((gate, i) => {
      const target = (sinceStart >= 0 && sinceStart < 1.5) ? sinceStart * 4 : (sinceStart >= 1.5 ? 6 : 0);
      const door = gate.children[1];
      if (door) door.position.y = 1.5 + target;
    });
  }
  // Update horse mesh positions
  state.horses.forEach(h => {
    if (!h.mesh) return;
    const p = trackPosition(h.x, h.lane);
    h.mesh.position.set(p.x, 0, p.z);
    h.mesh.rotation.y = -p.heading;
    // CHIBI gallop animation — exaggerated bounce + squash & stretch + leg pump
    if (state.raceActive && h._legs) {
      const t = performance.now() * 0.022;
      h._legs.forEach((leg, i) => {
        // Front-pair and back-pair alternate as one "two-legged" bounce
        const pair = (leg.anchor.side.indexOf('front') === 0) ? 0 : Math.PI;
        const swing = Math.sin(t * 2 + h.id * 0.5 + pair);
        leg.group.position.y = 1.0 + Math.max(0, swing) * 0.45;
        leg.group.rotation.x = -swing * 0.4;
      });
      // Tail wags expressively
      if (h._tail) h._tail.rotation.z = Math.sin(t * 3) * 0.25;
      // Body bounce — high vertical oscillation gives that bouncy chibi gait
      h.mesh.position.y = Math.abs(Math.sin(t * 2 + h.id)) * 0.32;
      // Random blink (eyes squish closed briefly)
      const blink = Math.sin(t * 0.2 + h.id) > 0.97 ? 0.2 : 1.0;
      if (h._eyeL) h._eyeL.scale.y = blink;
      if (h._eyeR) h._eyeR.scale.y = blink;
      // Dust emission — eject one particle per frame at horse rear, fade & drift
      const dust = h._dust;
      if (dust) {
        const pos = dust.points.geometry.attributes.position.array;
        // Spawn new particle behind horse
        const rearX = h.mesh.position.x - Math.cos(-h.mesh.rotation.y) * 1.6;
        const rearZ = h.mesh.position.z + Math.sin(-h.mesh.rotation.y) * 1.6;
        const idx = dust.next % 60;
        pos[idx*3]   = rearX + (Math.random()-0.5) * 0.3;
        pos[idx*3+1] = 0.3 + Math.random() * 0.2;
        pos[idx*3+2] = rearZ + (Math.random()-0.5) * 0.3;
        dust.life[idx] = 1.0;
        dust.next++;
        // Fade & drift all particles
        for (let k = 0; k < 60; k++) {
          if (dust.life[k] > 0) {
            dust.life[k] -= dt * 0.85;
            pos[k*3+1] += dt * 0.6; // rise as it dissipates
          } else if (pos[k*3+1] > -50) {
            pos[k*3+1] = -100; // park off-screen
          }
        }
        dust.points.geometry.attributes.position.needsUpdate = true;
        dust.points.material.opacity = 0.55;
      }
    } else if (h._legs) {
      // Idle: legs at rest, body steady (procedural horses only)
      h._legs.forEach(leg => { leg.group.position.y = 1.0; leg.group.rotation.x = 0; });
      if (h.mesh) h.mesh.position.y = 0;
    }
  });
  // ── SIDE-SCROLLER CAMERA — always perpendicular to the track at the pack's
  // position, from a fixed outside-of-track offset. No mode switches.
  // Pre-race the pack sits at the gates, so it parks at the start line.
  {
    const ref = state.raceActive
      ? state.horses.slice().sort((a,b) => b.x - a.x)[0]  // lead during race
      : state.horses[0];                                    // gate-3-ish pre-race
    if (ref) {
      const refX = state.raceActive ? ref.x : 0;
      const tp = trackPosition(refX, Math.floor(N_HORSES/2));
      // Outward normal (perpendicular to heading, pointing AWAY from oval center).
      // heading is the tangent direction; rotate +π/2 for outward normal.
      const nx = Math.sin(tp.heading);
      const nz = -Math.cos(tp.heading);
      const camDist = 38;   // distance from track to camera
      const camHeight = 7;  // height above ground
      const target = new THREE.Vector3(tp.x + nx * camDist, camHeight, tp.z + nz * camDist);
      camera.position.lerp(target, state.raceActive ? 0.12 : 0.05);
      camera.lookAt(tp.x, 2.5, tp.z);
    }
  }
  // Update leaderboard
  if (state.raceActive) updateLeaderboard();
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

function updateLeaderboard() {
  const sorted = state.horses.slice().sort((a, b) => b.x - a.x);
  const leadX = sorted[0].x;
  const html = sorted.map((h, i) => {
    const gap = i === 0 ? '—' : (leadX - h.x).toFixed(1) + 'm';
    return '<div class="lb-row">'
      + '<span class="pos">' + (i+1) + '</span>'
      + '<span class="color-chip" style="background:#' + h.color.toString(16).padStart(6,'0') + ';"></span>'
      + '<span class="nm">' + escHtml(h.name) + '</span>'
      + '<span class="gap">' + gap + '</span>'
      + '</div>';
  }).join('');
  document.getElementById('lb-list').innerHTML = html;
}

function escHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

// ──────────────────────────────────────────────────────────────────────
// Paddock UI — pre-race betting
// ──────────────────────────────────────────────────────────────────────
function renderPaddock() {
  document.getElementById('hud-balance').textContent = '$' + state.balance.toLocaleString();
  document.getElementById('hud-race-num').textContent = state.raceNum;

  const rows = state.horses.map(h => {
    const bet = state.bets[h.id] || 0;
    const formStr = h.form.map(f => f === 1 ? '🥇' : f).join(' ');
    return '<div class="horse-row ' + (bet > 0 ? 'bet-on' : '') + '" data-id="' + h.id + '">'
      + '<div class="num">' + h.gate + '</div>'
      + '<div class="swatch" style="background:#' + h.color.toString(16).padStart(6,'0') + ';"></div>'
      + '<div class="name-cell">' + escHtml(h.name) + '<small>spd ' + h.speed.toFixed(1) + ' · stam ' + h.stamina.toFixed(2) + '</small></div>'
      + '<div class="form">' + formStr + '</div>'
      + '<div class="odds">' + h.oddsAm + '</div>'
      + '<div class="bet-controls">'
      +   '<input class="bet-input" type="number" min="0" max="' + state.balance + '" step="10" value="' + bet + '" data-id="' + h.id + '">'
      + '</div>'
      + '</div>';
  }).join('');

  const wagered = Object.values(state.bets).reduce((s,v) => s+v, 0);
  document.getElementById('paddock').innerHTML =
      '<h2>🏁 Race ' + state.raceNum + ' — Paddock</h2>'
    + '<div class="sub">6 horses · 1000m sprint · place bets, then send them off</div>'
    + '<div class="your-balance">Bank <b>$' + state.balance.toLocaleString() + '</b></div>'
    + '<div class="pot">Total wagered: <b>$' + wagered + '</b></div>'
    + '<div class="horse-list">' + rows + '</div>'
    + '<div class="paddock-actions">'
    +   '<button class="btn-secondary" onclick="window.__skipBets()">Skip betting</button>'
    +   '<button onclick="window.__sendThem()">🏇 Send them off</button>'
    + '</div>';
  document.getElementById('paddock').style.display = 'block';
  // Wire bet inputs
  document.querySelectorAll('.bet-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = parseInt(inp.getAttribute('data-id'));
      let v = Math.max(0, parseInt(inp.value) || 0);
      const others = Object.entries(state.bets).filter(([k]) => parseInt(k) !== id).reduce((s,[,vv]) => s+vv, 0);
      if (v + others > state.balance) v = state.balance - others;
      state.bets[id] = v;
      renderPaddock();
    });
  });
}

window.__skipBets = function() {
  state.bets = {};
  startRace();
};
window.__sendThem = function() {
  const wagered = Object.values(state.bets).reduce((s,v) => s+v, 0);
  if (wagered > state.balance) { alert('Bets exceed bank.'); return; }
  state.balance -= wagered;
  saveBalance();
  startRace();
};

document.getElementById('btn-new-race').addEventListener('click', window.__newRace);

// ──────────────────────────────────────────────────────────────────────
// Boot
// ──────────────────────────────────────────────────────────────────────
async function boot() {
  initThree();
  generateHorses();
  // No external model load — chibi character horses ship instantly.
  buildHorses();
  renderPaddock();
}

window.__bootDerby = boot;
</script>
