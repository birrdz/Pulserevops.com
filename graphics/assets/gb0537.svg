<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
    .title{font-family:'Inter',system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--c3)}
    .sub{font-family:'Inter',system-ui,sans-serif;font-size:18px;fill:var(--c3);opacity:.7}
    .seg{font-family:'Inter',system-ui,sans-serif;font-size:20px;font-weight:600;fill:var(--c3)}
    .mo{font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:700;fill:var(--ink)}
    .ax{font-family:'Inter',system-ui,sans-serif;font-size:16px;fill:var(--c3);opacity:.55}
    .legend{font-family:'Inter',system-ui,sans-serif;font-size:16px;fill:var(--c3);opacity:.85}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg1,#0b0f17)"/>
      <stop offset="1" stop-color="var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="barFast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1)"/>
      <stop offset="1" stop-color="var(--c2)"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1)" stop-opacity=".9"/>
      <stop offset="1" stop-color="var(--c4)"/>
    </linearGradient>
    <linearGradient id="barSlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c4)"/>
      <stop offset="1" stop-color="var(--c4b)"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Header -->
  <text x="48" y="50" class="title">CAC Payback Period by Customer Segment</text>
  <text x="48" y="78" class="sub">Months required to recover customer acquisition cost — lower is healthier</text>

  <!-- Legend -->
  <g transform="translate(1080,42)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--c2)"/>
    <text x="22" y="12" class="legend">Healthy &lt;12 mo</text>
    <rect x="150" y="0" width="14" height="14" rx="3" fill="var(--c4)"/>
    <text x="172" y="12" class="legend">Watch 12–18 mo</text>
    <rect x="320" y="0" width="14" height="14" rx="3" fill="var(--c4b)"/>
    <text x="342" y="12" class="legend">Risk &gt;18 mo</text>
  </g>

  <!-- Chart area: x=240..1480 = 1240px = 24 months -->
  <!-- Each month = ~51.6px -->
  <g>
    <!-- Vertical gridlines every 4 months -->
    <line x1="240" y1="110" x2="240" y2="350" stroke="var(--c3)" stroke-opacity=".15" stroke-width="1"/>
    <line x1="446.6" y1="110" x2="446.6" y2="350" stroke="var(--c3)" stroke-opacity=".1" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="653.3" y1="110" x2="653.3" y2="350" stroke="var(--c3)" stroke-opacity=".1" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="860" y1="110" x2="860" y2="350" stroke="var(--c3)" stroke-opacity=".1" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="1066.6" y1="110" x2="1066.6" y2="350" stroke="var(--c3)" stroke-opacity=".1" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="1273.3" y1="110" x2="1273.3" y2="350" stroke="var(--c3)" stroke-opacity=".1" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="1480" y1="110" x2="1480" y2="350" stroke="var(--c3)" stroke-opacity=".15" stroke-width="1"/>

    <!-- 12-month healthy line -->
    <line x1="860" y1="100" x2="860" y2="358" stroke="var(--c1)" stroke-width="2" stroke-dasharray="6,6" opacity=".55"/>
    <text x="868" y="100" class="ax" fill="var(--c1)" opacity=".9">12-mo target</text>

    <!-- Axis labels -->
    <text x="240" y="372" class="ax" text-anchor="middle">0</text>
    <text x="446.6" y="372" class="ax" text-anchor="middle">4</text>
    <text x="653.3" y="372" class="ax" text-anchor="middle">8</text>
    <text x="860" y="372" class="ax" text-anchor="middle">12</text>
    <text x="1066.6" y="372" class="ax" text-anchor="middle">16</text>
    <text x="1273.3" y="372" class="ax" text-anchor="middle">20</text>
    <text x="1480" y="372" class="ax" text-anchor="middle">24</text>
    <text x="860" y="392" class="ax" text-anchor="middle" font-weight="600">Months to recover CAC</text>
  </g>

  <!-- Bars -->
  <!-- SMB-Self Serve: 5 mo -->
  <g>
    <text x="220" y="142" class="seg" text-anchor="end">SMB · Self-Serve</text>
    <rect x="240" y="124" width="258" height="30" rx="6" fill="url(#barFast)"/>
    <text x="510" y="146" class="mo" fill="var(--c3)">5 mo</text>
  </g>

  <!-- Mid-Market Tier 1: 9 mo -->
  <g>
    <text x="220" y="184" class="seg" text-anchor="end">Mid-Market · Tier 1</text>
    <rect x="240" y="166" width="464" height="30" rx="6" fill="url(#barFast)"/>
    <text x="716" y="188" class="mo" fill="var(--c3)">9 mo</text>
  </g>

  <!-- Mid-Market Tier 2: 13 mo -->
  <g>
    <text x="220" y="226" class="seg" text-anchor="end">Mid-Market · Tier 2</text>
    <rect x="240" y="208" width="670" height="30" rx="6" fill="url(#barMid)"/>
    <text x="922" y="230" class="mo" fill="var(--c3)">13 mo</text>
  </g>

  <!-- Enterprise Tier 1: 16 mo -->
  <g>
    <text x="220" y="268" class="seg" text-anchor="end">Enterprise · Tier 1</text>
    <rect x="240" y="250" width="826" height="30" rx="6" fill="url(#barMid)"/>
    <text x="1078" y="272" class="mo" fill="var(--c3)">16 mo</text>
  </g>

  <!-- Enterprise Tier 2: 21 mo -->
  <g>
    <text x="220" y="310" class="seg" text-anchor="end">Enterprise · Tier 2</text>
    <rect x="240" y="292" width="1083" height="30" rx="6" fill="url(#barSlow)"/>
    <text x="1335" y="314" class="mo" fill="var(--ink)">21 mo</text>
  </g>

  <!-- Strategic Accounts: 18 mo -->
  <g>
    <text x="220" y="352" class="seg" text-anchor="end">Strategic Accounts</text>
    <rect x="240" y="334" width="929" height="30" rx="6" fill="url(#barSlow)"/>
    <text x="1181" y="356" class="mo" fill="var(--ink)">18 mo</text>
  </g>

  <!-- Y axis baseline -->
  <line x1="240" y1="110" x2="240" y2="364" stroke="var(--c3)" stroke-opacity=".35" stroke-width="2"/>
</svg>
