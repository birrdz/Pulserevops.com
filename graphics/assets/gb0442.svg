<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#fbbf24;--c2:#a16207;--c3:#fde68a;--c4:#fbbf24;--c4b:#fde68a;--ink:#1a1206;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#fbbf24)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#a16207)"/>
      <stop offset="1" style="stop-color:var(--c3,#fde68a)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#fbbf24)" stop-opacity="0.22"/>
      <stop offset="1" style="stop-color:var(--c1,#fbbf24)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Decorative geometric crown on the right -->
  <g stroke="url(#accent)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- base band -->
    <rect x="1020" y="280" width="460" height="34" rx="4"/>
    <!-- crown silhouette: V-V-V-V-V peaks -->
    <path d="M 1020 280 L 1060 200 L 1110 260 L 1170 160 L 1230 260 L 1290 140 L 1350 260 L 1410 160 L 1450 260 L 1480 200 L 1480 280"/>
    <!-- jewel pegs -->
    <circle cx="1060" cy="200" r="9" fill="var(--c1,#fbbf24)" stroke="none"/>
    <circle cx="1170" cy="160" r="11" fill="var(--c3,#fde68a)" stroke="none"/>
    <circle cx="1290" cy="140" r="13" fill="var(--c1,#fbbf24)" stroke="none"/>
    <circle cx="1410" cy="160" r="11" fill="var(--c3,#fde68a)" stroke="none"/>
    <circle cx="1480" cy="200" r="9" fill="var(--c1,#fbbf24)" stroke="none"/>
    <!-- band gems -->
    <circle cx="1075" cy="297" r="4" fill="var(--c1,#fbbf24)" stroke="none"/>
    <circle cx="1140" cy="297" r="4" fill="var(--c3,#fde68a)" stroke="none"/>
    <circle cx="1205" cy="297" r="4" fill="var(--c1,#fbbf24)" stroke="none"/>
    <circle cx="1270" cy="297" r="4" fill="var(--c3,#fde68a)" stroke="none"/>
    <circle cx="1335" cy="297" r="4" fill="var(--c1,#fbbf24)" stroke="none"/>
    <circle cx="1400" cy="297" r="4" fill="var(--c3,#fde68a)" stroke="none"/>
    <circle cx="1465" cy="297" r="4" fill="var(--c1,#fbbf24)" stroke="none"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">FRACTIONAL LEADERSHIP</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Fractional CRO.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Diagnose <tspan fill="url(#accent)">&#183;</tspan> Architect <tspan fill="url(#accent)">&#183;</tspan> Scale</text>
</svg>
