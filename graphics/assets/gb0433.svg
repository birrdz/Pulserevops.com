<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#fb7185;--c2:#e11d48;--c3:#fda4af;--c4:#fbbf24;--c4b:#fde68a;--ink:#1f0510;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#fb7185)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#e11d48)"/>
      <stop offset="1" style="stop-color:var(--c3,#fda4af)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#fb7185)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#fb7185)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Heart-pulse / EKG line on the right -->
  <polyline points="900,198 1020,198 1060,198 1090,138 1115,258 1140,90 1170,300 1200,198 1300,198 1340,198 1370,158 1400,238 1430,198 1530,198"
    stroke="url(#accent)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">CUSTOMER SUCCESS</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">CS Manager.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="700" fill="#EDE5D8">Adopt <tspan fill="url(#accent)">&#183;</tspan> Expand <tspan fill="url(#accent)">&#183;</tspan> Renew</text>
</svg>
