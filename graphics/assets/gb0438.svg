<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#fb923c;--c2:#c2410c;--c3:#fed7aa;--c4:#fbbf24;--c4b:#fde68a;--ink:#431407;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#fb923c)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#c2410c)"/>
      <stop offset="1" style="stop-color:var(--c3,#fed7aa)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#fb923c)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#fb923c)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Three rising trend lines on the right -->
  <g stroke="url(#accent)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <polyline points="1040,300 1130,270 1220,235 1310,190 1400,150 1480,110" stroke-width="6"/>
    <polyline points="1040,330 1130,310 1220,285 1310,255 1400,220 1480,180" stroke-width="4" opacity="0.7"/>
    <polyline points="1040,355 1130,345 1220,330 1310,310 1400,285 1480,255" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Endpoint dots -->
  <g fill="url(#accent)" opacity="0.95">
    <circle cx="1480" cy="110" r="8"/>
    <circle cx="1480" cy="180" r="6" opacity="0.7"/>
    <circle cx="1480" cy="255" r="5" opacity="0.5"/>
  </g>
  <!-- Arrowhead on top line -->
  <polyline points="1460,98 1480,110 1472,132" stroke="url(#accent)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">B2B SAAS</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">VP of Sales.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Pipeline <tspan fill="url(#accent)">&#183;</tspan> Quota <tspan fill="url(#accent)">&#183;</tspan> Predictable growth</text>
</svg>
