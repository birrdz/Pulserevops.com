    <circle cx="178" cy="742" r="52" fill="url(#accent)"/>
    <text x="178" y="761" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">2</text>
    <text x="268" y="734" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Apply (31-60)</text>
    <text x="268" y="771" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Shadow, role-play, first calls</text>
