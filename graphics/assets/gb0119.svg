    <circle cx="178" cy="1042" r="52" fill="url(#accent)"/>
    <text x="178" y="1061" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">3</text>
    <text x="268" y="1034" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Own (61-90)</text>
    <text x="268" y="1071" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Carry pipeline and quota</text>
