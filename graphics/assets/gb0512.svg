<rect x="1284" y="258" width="240" height="88" rx="8" fill="var(--c3)" stroke="var(--ink)" stroke-width="2"/>
<text x="1404" y="282" class="lbl" font-size="16">ENABLEMENT TEAM</text>
<text x="1404" y="304" class="sub" font-size="13">MEDDPICC / Command</text>
