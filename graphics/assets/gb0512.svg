<text x="792" y="304" class="sub" font-size="13">1:8 CSM-to-account</text>
<text x="792" y="322" class="sub" font-size="13">NRR ownership 110%+</text>
<text x="792" y="340" class="sub" font-size="13">Expansion qualified</text>

<rect x="978" y="258" width="240" height="88" rx="8" fill="var(--c3)" stroke="var(--ink)" stroke-width="2"/>
