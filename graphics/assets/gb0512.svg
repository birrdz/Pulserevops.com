<text x="486" y="220" class="lbl" font-size="14">Solution Architects</text>

<rect x="692" y="178" width="200" height="50" rx="8" fill="url(#vpGrad)" stroke="var(--ink)" stroke-width="2"/>
<text x="792" y="200" class="lbl" font-size="18">VP CUSTOMER</text>
<text x="792" y="220" class="lbl" font-size="14">SUCCESS</text>

