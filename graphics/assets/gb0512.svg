<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;} .lbl{font-family:-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);text-anchor:middle;font-weight:700} .sub{font-family:-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);text-anchor:middle;font-weight:500;opacity:.85} .ttl{font-family:-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--c3);text-anchor:middle;font-weight:800;letter-spacing:.5px}</style>
<rect width="1584" height="396" fill="var(--bg1,#0b0f17)"/>
<rect x="0" y="0" width="1584" height="396" fill="url(#bgGrad)"/>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bg1,#0b0f17)"/><stop offset="1" stop-color="var(--bg2,#0f172a)"/></linearGradient>
<linearGradient id="croGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c4)"/><stop offset="1" stop-color="var(--c4b)"/></linearGradient>
<linearGradient id="vpGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient>
</defs>
<text x="792" y="40" class="ttl" font-size="22">ENTERPRISE SAAS SALES ORG</text>

<!-- CRO node (top center) -->
<rect x="692" y="62" width="200" height="56" rx="10" fill="url(#croGrad)" stroke="var(--ink)" stroke-width="2"/>
<text x="792" y="88" class="lbl" font-size="20">CHIEF REVENUE</text>
<text x="792" y="108" class="lbl" font-size="20">OFFICER</text>

<!-- Connector lines from CRO down to 5 lieutenants -->
<path d="M792 118 L792 150" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M180 150 L1404 150" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M180 150 L180 178" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M486 150 L486 178" stroke="var(--c3)" stroke-width="2" fill="none"/>
