<path d="M1098 150 L1098 178" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M1404 150 L1404 178" stroke="var(--c3)" stroke-width="2" fill="none"/>

<!-- Five director-level boxes -->
<rect x="80" y="178" width="200" height="50" rx="8" fill="url(#vpGrad)" stroke="var(--ink)" stroke-width="2"/>
