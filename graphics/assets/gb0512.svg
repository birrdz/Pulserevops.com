<!-- Connectors to IC layer -->
<path d="M180 228 L180 258" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M486 228 L486 258" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M792 228 L792 258" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M1098 228 L1098 258" stroke="var(--c3)" stroke-width="2" fill="none"/>
<path d="M1404 228 L1404 258" stroke="var(--c3)" stroke-width="2" fill="none"/>

<!-- IC / Bench layer -->
<rect x="60" y="258" width="240" height="88" rx="8" fill="var(--c3)" stroke="var(--ink)" stroke-width="2"/>
