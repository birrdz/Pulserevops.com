  <text x="960" y="857" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="700" fill="#EDE5D8">Coverage <tspan fill="url(#accent)">&#183;</tspan> Capacity <tspan fill="url(#accent)">&#183;</tspan> Quota</text>

