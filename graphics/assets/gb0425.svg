<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#10b981;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130c;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--c2,#E8710A)" stop-opacity="0.85"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Ascending ladder: three bars climbing outcome > seat > license -->
  <rect x="1100" y="240" width="90" height="100" rx="6" fill="url(#barFill)" opacity="0.85"/>
  <rect x="1220" y="180" width="90" height="160" rx="6" fill="url(#barFill)" opacity="0.92"/>
  <rect x="1340" y="100" width="90" height="240" rx="6" fill="url(#barFill)" opacity="1"/>
  <!-- Upward arrow on top of tallest bar -->
  <polyline points="1370,100 1385,75 1400,100" stroke="url(#accent)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1385" y1="75" x2="1385" y2="98" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <!-- Baseline -->
  <line x1="1080" y1="345" x2="1450" y2="345" stroke="url(#accent)" stroke-width="3" opacity="0.55" stroke-linecap="round"/>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">THE 2027 PRICING SHIFT</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">Outcome &gt; Seat.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="700" fill="#EDE5D8">Customers buy results <tspan fill="url(#accent)">&#183;</tspan> Not licenses</text>

</svg>
