<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3000" viewBox="0 0 2400 3000">
  <style>svg{--c1:#f97316;--c2:#b91c1c;--c3:#fdba74;--c4:#fbbf24;--c4b:#fde68a;--ink:#1a0603;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
