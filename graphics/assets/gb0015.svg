<text x="1200" y="1180" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="440" font-weight="900" letter-spacing="-8" fill="#FFFFFF">ALWAYS</text>
  <text x="1200" y="1620" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="440" font-weight="900" letter-spacing="-8" fill="#EDE5D8">BE</text>
  <text x="1200" y="2120" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="440" font-weight="900" letter-spacing="-8" fill="url(#accent)">CLOSING</text>

