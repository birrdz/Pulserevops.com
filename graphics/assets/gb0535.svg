<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--bg1,#0b0f17)"/>
<stop offset="1" stop-color="var(--bg2,#0f172a)"/>
</linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c1)" stop-opacity="0.45"/>
<stop offset="1" stop-color="var(--c1)" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1584" height="396" fill="url(#bg)"/>

<!-- Title -->
<text x="48" y="48" font-family="-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="var(--c3)">MRR Growth - 12 Month Trend</text>
<text x="48" y="72" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" fill="var(--c4b)" opacity="0.85">New / Expansion / Churn breakdown by month</text>

<!-- Legend -->
<g font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)">
<rect x="1180" y="40" width="14" height="14" fill="var(--c1)"/>
<text x="1200" y="52">New MRR</text>
<rect x="1280" y="40" width="14" height="14" fill="var(--c2)"/>
<text x="1300" y="52">Expansion</text>
<rect x="1390" y="40" width="14" height="14" fill="var(--c4)"/>
<text x="1410" y="52">Churn</text>
<line x1="1490" y1="47" x2="1518" y2="47" stroke="var(--c3)" stroke-width="3"/>
<circle cx="1504" cy="47" r="3.5" fill="var(--c3)"/>
<text x="1525" y="52">Total MRR</text>
</g>

<!-- Y axis grid + labels -->
<g font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="var(--c4b)" opacity="0.7">
<line x1="80" y1="120" x2="1540" y2="120" stroke="var(--c4b)" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
<text x="48" y="124">$500K</text>
<line x1="80" y1="180" x2="1540" y2="180" stroke="var(--c4b)" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
<text x="48" y="184">$400K</text>
<line x1="80" y1="240" x2="1540" y2="240" stroke="var(--c4b)" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
<text x="48" y="244">$300K</text>
<line x1="80" y1="300" x2="1540" y2="300" stroke="var(--c4b)" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.35"/>
<text x="48" y="304">$200K</text>
</g>

<!-- X axis baseline -->
<line x1="80" y1="340" x2="1540" y2="340" stroke="var(--c3)" stroke-width="1.2" opacity="0.6"/>

<!-- Bar stacks: 12 months, base at y=340 -->
<!-- Each month: New (c1) on bottom, Expansion (c2) above, Churn (c4) appears as a notch reducing total -->
<g>
<!-- Jan -->
<rect x="105" y="318" width="60" height="22" fill="var(--c1)"/>
<rect x="105" y="308" width="60" height="10" fill="var(--c2)"/>
<rect x="105" y="304" width="60" height="4" fill="var(--c4)"/>
<text x="135" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Jan</text>
<!-- Feb -->
<rect x="225" y="316" width="60" height="24" fill="var(--c1)"/>
<rect x="225" y="304" width="60" height="12" fill="var(--c2)"/>
<rect x="225" y="299" width="60" height="5" fill="var(--c4)"/>
<text x="255" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Feb</text>
<!-- Mar -->
<rect x="345" y="312" width="60" height="28" fill="var(--c1)"/>
<rect x="345" y="298" width="60" height="14" fill="var(--c2)"/>
<rect x="345" y="293" width="60" height="5" fill="var(--c4)"/>
<text x="375" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Mar</text>
<!-- Apr -->
<rect x="465" y="308" width="60" height="32" fill="var(--c1)"/>
<rect x="465" y="290" width="60" height="18" fill="var(--c2)"/>
<rect x="465" y="284" width="60" height="6" fill="var(--c4)"/>
<text x="495" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Apr</text>
<!-- May -->
<rect x="585" y="304" width="60" height="36" fill="var(--c1)"/>
<rect x="585" y="284" width="60" height="20" fill="var(--c2)"/>
<rect x="585" y="278" width="60" height="6" fill="var(--c4)"/>
<text x="615" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">May</text>
<!-- Jun -->
<rect x="705" y="300" width="60" height="40" fill="var(--c1)"/>
<rect x="705" y="278" width="60" height="22" fill="var(--c2)"/>
<rect x="705" y="271" width="60" height="7" fill="var(--c4)"/>
<text x="735" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Jun</text>
<!-- Jul -->
<rect x="825" y="296" width="60" height="44" fill="var(--c1)"/>
<rect x="825" y="270" width="60" height="26" fill="var(--c2)"/>
<rect x="825" y="263" width="60" height="7" fill="var(--c4)"/>
<text x="855" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Jul</text>
<!-- Aug -->
<rect x="945" y="290" width="60" height="50" fill="var(--c1)"/>
<rect x="945" y="262" width="60" height="28" fill="var(--c2)"/>
<rect x="945" y="254" width="60" height="8" fill="var(--c4)"/>
<text x="975" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Aug</text>
<!-- Sep -->
<rect x="1065" y="284" width="60" height="56" fill="var(--c1)"/>
<rect x="1065" y="252" width="60" height="32" fill="var(--c2)"/>
<rect x="1065" y="244" width="60" height="8" fill="var(--c4)"/>
<text x="1095" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Sep</text>
<!-- Oct -->
<rect x="1185" y="278" width="60" height="62" fill="var(--c1)"/>
<rect x="1185" y="244" width="60" height="34" fill="var(--c2)"/>
<rect x="1185" y="235" width="60" height="9" fill="var(--c4)"/>
<text x="1215" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Oct</text>
<!-- Nov -->
<rect x="1305" y="272" width="60" height="68" fill="var(--c1)"/>
<rect x="1305" y="234" width="60" height="38" fill="var(--c2)"/>
<rect x="1305" y="224" width="60" height="10" fill="var(--c4)"/>
<text x="1335" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Nov</text>
<!-- Dec -->
<rect x="1425" y="266" width="60" height="74" fill="var(--c1)"/>
<rect x="1425" y="224" width="60" height="42" fill="var(--c2)"/>
<rect x="1425" y="214" width="60" height="10" fill="var(--c4)"/>
<text x="1455" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" fill="var(--c4b)" text-anchor="middle">Dec</text>
</g>

<!-- Trend line area fill -->
<path d="M 135 286 L 255 278 L 375 270 L 495 258 L 615 246 L 735 232 L 855 218 L 975 204 L 1095 188 L 1215 172 L 1335 156 L 1455 138 L 1455 340 L 135 340 Z" fill="url(#area)" opacity="0.55"/>

<!-- Trend line -->
<path d="M 135 286 L 255 278 L 375 270 L 495 258 L 615 246 L 735 232 L 855 218 L 975 204 L 1095 188 L 1215 172 L 1335 156 L 1455 138" fill="none" stroke="var(--c3)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Trend line points -->
<g fill="var(--c3)" stroke="var(--ink)" stroke-width="1.5">
<circle cx="135" cy="286" r="5"/>
<circle cx="255" cy="278" r="5"/>
<circle cx="375" cy="270" r="5"/>
<circle cx="495" cy="258" r="5"/>
<circle cx="615" cy="246" r="5"/>
<circle cx="735" cy="232" r="5"/>
<circle cx="855" cy="218" r="5"/>
<circle cx="975" cy="204" r="5"/>
<circle cx="1095" cy="188" r="5"/>
<circle cx="1215" cy="172" r="5"/>
<circle cx="1335" cy="156" r="5"/>
<circle cx="1455" cy="138" r="6.5" fill="var(--c4)"/>
</g>

<!-- Callout values -->
<text x="135" y="276" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="var(--c3)" text-anchor="middle" font-weight="600">$215K</text>
<text x="1455" y="128" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" fill="var(--c4)" text-anchor="middle" font-weight="700">$487K</text>

<!-- Growth annotation -->
<g font-family="-apple-system,Segoe UI,sans-serif">
<rect x="1340" y="92" width="190" height="28" rx="6" fill="var(--c2)" opacity="0.85"/>
<text x="1435" y="111" font-size="14" fill="var(--ink)" text-anchor="middle" font-weight="700">+126% YoY MRR Growth</text>
</g>
</svg>
