<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <style>svg{--c1:#e879f9;--c2:#c026d3;--c3:#f5d0fe;--c4:#22d3ee;--c4b:#a5f3fc;--ink:#1a0420;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>

<text x="960" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="160" font-weight="900" fill="#FFFFFF">Thank you.</text>

<polyline points="430,720 700,720 752,720 788,640 828,800 868,720 980,720 1020,720 1055,668 1091,772 1127,720 1400,720"
    stroke="url(#accent)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <circle cx="1400" cy="720" r="12" fill="url(#accent)"/>

</svg>
