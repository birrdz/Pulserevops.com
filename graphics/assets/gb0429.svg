<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#22d3ee;--c4b:#a5f3fc;--ink:#022c1f;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Three interlocking gears decorative element on the right -->
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <g transform="translate(1230,150)">
      <circle cx="0" cy="0" r="48"/>
      <circle cx="0" cy="0" r="18"/>
      <g>
        <line x1="0" y1="-66" x2="0" y2="-50"/>
        <line x1="0" y1="50" x2="0" y2="66"/>
        <line x1="-66" y1="0" x2="-50" y2="0"/>
        <line x1="50" y1="0" x2="66" y2="0"/>
        <line x1="-47" y1="-47" x2="-35" y2="-35"/>
        <line x1="35" y1="35" x2="47" y2="47"/>
        <line x1="-47" y1="47" x2="-35" y2="35"/>
        <line x1="35" y1="-35" x2="47" y2="-47"/>
      </g>
    </g>
    <g transform="translate(1360,238)">
      <circle cx="0" cy="0" r="58"/>
      <circle cx="0" cy="0" r="22"/>
      <g>
        <line x1="0" y1="-78" x2="0" y2="-60"/>
        <line x1="0" y1="60" x2="0" y2="78"/>
        <line x1="-78" y1="0" x2="-60" y2="0"/>
        <line x1="60" y1="0" x2="78" y2="0"/>
        <line x1="-55" y1="-55" x2="-42" y2="-42"/>
        <line x1="42" y1="42" x2="55" y2="55"/>
        <line x1="-55" y1="55" x2="-42" y2="42"/>
        <line x1="42" y1="-42" x2="55" y2="-55"/>
      </g>
    </g>
    <g transform="translate(1480,142)">
      <circle cx="0" cy="0" r="40"/>
      <circle cx="0" cy="0" r="15"/>
      <g>
        <line x1="0" y1="-56" x2="0" y2="-42"/>
        <line x1="0" y1="42" x2="0" y2="56"/>
        <line x1="-56" y1="0" x2="-42" y2="0"/>
        <line x1="42" y1="0" x2="56" y2="0"/>
        <line x1="-40" y1="-40" x2="-30" y2="-30"/>
        <line x1="30" y1="30" x2="40" y2="40"/>
        <line x1="-40" y1="40" x2="-30" y2="30"/>
        <line x1="30" y1="-30" x2="40" y2="-40"/>
      </g>
    </g>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">REVENUE OPERATIONS</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">Build the system.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Then trust it <tspan fill="url(#accent)">&#183;</tspan> Iterate weekly</text>
</svg>
