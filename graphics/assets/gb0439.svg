<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#f87171;--c2:#b91c1c;--c3:#fecaca;--c4:#fbbf24;--c4b:#fde68a;--ink:#2a0a0a;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#f87171)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#b91c1c)"/>
      <stop offset="1" style="stop-color:var(--c3,#fecaca)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#f87171)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#f87171)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Shield outline with lock notch -->
  <g transform="translate(1230,72)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M130,10 L20,52 L20,150 C20,210 70,250 130,262 C190,250 240,210 240,150 L240,52 Z"/>
    <!-- Lock body inside shield -->
    <rect x="92" y="138" width="76" height="64" rx="6"/>
    <!-- Lock shackle (notch) -->
    <path d="M104,138 L104,118 C104,98 116,84 130,84 C144,84 156,98 156,118 L156,138"/>
    <!-- Keyhole -->
    <circle cx="130" cy="166" r="6"/>
    <line x1="130" y1="172" x2="130" y2="186"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">CYBERSECURITY</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Sales Director.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Risk <tspan fill="url(#accent)">&#183;</tspan> Compliance <tspan fill="url(#accent)">&#183;</tspan> Resilience</text>

</svg>
