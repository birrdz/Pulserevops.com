<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <style>svg{--c1:#c084fc;--c2:#db2777;--c3:#f0abfc;--c4:#38bdf8;--c4b:#bae6fd;--ink:#1a0620;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#glow)"/>

<text x="540" y="350" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="320" font-weight="900" fill="url(#accent)" opacity="0.9">&#8220;</text>

<text text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="86" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    <tspan x="540" y="500">Revenue is a</tspan>
    <tspan x="540" y="608">lagging indicator</tspan>
    <tspan x="540" y="716">of <tspan fill="url(#accent)">trust</tspan>.</tspan>
  </text>

<polyline points="280,808 420,808 462,808 498,748 538,880 576,808 716,808 756,808 792,762 830,856 868,808 800,808"
    stroke="url(#accent)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

</svg>
