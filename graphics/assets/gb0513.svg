<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
.bg1{fill:var(--bg1,#0b0f17);} .bg2{fill:var(--bg2,#0f172a);}
.title{font:700 24px system-ui,sans-serif;fill:var(--c3);}
.sub{font:600 14px system-ui,sans-serif;fill:var(--c3);opacity:.75;}
.team-h{font:700 18px system-ui,sans-serif;fill:var(--ink);}
.lbl{font:600 14px system-ui,sans-serif;fill:var(--ink);}
.lbl-l{font:600 14px system-ui,sans-serif;fill:var(--c3);}
.role{font:500 12px system-ui,sans-serif;fill:var(--ink);opacity:.85;}
.overlay-lbl{font:700 13px system-ui,sans-serif;fill:var(--c4);letter-spacing:.5px;}
.line{stroke:var(--c1);stroke-width:2;fill:none;}
.line-dash{stroke:var(--c4);stroke-width:2;fill:none;stroke-dasharray:6 4;}
</style>
<rect class="bg1" width="1584" height="396"/>
<rect class="bg2" x="0" y="0" width="1584" height="60"/>
<text class="title" x="32" y="38">PLG Sales Overlay Org Chart</text>
<text class="sub" x="32" y="55">Growth | Inside Sales | Customer Success Engineering — product-led motion with sales overlay</text>

<!-- CRO box at top -->
<rect x="692" y="80" width="200" height="50" rx="8" fill="var(--c2)" stroke="var(--c1)" stroke-width="2"/>
<text class="lbl" x="792" y="103" text-anchor="middle">Chief Revenue Officer</text>
<text class="role" x="792" y="120" text-anchor="middle" fill="var(--c3)">PLG + Sales-led blend</text>

<!-- Vertical line from CRO -->
<line class="line" x1="792" y1="130" x2="792" y2="160"/>
<!-- Horizontal bus -->
<line class="line" x1="200" y1="160" x2="1384" y2="160"/>
<!-- Drops to 3 team headers -->
<line class="line" x1="260" y1="160" x2="260" y2="185"/>
<line class="line" x1="792" y1="160" x2="792" y2="185"/>
<line class="line" x1="1324" y1="160" x2="1324" y2="185"/>

<!-- ============ GROWTH TEAM (left) ============ -->
<rect x="60" y="185" width="400" height="50" rx="8" fill="var(--c1)" stroke="var(--c2)" stroke-width="2"/>
<text class="team-h" x="260" y="216" text-anchor="middle">GROWTH TEAM</text>

<!-- Growth roles -->
<rect x="80" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="165" y="272" text-anchor="middle">VP, Growth</text>
<text class="role" x="165" y="288" text-anchor="middle">Owns PLG funnel</text>

<rect x="270" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="355" y="272" text-anchor="middle">Growth PM</text>
<text class="role" x="355" y="288" text-anchor="middle">Activation + onboarding</text>

<rect x="80" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="165" y="329" text-anchor="middle">Growth Engineer</text>
<text class="role" x="165" y="345" text-anchor="middle">In-product flows</text>

<rect x="270" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="355" y="329" text-anchor="middle">Lifecycle Marketer</text>
<text class="role" x="355" y="345" text-anchor="middle">PQL nurture</text>

<!-- ============ INSIDE SALES (center) ============ -->
<rect x="592" y="185" width="400" height="50" rx="8" fill="var(--c1)" stroke="var(--c2)" stroke-width="2"/>
<text class="team-h" x="792" y="216" text-anchor="middle">INSIDE SALES</text>

<rect x="612" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="697" y="272" text-anchor="middle">VP, Sales</text>
<text class="role" x="697" y="288" text-anchor="middle">PQL → closed-won</text>

<rect x="802" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="887" y="272" text-anchor="middle">Sales Manager</text>
<text class="role" x="887" y="288" text-anchor="middle">Pod leadership</text>

<rect x="612" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="697" y="329" text-anchor="middle">Product Specialist</text>
<text class="role" x="697" y="345" text-anchor="middle">PQL qualifier (overlay)</text>

<rect x="802" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="887" y="329" text-anchor="middle">Account Executive</text>
<text class="role" x="887" y="345" text-anchor="middle">Expansion + Enterprise</text>

<!-- ============ CS ENGINEERING (right) ============ -->
<rect x="1124" y="185" width="400" height="50" rx="8" fill="var(--c1)" stroke="var(--c2)" stroke-width="2"/>
<text class="team-h" x="1324" y="216" text-anchor="middle">CUSTOMER SUCCESS ENGINEERING</text>

<rect x="1144" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="1229" y="272" text-anchor="middle">VP, CS Engineering</text>
<text class="role" x="1229" y="288" text-anchor="middle">Retention + NRR</text>

<rect x="1334" y="255" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="1419" y="272" text-anchor="middle">CSM</text>
<text class="role" x="1419" y="288" text-anchor="middle">Strategic accounts</text>

<rect x="1144" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="1229" y="329" text-anchor="middle">Solutions Engineer</text>
<text class="role" x="1229" y="345" text-anchor="middle">Technical adoption</text>

<rect x="1334" y="312" width="170" height="42" rx="6" fill="var(--c3)" stroke="var(--c2)" stroke-width="1.5"/>
<text class="lbl" x="1419" y="329" text-anchor="middle">Support Engineer</text>
<text class="role" x="1419" y="345" text-anchor="middle">In-product help</text>

<!-- Overlay flow arrows (dashed gold) showing PLG handoff -->
<path class="line-dash" d="M 440 276 L 600 276" marker-end="url(#arr)"/>
<path class="line-dash" d="M 980 276 L 1140 276" marker-end="url(#arr)"/>

<text class="overlay-lbl" x="520" y="270" text-anchor="middle">PQL handoff</text>
<text class="overlay-lbl" x="1060" y="270" text-anchor="middle">Activation handoff</text>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="var(--c4)"/>
</marker>
</defs>

<!-- Footer band -->
<rect x="0" y="370" width="1584" height="26" fill="var(--bg2,#0f172a)"/>
<text class="sub" x="32" y="388">Solid lines = reporting | Dashed gold = product-led handoff overlay</text>
</svg>
