<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#38bdf8;--c2:#0ea5e9;--c3:#7dd3fc;--c4:#a78bfa;--c4b:#ddd6fe;--ink:#06121f;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Decorative: stylized open circle (oxygen) with downward weight line (gravity) -->
  <circle cx="1280" cy="160" r="86" stroke="url(#accent)" stroke-width="6" fill="none" opacity="0.95"/>
  <circle cx="1280" cy="160" r="50" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.55"/>
  <line x1="1280" y1="246" x2="1280" y2="346" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <polyline points="1260,322 1280,346 1300,322" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <line x1="1180" y1="160" x2="1108" y2="160" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="1380" y1="160" x2="1452" y2="160" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <text x="120" y="178" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">REVENUE OPERATING SYSTEM</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Pipeline is oxygen.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Forecast is gravity <tspan fill="url(#accent)">&#183;</tspan> Build both</text>

</svg>
