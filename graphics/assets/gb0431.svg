<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#a78bfa;--c2:#6d28d9;--c3:#c4b5fd;--c4:#fbbf24;--c4b:#fde68a;--ink:#1a0f2e;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#a78bfa)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#6d28d9)"/>
      <stop offset="1" style="stop-color:var(--c3,#c4b5fd)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#a78bfa)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#a78bfa)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Layered geometric architecture panels (right side) -->
  <g opacity="0.92">
    <!-- back panel -->
    <rect x="900" y="70" width="540" height="80" rx="4" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45"/>
    <line x1="930" y1="110" x2="1100" y2="110" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
    <line x1="1130" y1="110" x2="1410" y2="110" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
    <circle cx="1115" cy="110" r="5" fill="url(#accent)" opacity="0.7"/>

    <!-- mid panel -->
    <rect x="940" y="170" width="540" height="80" rx="4" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.75"/>
    <rect x="966" y="196" width="40" height="28" rx="3" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
    <rect x="1018" y="196" width="40" height="28" rx="3" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
    <rect x="1070" y="196" width="40" height="28" rx="3" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
    <line x1="1130" y1="210" x2="1240" y2="210" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1255" cy="210" r="6" fill="url(#accent)"/>
    <line x1="1270" y1="210" x2="1450" y2="210" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>

    <!-- front panel -->
    <rect x="980" y="270" width="540" height="80" rx="4" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <line x1="1010" y1="310" x2="1140" y2="310" stroke="url(#accent)" stroke-width="2"/>
    <polyline points="1155,310 1170,295 1185,325 1200,300 1215,310" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1230" y1="310" x2="1360" y2="310" stroke="url(#accent)" stroke-width="2"/>
    <rect x="1378" y="294" width="32" height="32" rx="4" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <line x1="1428" y1="310" x2="1490" y2="310" stroke="url(#accent)" stroke-width="2"/>

    <!-- vertical connectors between panels -->
    <line x1="1250" y1="150" x2="1250" y2="170" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
    <line x1="1250" y1="250" x2="1250" y2="270" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">PRE-SALES</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Solutions Consultant.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Discover <tspan fill="url(#accent)">&#183;</tspan> Demo <tspan fill="url(#accent)">&#183;</tspan> De-risk</text>
</svg>
