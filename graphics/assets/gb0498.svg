<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
.stage-label{font-family:'Inter',system-ui,sans-serif;font-weight:700;fill:var(--ink);}
.stage-sub{font-family:'Inter',system-ui,sans-serif;font-weight:500;fill:var(--ink);opacity:.75;}
.stage-pct{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--c4);}
.title{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--c3);letter-spacing:.5px;}
.subtitle{font-family:'Inter',system-ui,sans-serif;font-weight:500;fill:var(--c3);opacity:.7;}
.axis{font-family:'Inter',system-ui,sans-serif;font-weight:600;fill:var(--c3);opacity:.6;}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--bg1,#0b0f17)"/>
<stop offset="1" stop-color="var(--bg2,#0f172a)"/>
</linearGradient>
<linearGradient id="s1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c3)"/><stop offset="1" stop-color="var(--c1)"/>
</linearGradient>
<linearGradient id="s2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c1)"/>
</linearGradient>
<linearGradient id="s3" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/>
</linearGradient>
<linearGradient id="s4" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c2)"/><stop offset="1" stop-color="var(--c2)"/>
</linearGradient>
<linearGradient id="s5" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c2)"/><stop offset="1" stop-color="var(--c4)"/>
</linearGradient>
<linearGradient id="s6" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c4)"/><stop offset="1" stop-color="var(--c4b)"/>
</linearGradient>
<linearGradient id="s7" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="var(--c4b)"/><stop offset="1" stop-color="var(--c4)"/>
</linearGradient>
</defs>
<rect width="1584" height="396" fill="url(#bg)"/>
<text x="48" y="42" class="title" font-size="22">ENTERPRISE SALES FUNNEL — 7 STAGES</text>
<text x="48" y="64" class="subtitle" font-size="14">Lead to Closed-Won conversion rates and stage volumes (B2B benchmark, 100 leads in)</text>

<g transform="translate(64,96)">
<text x="0" y="-8" class="axis" font-size="12">VOLUME</text>
<polygon points="0,0 200,0 180,40 20,40" fill="url(#s1)"/>
<text x="100" y="25" text-anchor="middle" class="stage-label" font-size="19">LEAD</text>
<text x="100" y="60" text-anchor="middle" class="stage-sub" font-size="13">Inbound + Outbound</text>
<text x="100" y="78" text-anchor="middle" class="stage-pct" font-size="22">100</text>
<text x="100" y="96" text-anchor="middle" class="stage-sub" font-size="11">leads in</text>
<text x="100" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: Marketing</text>
<text x="100" y="264" text-anchor="middle" class="stage-sub" font-size="11">SLA: &lt; 5 min</text>

<polygon points="220,0 396,0 380,40 236,40" fill="url(#s2)"/>
<text x="308" y="25" text-anchor="middle" class="stage-label" font-size="19">MQL</text>
<text x="308" y="60" text-anchor="middle" class="stage-sub" font-size="13">Marketing Qualified</text>
<text x="308" y="78" text-anchor="middle" class="stage-pct" font-size="22">38</text>
<text x="308" y="96" text-anchor="middle" class="stage-sub" font-size="11">38% pass-through</text>
<text x="308" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: Marketing Ops</text>
<text x="308" y="264" text-anchor="middle" class="stage-sub" font-size="11">Score &gt;= 70</text>

<polygon points="416,0 576,0 564,40 428,40" fill="url(#s3)"/>
<text x="496" y="25" text-anchor="middle" class="stage-label" font-size="19">SAL</text>
<text x="496" y="60" text-anchor="middle" class="stage-sub" font-size="13">Sales Accepted</text>
<text x="496" y="78" text-anchor="middle" class="stage-pct" font-size="22">21</text>
<text x="496" y="96" text-anchor="middle" class="stage-sub" font-size="11">55% accept rate</text>
<text x="496" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: SDR</text>
<text x="496" y="264" text-anchor="middle" class="stage-sub" font-size="11">SLA: 24 hours</text>

<polygon points="596,0 740,0 732,40 604,40" fill="url(#s4)"/>
<text x="668" y="25" text-anchor="middle" class="stage-label" font-size="19">SQL</text>
<text x="668" y="60" text-anchor="middle" class="stage-sub" font-size="13">Sales Qualified</text>
<text x="668" y="78" text-anchor="middle" class="stage-pct" font-size="22">11</text>
<text x="668" y="96" text-anchor="middle" class="stage-sub" font-size="11">52% qualify</text>
<text x="668" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: AE</text>
<text x="668" y="264" text-anchor="middle" class="stage-sub" font-size="11">BANT / MEDDIC</text>

<polygon points="760,0 884,0 880,40 764,40" fill="url(#s5)"/>
<text x="822" y="25" text-anchor="middle" class="stage-label" font-size="17">DISCOVERY</text>
<text x="822" y="60" text-anchor="middle" class="stage-sub" font-size="13">Pain / Champion</text>
<text x="822" y="78" text-anchor="middle" class="stage-pct" font-size="22">7</text>
<text x="822" y="96" text-anchor="middle" class="stage-sub" font-size="11">64% advance</text>
<text x="822" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: AE + SE</text>
<text x="822" y="264" text-anchor="middle" class="stage-sub" font-size="11">2-4 calls</text>

<polygon points="904,0 1016,0 1012,40 908,40" fill="url(#s6)"/>
<text x="960" y="25" text-anchor="middle" class="stage-label" font-size="17">PROPOSAL</text>
<text x="960" y="60" text-anchor="middle" class="stage-sub" font-size="13">Pricing + ROI</text>
<text x="960" y="78" text-anchor="middle" class="stage-pct" font-size="22">4</text>
<text x="960" y="96" text-anchor="middle" class="stage-sub" font-size="11">57% propose</text>
<text x="960" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: AE + Deal Desk</text>
<text x="960" y="264" text-anchor="middle" class="stage-sub" font-size="11">Mutual plan</text>

<polygon points="1036,0 1132,0 1132,40 1040,40" fill="url(#s7)"/>
<text x="1084" y="25" text-anchor="middle" class="stage-label" font-size="15">NEGOTIATION</text>
<text x="1084" y="60" text-anchor="middle" class="stage-sub" font-size="13">Legal + Procurement</text>
<text x="1084" y="78" text-anchor="middle" class="stage-pct" font-size="22">3</text>
<text x="1084" y="96" text-anchor="middle" class="stage-sub" font-size="11">75% to paper</text>
<text x="1084" y="248" text-anchor="middle" class="stage-sub" font-size="11">Owner: AE + Legal</text>
<text x="1084" y="264" text-anchor="middle" class="stage-sub" font-size="11">Redlines</text>

<g transform="translate(1160,0)">
<rect x="0" y="0" width="320" height="40" rx="6" fill="var(--c2)"/>
<text x="160" y="26" text-anchor="middle" class="stage-label" font-size="19" fill="var(--c3)">CLOSED-WON</text>
<text x="160" y="60" text-anchor="middle" class="stage-sub" font-size="13" fill="var(--c3)">Signed + Booked</text>
<text x="160" y="84" text-anchor="middle" class="stage-pct" font-size="28">2.0</text>
<text x="160" y="102" text-anchor="middle" class="stage-sub" font-size="11" fill="var(--c3)">2% lead-to-close</text>
<text x="160" y="248" text-anchor="middle" class="stage-sub" font-size="11" fill="var(--c3)">Owner: AE -&gt; CSM</text>
<text x="160" y="264" text-anchor="middle" class="stage-sub" font-size="11" fill="var(--c3)">Handoff in 7 days</text>
</g>

<g font-family="Inter,system-ui,sans-serif" font-size="11" fill="var(--c3)" opacity=".55">
<text x="100" y="130">Avg time</text><text x="100" y="146" font-weight="700" opacity="1" fill="var(--c4)">0-1 days</text>
<text x="308" y="130">Avg time</text><text x="308" y="146" font-weight="700" opacity="1" fill="var(--c4)">1-3 days</text>
<text x="496" y="130">Avg time</text><text x="496" y="146" font-weight="700" opacity="1" fill="var(--c4)">3-7 days</text>
<text x="668" y="130">Avg time</text><text x="668" y="146" font-weight="700" opacity="1" fill="var(--c4)">7-14 days</text>
<text x="822" y="130">Avg time</text><text x="822" y="146" font-weight="700" opacity="1" fill="var(--c4)">14-30 days</text>
<text x="960" y="130">Avg time</text><text x="960" y="146" font-weight="700" opacity="1" fill="var(--c4)">21-45 days</text>
<text x="1084" y="130">Avg time</text><text x="1084" y="146" font-weight="700" opacity="1" fill="var(--c4)">14-60 days</text>
<text x="1320" y="130" text-anchor="middle">Total cycle</text><text x="1320" y="146" text-anchor="middle" font-weight="700" opacity="1" fill="var(--c4)">60-160 days</text>
</g>

<g transform="translate(0,180)">
<text x="0" y="-6" class="axis" font-size="12">CONVERSION BAR — visualizing % surviving at each stage</text>
<rect x="0" y="0" width="1480" height="14" rx="3" fill="var(--ink)" opacity=".35"/>
<rect x="0" y="0" width="1480" height="14" rx="3" fill="url(#s1)"/>
<rect x="0" y="0" width="562" height="14" rx="3" fill="url(#s2)"/>
<rect x="0" y="0" width="311" height="14" rx="3" fill="url(#s3)"/>
<rect x="0" y="0" width="163" height="14" rx="3" fill="url(#s4)"/>
<rect x="0" y="0" width="104" height="14" rx="3" fill="url(#s5)"/>
<rect x="0" y="0" width="59" height="14" rx="3" fill="url(#s6)"/>
<rect x="0" y="0" width="30" height="14" rx="3" fill="var(--c2)"/>
<g font-family="Inter,system-ui,sans-serif" font-size="10" fill="var(--c3)" opacity=".75">
<text x="0" y="30">100%</text>
<text x="200" y="30">38%</text>
<text x="380" y="30">21%</text>
<text x="540" y="30">11%</text>
<text x="700" y="30">7%</text>
<text x="860" y="30">4%</text>
<text x="1000" y="30">3%</text>
<text x="1140" y="30" font-weight="800" fill="var(--c4)" opacity="1">2% CLOSED-WON</text>
</g>
</g>
</g>

<text x="48" y="384" class="subtitle" font-size="11">Benchmark: SaaS B2B mid-market. Per-stage conversion varies by ICP fit, deal size, and sales motion (PLG vs. enterprise).</text>
</svg>
