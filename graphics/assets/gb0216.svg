<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/><stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <text x="600" y="200" text-anchor="middle" filter="url(#shadow)" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="104" font-weight="900" fill="#FFFFFF" letter-spacing="-1" stroke="#0b0f17" stroke-width="3" paint-order="stroke">IT'S NOT A NO</text>
  <rect x="180" y="430" width="840" height="340" rx="28" fill="#0b0f17" stroke="#1e293b" stroke-width="4"/>
  <rect x="180" y="430" width="840" height="340" rx="28" fill="url(#glow)" opacity="0.5"/>
  <line x1="220" y1="600" x2="980" y2="600" stroke="#1e293b" stroke-width="2" stroke-dasharray="10 12"/>
  <polyline points="220,600 360,600 396,600 430,420 470,760 506,600 560,600 596,600 632,470 672,700 706,600 760,600 800,420 838,600 980,600" stroke="url(#accent)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="980" cy="600" r="11" fill="var(--c3,#FFD740)"/>
  <text x="600" y="730" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="#94a3b8">— PIPELINE DETECTED —</text>
  <text x="600" y="1050" text-anchor="middle" filter="url(#shadow)" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="100" font-weight="900" fill="#FFFFFF" letter-spacing="-1" stroke="#0b0f17" stroke-width="3" paint-order="stroke">IT'S A NOT YET</text>

</svg>