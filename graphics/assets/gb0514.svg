<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>
    svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
    .bg1{fill:var(--bg1,#0b0f17);}
    .bg2{fill:var(--bg2,#0f172a);}
    .title{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--c3);letter-spacing:0.5px;}
    .sub{font:500 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--c4b);}
    .lead{font:700 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);}
    .leadsub{font:500 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);opacity:0.85;}
    .pill{font:700 18px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);}
    .pillsub{font:500 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);opacity:0.8;}
    .line{stroke:var(--c2);stroke-width:2.5;fill:none;}
    .dot{fill:var(--c4);}
  </style>

  <!-- Background -->
  <rect class="bg1" width="1584" height="396"/>
  <rect class="bg2" x="0" y="0" width="1584" height="76"/>

  <!-- Title bar -->
  <text class="title" x="48" y="42">RevOps Team Structure</text>
  <text class="sub" x="48" y="64">Chief Revenue Officer org tree across Sales Ops, Marketing Ops, CS Ops, Systems, Analytics, and Enablement</text>

  <!-- CRO node (leader) -->
  <rect x="652" y="100" width="280" height="68" rx="14" fill="var(--c4)" stroke="var(--c2)" stroke-width="2"/>
  <text class="lead" x="792" y="134" text-anchor="middle">Chief Revenue Officer</text>
  <text class="leadsub" x="792" y="155" text-anchor="middle">Owns pipeline, retention, forecast accuracy</text>

  <!-- VP RevOps node -->
  <rect x="652" y="190" width="280" height="56" rx="12" fill="var(--c1)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="792" y="216" text-anchor="middle">VP / Head of RevOps</text>
  <text class="pillsub" x="792" y="234" text-anchor="middle">Single throat to choke across the 6 functions</text>

  <!-- Connector: CRO -> VP RevOps -->
  <path class="line" d="M792 168 L792 190"/>

  <!-- Horizontal trunk under VP RevOps -->
  <path class="line" d="M792 246 L792 270 L160 270 L160 290"/>
  <path class="line" d="M792 270 L398 270 L398 290"/>
  <path class="line" d="M792 270 L636 270 L636 290"/>
  <path class="line" d="M792 270 L948 270 L948 290"/>
  <path class="line" d="M792 270 L1186 270 L1186 290"/>
  <path class="line" d="M792 270 L1424 270 L1424 290"/>

  <!-- Trunk dots -->
  <circle class="dot" cx="160" cy="270" r="4"/>
  <circle class="dot" cx="398" cy="270" r="4"/>
  <circle class="dot" cx="636" cy="270" r="4"/>
  <circle class="dot" cx="948" cy="270" r="4"/>
  <circle class="dot" cx="1186" cy="270" r="4"/>
  <circle class="dot" cx="1424" cy="270" r="4"/>

  <!-- Six function pills -->
  <!-- 1 Sales Ops -->
  <rect x="40" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="160" y="320" text-anchor="middle">Sales Ops</text>
  <text class="pillsub" x="160" y="340" text-anchor="middle">Quota, territory, comp,</text>
  <text class="pillsub" x="160" y="356" text-anchor="middle">forecast cadence</text>

  <!-- 2 Marketing Ops -->
  <rect x="278" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="398" y="320" text-anchor="middle">Marketing Ops</text>
  <text class="pillsub" x="398" y="340" text-anchor="middle">MQL scoring, attribution,</text>
  <text class="pillsub" x="398" y="356" text-anchor="middle">Marketo / HubSpot admin</text>

  <!-- 3 Customer Success Ops -->
  <rect x="516" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="636" y="320" text-anchor="middle">Customer Success Ops</text>
  <text class="pillsub" x="636" y="340" text-anchor="middle">Health scores, renewals,</text>
  <text class="pillsub" x="636" y="356" text-anchor="middle">NRR / churn ops</text>

  <!-- 4 Systems -->
  <rect x="828" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="948" y="320" text-anchor="middle">Systems</text>
  <text class="pillsub" x="948" y="340" text-anchor="middle">Salesforce admin, CPQ,</text>
  <text class="pillsub" x="948" y="356" text-anchor="middle">integrations, data hygiene</text>

  <!-- 5 Analytics -->
  <rect x="1066" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="1186" y="320" text-anchor="middle">Analytics</text>
  <text class="pillsub" x="1186" y="340" text-anchor="middle">Pipeline math, dashboards,</text>
  <text class="pillsub" x="1186" y="356" text-anchor="middle">cohort + funnel models</text>

  <!-- 6 Enablement -->
  <rect x="1304" y="290" width="240" height="78" rx="12" fill="var(--c3)" stroke="var(--c2)" stroke-width="2"/>
  <text class="pill" x="1424" y="320" text-anchor="middle">Enablement</text>
  <text class="pillsub" x="1424" y="340" text-anchor="middle">Onboarding, playbooks,</text>
  <text class="pillsub" x="1424" y="356" text-anchor="middle">MEDDPICC, ramp time</text>

  <!-- Small decorative corner accents -->
  <rect x="0" y="0" width="6" height="76" fill="var(--c1)"/>
  <rect x="0" y="76" width="1584" height="3" fill="var(--c2)" opacity="0.6"/>
</svg>
