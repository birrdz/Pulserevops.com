  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Equipment <tspan fill="url(#accent)">&#183;</tspan> Materials <tspan fill="url(#accent)">&#183;</tspan> Heavy Rental <tspan fill="url(#accent)">&#183;</tspan> Modular</text>
