<!-- Stale-zone divider -->
<line x1="844" y1="116" x2="844" y2="362" stroke="var(--stale)" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
<text x="852" y="378" font-family="sans-serif" font-size="13" fill="var(--stale)" font-weight="600">▶ Stale Zone — flag for review</text>

<!-- Footer note -->
<text x="48" y="378" font-family="sans-serif" font-size="13" fill="var(--c4b)" opacity="0.7">Cell = deal count · color intensity = aging severity · cross-hatch divider marks 60-day stale threshold</text>
</svg>
