<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <style>svg{--c1:#a78bfa;--c2:#7c3aed;--c3:#d8b4fe;--c4:#f472b6;--c4b:#fbcfe8;--ink:#120726;}</style>
  <defs>
