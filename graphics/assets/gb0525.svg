<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;} .lbl{font-family:'Inter',system-ui,sans-serif;font-weight:700;fill:var(--ink);} .sub{font-family:'Inter',system-ui,sans-serif;font-weight:500;fill:var(--ink);opacity:0.78;} .stp{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--ink);} .ttl{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--c3);letter-spacing:0.5px;} .tag{font-family:'Inter',system-ui,sans-serif;font-weight:600;fill:var(--c3);opacity:0.85;letter-spacing:2px;}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="var(--bg1, #0b0f17)"/>
<stop offset="1" stop-color="var(--bg2, #0f172a)"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c1)"/>
<stop offset="1" stop-color="var(--c2)"/>
</linearGradient>
<linearGradient id="cardAlt" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c4)"/>
<stop offset="1" stop-color="var(--c4b)"/>
</linearGradient>
</defs>
<rect width="1584" height="396" fill="url(#bg)"/>
<text x="60" y="56" class="tag" font-size="14">PULSE GRAPHICS / PROCESS</text>
<text x="60" y="92" class="ttl" font-size="28">Customer Onboarding Flow</text>
<line x1="60" y1="110" x2="280" y2="110" stroke="var(--c1)" stroke-width="3" stroke-linecap="round"/>

<!-- Connecting track -->
<line x1="170" y1="245" x2="1414" y2="245" stroke="var(--c2)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.55"/>

<!-- Step 1: Kickoff -->
<g transform="translate(110,160)">
<rect width="184" height="170" rx="18" fill="url(#card)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">1</text>
<g transform="translate(70,18)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M6 22 L22 6 L38 22"/>
<path d="M12 20 L12 38 L32 38 L32 20"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="22">Kickoff</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Goals + stakeholders</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 0 - 3</text>
</g>

<!-- Arrow 1 -->
<path d="M298 245 L324 245" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/>
<path d="M318 238 L330 245 L318 252 Z" fill="var(--c1)"/>

<!-- Step 2: Configuration -->
<g transform="translate(334,160)">
<rect width="184" height="170" rx="18" fill="url(#cardAlt)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">2</text>
<g transform="translate(70,18)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="22" cy="22" r="6"/>
<path d="M22 4 L22 10 M22 34 L22 40 M4 22 L10 22 M34 22 L40 22 M9 9 L13 13 M31 31 L35 35 M9 35 L13 31 M31 13 L35 9"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="22">Configuration</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Provision + integrate</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 3 - 10</text>
</g>

<!-- Arrow 2 -->
<path d="M522 245 L548 245" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/>
<path d="M542 238 L554 245 L542 252 Z" fill="var(--c1)"/>

<!-- Step 3: Training -->
<g transform="translate(558,160)">
<rect width="184" height="170" rx="18" fill="url(#card)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">3</text>
<g transform="translate(70,18)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 16 L22 6 L40 16 L22 26 Z"/>
<path d="M12 22 L12 34 C12 38 32 38 32 34 L32 22"/>
<path d="M40 16 L40 30"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="22">Training</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Enable end users</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 10 - 21</text>
</g>

<!-- Arrow 3 -->
<path d="M746 245 L772 245" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/>
<path d="M766 238 L778 245 L766 252 Z" fill="var(--c1)"/>

<!-- Step 4: Launch -->
<g transform="translate(782,160)">
<rect width="184" height="170" rx="18" fill="url(#cardAlt)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">4</text>
<g transform="translate(70,16)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M22 4 C30 14 30 26 22 36 C14 26 14 14 22 4 Z"/>
<circle cx="22" cy="18" r="4"/>
<path d="M14 32 L8 40 M30 32 L36 40"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="22">Launch</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Go-live + handoff</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 21 - 30</text>
</g>

<!-- Arrow 4 -->
<path d="M970 245 L996 245" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/>
<path d="M990 238 L1002 245 L990 252 Z" fill="var(--c1)"/>

<!-- Step 5: 30-day check-in -->
<g transform="translate(1006,160)">
<rect width="184" height="170" rx="18" fill="url(#card)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">5</text>
<g transform="translate(70,16)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="22" cy="22" r="16"/>
<path d="M22 12 L22 22 L30 26"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="20">30-Day Check-In</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Adoption + health</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 30</text>
</g>

<!-- Arrow 5 -->
<path d="M1194 245 L1220 245" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/>
<path d="M1214 238 L1226 245 L1214 252 Z" fill="var(--c1)"/>

<!-- Step 6: QBR -->
<g transform="translate(1230,160)">
<rect width="184" height="170" rx="18" fill="url(#cardAlt)"/>
<circle cx="32" cy="32" r="20" fill="var(--ink)" opacity="0.18"/>
<text x="32" y="40" text-anchor="middle" class="stp" font-size="22">6</text>
<g transform="translate(70,16)" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 38 L4 24 L12 24 L12 38 M18 38 L18 14 L26 14 L26 38 M32 38 L32 6 L40 6 L40 38"/>
<path d="M2 38 L42 38"/>
</g>
<text x="92" y="100" text-anchor="middle" class="lbl" font-size="22">QBR</text>
<text x="92" y="128" text-anchor="middle" class="sub" font-size="14">Value review + plan</text>
<text x="92" y="148" text-anchor="middle" class="sub" font-size="14">Day 90</text>
</g>

<!-- Footer cadence bar -->
<rect x="60" y="356" width="1464" height="2" fill="var(--c3)" opacity="0.3" rx="1"/>
<text x="60" y="380" class="sub" font-size="14">Repeatable 90-day arc from contract signature to first value review.</text>
</svg>
