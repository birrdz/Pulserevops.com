<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <style>svg{--c1:#a3e635;--c2:#65a30d;--c3:#d9f99d;--c4:#22d3ee;--c4b:#a5f3fc;--ink:#0d1403;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>

<text x="960" y="358" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="14" fill="url(#accent)">Q4 2027</text>

<text x="960" y="510" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="124" font-weight="900" fill="#FFFFFF">Quarterly Business Review</text>

<polyline points="540,610 760,610 820,610 855,540 895,700 935,610 1040,610 1080,610 1115,556 1155,672 1195,610 1390,610"
    stroke="url(#accent)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

<text x="960" y="724" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="700" fill="#EDE5D8">Revenue <tspan fill="url(#accent)">&#183;</tspan> Pipeline <tspan fill="url(#accent)">&#183;</tspan> Forecast</text>

</svg>
