<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}text{font-family:'Inter','Segoe UI',system-ui,sans-serif;fill:#e2e8f0}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="var(--bg1,#0b0f17)"/>
<stop offset="1" stop-color="var(--bg2,#0f172a)"/>
</linearGradient>
<linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="var(--c2)"/>
<stop offset="1" stop-color="var(--c1)"/>
</linearGradient>
<linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="var(--c4)"/>
<stop offset="1" stop-color="var(--c4b)"/>
</linearGradient>
</defs>

<rect width="1584" height="396" fill="url(#bg)"/>

<!-- Header bar -->
<rect x="32" y="24" width="1520" height="46" rx="8" fill="var(--ink)" opacity="0.55"/>
<circle cx="58" cy="47" r="7" fill="var(--c1)"/>
<text x="78" y="54" font-size="20" font-weight="700" fill="var(--c3)">MARKETING KPI DASHBOARD</text>
<text x="1430" y="54" font-size="18" fill="var(--c4b)">Q3 2027</text>

<!-- ===== Card 1: MQL Count ===== -->
<rect x="32" y="92" width="288" height="280" rx="12" fill="var(--ink)" opacity="0.5"/>
<rect x="32" y="92" width="288" height="40" rx="12" fill="var(--c2)" opacity="0.35"/>
<text x="50" y="120" font-size="18" font-weight="600" fill="var(--c3)">MQL COUNT</text>
<text x="50" y="200" font-size="60" font-weight="800" fill="var(--c1)">4,812</text>
<text x="50" y="226" font-size="16" fill="#94a3b8">marketing qualified leads</text>
<!-- mini sparkline bars -->
<rect x="50"  y="290" width="22" height="50" fill="url(#bar1)" rx="3"/>
<rect x="80"  y="270" width="22" height="70" fill="url(#bar1)" rx="3"/>
<rect x="110" y="280" width="22" height="60" fill="url(#bar1)" rx="3"/>
<rect x="140" y="255" width="22" height="85" fill="url(#bar1)" rx="3"/>
<rect x="170" y="240" width="22" height="100" fill="url(#bar1)" rx="3"/>
<rect x="200" y="225" width="22" height="115" fill="url(#bar1)" rx="3"/>
<rect x="230" y="210" width="22" height="130" fill="url(#bar1)" rx="3"/>
<rect x="260" y="195" width="22" height="145" fill="url(#bar1)" rx="3"/>
<text x="50" y="360" font-size="14" fill="var(--c4b)">▲ 18% MoM</text>

<!-- ===== Card 2: MQL → SQL % (donut) ===== -->
<rect x="340" y="92" width="288" height="280" rx="12" fill="var(--ink)" opacity="0.5"/>
<rect x="340" y="92" width="288" height="40" rx="12" fill="var(--c2)" opacity="0.35"/>
<text x="358" y="120" font-size="18" font-weight="600" fill="var(--c3)">MQL → SQL CONVERSION</text>
<!-- donut: 34% -->
<circle cx="484" cy="240" r="78" fill="none" stroke="var(--ink)" stroke-width="20" opacity="0.6"/>
<circle cx="484" cy="240" r="78" fill="none" stroke="var(--c1)" stroke-width="20"
        stroke-dasharray="166.5 323.5" stroke-dashoffset="122" transform="rotate(-90 484 240)" stroke-linecap="round"/>
<text x="484" y="248" font-size="40" font-weight="800" text-anchor="middle" fill="var(--c1)">34%</text>
<text x="484" y="340" font-size="15" text-anchor="middle" fill="#94a3b8">1,636 SQLs accepted</text>
<text x="484" y="362" font-size="14" text-anchor="middle" fill="var(--c4b)">target: 30%</text>

<!-- ===== Card 3: CAC by Channel ===== -->
<rect x="648" y="92" width="288" height="280" rx="12" fill="var(--ink)" opacity="0.5"/>
<rect x="648" y="92" width="288" height="40" rx="12" fill="var(--c2)" opacity="0.35"/>
<text x="666" y="120" font-size="18" font-weight="600" fill="var(--c3)">CAC BY CHANNEL</text>
<!-- horizontal bars -->
<text x="666" y="168" font-size="14" fill="#cbd5e1">Paid Search</text>
<rect x="666" y="174" width="240" height="14" rx="3" fill="var(--ink)" opacity="0.6"/>
<rect x="666" y="174" width="210" height="14" rx="3" fill="url(#bar2)"/>
<text x="888" y="186" font-size="14" font-weight="700" fill="var(--c4b)" text-anchor="end">$1,840</text>

<text x="666" y="214" font-size="14" fill="#cbd5e1">Content / SEO</text>
<rect x="666" y="220" width="240" height="14" rx="3" fill="var(--ink)" opacity="0.6"/>
<rect x="666" y="220" width="78" height="14" rx="3" fill="url(#bar1)"/>
<text x="888" y="232" font-size="14" font-weight="700" fill="var(--c1)" text-anchor="end">$680</text>

<text x="666" y="260" font-size="14" fill="#cbd5e1">Outbound SDR</text>
<rect x="666" y="266" width="240" height="14" rx="3" fill="var(--ink)" opacity="0.6"/>
<rect x="666" y="266" width="168" height="14" rx="3" fill="url(#bar2)"/>
<text x="888" y="278" font-size="14" font-weight="700" fill="var(--c4b)" text-anchor="end">$1,470</text>

<text x="666" y="306" font-size="14" fill="#cbd5e1">Events</text>
<rect x="666" y="312" width="240" height="14" rx="3" fill="var(--ink)" opacity="0.6"/>
<rect x="666" y="312" width="225" height="14" rx="3" fill="url(#bar2)"/>
<text x="888" y="324" font-size="14" font-weight="700" fill="var(--c4b)" text-anchor="end">$1,970</text>

<text x="666" y="352" font-size="14" fill="#cbd5e1">Referral</text>
<rect x="666" y="358" width="240" height="14" rx="3" fill="var(--ink)" opacity="0.6"/>
<rect x="666" y="358" width="48" height="14" rx="3" fill="url(#bar1)"/>
<text x="888" y="370" font-size="14" font-weight="700" fill="var(--c1)" text-anchor="end">$420</text>

<!-- ===== Card 4: Pipeline Sourced ===== -->
<rect x="956" y="92" width="288" height="280" rx="12" fill="var(--ink)" opacity="0.5"/>
<rect x="956" y="92" width="288" height="40" rx="12" fill="var(--c2)" opacity="0.35"/>
<text x="974" y="120" font-size="18" font-weight="600" fill="var(--c3)">PIPELINE SOURCED</text>
<text x="974" y="200" font-size="44" font-weight="800" fill="var(--c1)">$8.4M</text>
<text x="974" y="224" font-size="15" fill="#94a3b8">marketing-sourced ARR</text>
<!-- stacked progress -->
<text x="974" y="258" font-size="14" fill="#cbd5e1">Goal $10.0M</text>
<rect x="974" y="266" width="252" height="18" rx="4" fill="var(--ink)" opacity="0.6"/>
<rect x="974" y="266" width="212" height="18" rx="4" fill="url(#bar1)"/>
<text x="1226" y="280" font-size="13" font-weight="700" fill="var(--c4b)" text-anchor="end">84%</text>

<!-- mini pie segments: Enterprise / Mid / SMB -->
<text x="974" y="316" font-size="13" fill="#cbd5e1">Enterprise</text>
<rect x="1078" y="306" width="148" height="10" rx="2" fill="var(--ink)" opacity="0.6"/>
<rect x="1078" y="306" width="88" height="10" rx="2" fill="var(--c1)"/>

<text x="974" y="338" font-size="13" fill="#cbd5e1">Mid-Market</text>
<rect x="1078" y="328" width="148" height="10" rx="2" fill="var(--ink)" opacity="0.6"/>
<rect x="1078" y="328" width="44" height="10" rx="2" fill="var(--c4)"/>

<text x="974" y="360" font-size="13" fill="#cbd5e1">SMB</text>
<rect x="1078" y="350" width="148" height="10" rx="2" fill="var(--ink)" opacity="0.6"/>
<rect x="1078" y="350" width="16" height="10" rx="2" fill="var(--c3)"/>

<!-- ===== Card 5: Brand Lift (line chart) ===== -->
<rect x="1264" y="92" width="288" height="280" rx="12" fill="var(--ink)" opacity="0.5"/>
<rect x="1264" y="92" width="288" height="40" rx="12" fill="var(--c2)" opacity="0.35"/>
<text x="1282" y="120" font-size="18" font-weight="600" fill="var(--c3)">BRAND LIFT</text>
<text x="1282" y="186" font-size="42" font-weight="800" fill="var(--c1)">+27%</text>
<text x="1282" y="208" font-size="14" fill="#94a3b8">aided awareness, YoY</text>

<!-- grid lines -->
<line x1="1282" y1="252" x2="1534" y2="252" stroke="#1e293b" stroke-width="1"/>
<line x1="1282" y1="296" x2="1534" y2="296" stroke="#1e293b" stroke-width="1"/>
<line x1="1282" y1="340" x2="1534" y2="340" stroke="#1e293b" stroke-width="1"/>

<!-- area fill -->
<path d="M1282,330 L1316,318 L1352,306 L1388,292 L1424,272 L1460,258 L1496,244 L1534,232 L1534,340 L1282,340 Z"
      fill="var(--c1)" opacity="0.22"/>
<!-- line -->
<polyline points="1282,330 1316,318 1352,306 1388,292 1424,272 1460,258 1496,244 1534,232"
          fill="none" stroke="var(--c1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- markers -->
<circle cx="1282" cy="330" r="4" fill="var(--c4)"/>
<circle cx="1352" cy="306" r="4" fill="var(--c4)"/>
<circle cx="1424" cy="272" r="4" fill="var(--c4)"/>
<circle cx="1496" cy="244" r="4" fill="var(--c4)"/>
<circle cx="1534" cy="232" r="5" fill="var(--c4b)" stroke="var(--ink)" stroke-width="1"/>

<text x="1282" y="362" font-size="12" fill="#64748b">Q1</text>
<text x="1352" y="362" font-size="12" fill="#64748b">Q2</text>
<text x="1424" y="362" font-size="12" fill="#64748b">Q3</text>
<text x="1496" y="362" font-size="12" fill="#64748b">Q4</text>
</svg>
