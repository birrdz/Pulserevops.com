<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#22d3ee;--c2:#0891b2;--c3:#67e8f9;--c4:#fbbf24;--c4b:#fde68a;--ink:#021016;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#22d3ee)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#0891b2)"/>
      <stop offset="1" style="stop-color:var(--c3,#67e8f9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#22d3ee)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#22d3ee)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Ascending 5-bar stack on the right, tallest in accent gradient -->
  <g opacity="0.95">
    <rect x="1040" y="290" width="60" height="30" rx="6" fill="#67e8f9" opacity="0.45"/>
    <rect x="1130" y="250" width="60" height="70" rx="6" fill="#22d3ee" opacity="0.55"/>
    <rect x="1220" y="210" width="60" height="110" rx="6" fill="#0891b2" opacity="0.7"/>
    <rect x="1310" y="160" width="60" height="160" rx="6" fill="#22d3ee" opacity="0.8"/>
    <rect x="1400" y="90"  width="60" height="230" rx="6" fill="url(#accent)"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">PIPELINE GENERATION</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">SDR Manager.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="700" fill="#EDE5D8">Coach <tspan fill="url(#accent)">&#183;</tspan> Inspect <tspan fill="url(#accent)">&#183;</tspan> Ramp</text>
</svg>
