<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>svg{--c1:#94a3b8;--c2:#475569;--c3:#cbd5e1;--c4:#38bdf8;--c4b:#bae6fd;--ink:#0b1220;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c3,#FFD740)"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="1" style="stop-color:var(--c2,#E8710A)"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#22d3ee)"/>
      <stop offset="1" style="stop-color:var(--c4,#0ea5b7)"/>
    </linearGradient>
    <linearGradient id="band4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#0ea5b7)"/>
      <stop offset="1" style="stop-color:var(--c2,#0f766e)"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#glow)"/>

<text x="540" y="150" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#94a3b8">REVENUE OPERATIONS</text>
  <text x="540" y="222" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">The RevOps Funnel</text>

<polygon points="160,320 920,320 836,500 244,500" fill="url(#band1)"/>
  <text x="540" y="402" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#0b0f17">AWARENESS</text>
  <text x="540" y="446" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0f17" opacity="0.78">Reach the right buyers at the top of funnel</text>

<polygon points="252,516 828,516 744,696 336,696" fill="url(#band2)"/>
  <text x="540" y="598" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#0b0f17">PIPELINE</text>
  <text x="540" y="642" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0f17" opacity="0.78">Qualify and advance real opportunities</text>

<polygon points="344,712 736,712 652,892 428,892" fill="url(#band3)"/>
  <text x="540" y="794" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#0b0f17">CLOSE</text>
  <text x="540" y="838" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0f17" opacity="0.78">Win the deal and convert to revenue</text>

<polygon points="436,908 644,908 560,1088 520,1088" fill="url(#band4)"/>
  <text x="540" y="990" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#FFFFFF">EXPANSION</text>
  <text x="540" y="1146" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="600" fill="#94a3b8">Renew, upsell and grow accounts over time</text>

</svg>
