<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
.bg1{fill:var(--bg1,#0b0f17);} .bg2{fill:var(--bg2,#0f172a);}
.grid{stroke:#1e293b;stroke-width:1;}
.axis{stroke:#475569;stroke-width:2;}
.axislbl{fill:#cbd5e1;font-family:'Inter',system-ui,sans-serif;font-size:18px;}
.tick{fill:#94a3b8;font-family:'Inter',system-ui,sans-serif;font-size:16px;}
.title{fill:var(--c3);font-family:'Inter',system-ui,sans-serif;font-size:26px;font-weight:700;}
.sub{fill:#cbd5e1;font-family:'Inter',system-ui,sans-serif;font-size:18px;}
.line-ramp{fill:none;stroke:var(--c1);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
.line-proj{fill:none;stroke:var(--c4);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8;}
.line-target{fill:none;stroke:var(--c2);stroke-width:2;stroke-dasharray:4 6;opacity:0.7;}
.dot{fill:var(--c2);stroke:var(--c3);stroke-width:3;}
.dot-proj{fill:var(--c4);stroke:var(--c4b);stroke-width:3;}
.callout{fill:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:600;}
.badge1{fill:var(--c1);}
.badge2{fill:var(--c4);}
.legend{fill:#e2e8f0;font-family:'Inter',system-ui,sans-serif;font-size:16px;}
</style>
<rect class="bg1" width="1584" height="396"/>
<rect class="bg2" x="0" y="0" width="1584" height="60"/>

<text class="title" x="40" y="38">AE Productivity Ramp — Months 1 through 12</text>
<text class="sub" x="40" y="56" style="font-size:16px;">0% in Month 1 → 100% in Month 6 → projected through Month 12</text>

<g transform="translate(80,100)">
<line class="axis" x1="60" y1="0" x2="60" y2="240"/>
<line class="axis" x1="60" y1="240" x2="1420" y2="240"/>

<line class="grid" x1="60" y1="0" x2="1420" y2="0"/>
<line class="grid" x1="60" y1="48" x2="1420" y2="48"/>
<line class="grid" x1="60" y1="96" x2="1420" y2="96"/>
<line class="grid" x1="60" y1="144" x2="1420" y2="144"/>
<line class="grid" x1="60" y1="192" x2="1420" y2="192"/>

<text class="tick" x="50" y="6" text-anchor="end">120%</text>
<text class="tick" x="50" y="54" text-anchor="end">100%</text>
<text class="tick" x="50" y="102" text-anchor="end">75%</text>
<text class="tick" x="50" y="150" text-anchor="end">50%</text>
<text class="tick" x="50" y="198" text-anchor="end">25%</text>
<text class="tick" x="50" y="246" text-anchor="end">0%</text>

<text class="tick" x="173" y="266" text-anchor="middle">M1</text>
<text class="tick" x="286" y="266" text-anchor="middle">M2</text>
<text class="tick" x="399" y="266" text-anchor="middle">M3</text>
<text class="tick" x="512" y="266" text-anchor="middle">M4</text>
<text class="tick" x="625" y="266" text-anchor="middle">M5</text>
<text class="tick" x="738" y="266" text-anchor="middle">M6</text>
<text class="tick" x="851" y="266" text-anchor="middle">M7</text>
<text class="tick" x="964" y="266" text-anchor="middle">M8</text>
<text class="tick" x="1077" y="266" text-anchor="middle">M9</text>
<text class="tick" x="1190" y="266" text-anchor="middle">M10</text>
<text class="tick" x="1303" y="266" text-anchor="middle">M11</text>
<text class="tick" x="1416" y="266" text-anchor="middle">M12</text>

<text class="axislbl" x="-130" y="124" transform="rotate(-90 -130 124)" text-anchor="middle">Productivity vs Full Quota</text>
<text class="axislbl" x="740" y="298" text-anchor="middle">Month Since Hire</text>

<line class="line-target" x1="60" y1="48" x2="1420" y2="48"/>
<text class="tick" x="1425" y="52" style="fill:var(--c2);">target 100%</text>

<path class="line-ramp" d="M 173 240 L 286 211 L 399 173 L 512 125 L 625 82 L 738 48"/>

<path class="line-proj" d="M 738 48 L 851 38 L 964 31 L 1077 28 L 1190 26 L 1303 27 L 1416 29"/>

<circle class="dot" cx="173" cy="240" r="7"/>
<circle class="dot" cx="286" cy="211" r="7"/>
<circle class="dot" cx="399" cy="173" r="7"/>
<circle class="dot" cx="512" cy="125" r="7"/>
<circle class="dot" cx="625" cy="82" r="7"/>
<circle class="dot" cx="738" cy="48" r="9"/>

<circle class="dot-proj" cx="851" cy="38" r="7"/>
<circle class="dot-proj" cx="964" cy="31" r="7"/>
<circle class="dot-proj" cx="1077" cy="28" r="7"/>
<circle class="dot-proj" cx="1190" cy="26" r="7"/>
<circle class="dot-proj" cx="1303" cy="27" r="7"/>
<circle class="dot-proj" cx="1416" cy="29" r="7"/>

<g transform="translate(150,210)">
<rect class="badge1" x="0" y="0" width="92" height="26" rx="13"/>
<text class="callout" x="46" y="18" text-anchor="middle">M1: 0%</text>
</g>

<g transform="translate(688,12)">
<rect class="badge1" x="0" y="0" width="120" height="26" rx="13"/>
<text class="callout" x="60" y="18" text-anchor="middle">M6: 100% ramp</text>
</g>

<g transform="translate(1320,0)">
<rect class="badge2" x="0" y="0" width="100" height="26" rx="13"/>
<text class="callout" x="50" y="18" text-anchor="middle">M12: 115%</text>
</g>
</g>

<g transform="translate(80,358)">
<line x1="0" y1="6" x2="40" y2="6" stroke="var(--c1)" stroke-width="5" stroke-linecap="round"/>
<circle cx="20" cy="6" r="5" fill="var(--c2)"/>
<text class="legend" x="50" y="11">Actual ramp (M1-M6)</text>

<line x1="280" y1="6" x2="320" y2="6" stroke="var(--c4)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle cx="300" cy="6" r="5" fill="var(--c4)"/>
<text class="legend" x="330" y="11">Projected steady-state (M7-M12)</text>

<line x1="640" y1="6" x2="680" y2="6" stroke="var(--c2)" stroke-width="2" stroke-dasharray="4 6"/>
<text class="legend" x="690" y="11">Full-quota target line (100%)</text>
</g>
</svg>
