<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
<rect width="1584" height="396" fill="var(--bg1,#0b0f17)"/>
<rect x="48" y="48" width="1488" height="300" rx="14" fill="var(--bg2,#0f172a)"/>

<text x="72" y="92" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="var(--c3)">Forecast Categories vs Quota</text>
<text x="72" y="120" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)" opacity="0.7">Stacked by category — target line marks quota</text>

<!-- Legend -->
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">
  <rect x="900" y="78" width="18" height="18" rx="3" fill="var(--c2)"/><text x="926" y="93">Commit</text>
  <rect x="1020" y="78" width="18" height="18" rx="3" fill="var(--c1)"/><text x="1046" y="93">Best Case</text>
  <rect x="1162" y="78" width="18" height="18" rx="3" fill="var(--c4)"/><text x="1188" y="93">Upside</text>
  <rect x="1268" y="78" width="18" height="18" rx="3" fill="var(--c4b)" opacity="0.55"/><text x="1294" y="93">Pipeline</text>
  <line x1="1390" y1="87" x2="1422" y2="87" stroke="var(--c3)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="1430" y="93">Quota</text>
</g>

<!-- Y axis labels ($M) -->
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="var(--c3)" opacity="0.65">
  <text x="72" y="170" text-anchor="start">$10M</text>
  <text x="72" y="220" text-anchor="start">$7.5M</text>
  <text x="72" y="270" text-anchor="start">$5M</text>
  <text x="72" y="320" text-anchor="start">$2.5M</text>
</g>

<!-- Gridlines -->
<g stroke="var(--c3)" stroke-opacity="0.12" stroke-width="1">
  <line x1="130" y1="165" x2="1500" y2="165"/>
  <line x1="130" y1="215" x2="1500" y2="215"/>
  <line x1="130" y1="265" x2="1500" y2="265"/>
  <line x1="130" y1="315" x2="1500" y2="315"/>
</g>

<!-- Baseline -->
<line x1="130" y1="330" x2="1500" y2="330" stroke="var(--c3)" stroke-opacity="0.4" stroke-width="2"/>

<!-- Quota target line at y=185 (~$9M) -->
<line x1="130" y1="185" x2="1500" y2="185" stroke="var(--c3)" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1505" y="190" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--c3)">$9M</text>

<!-- Bars: 6 quarters. Each bar stacked Commit (bottom) + Best Case + Upside + Pipeline (top, faded).
     x positions: 200, 410, 620, 830, 1040, 1250. width 130 -->

<!-- Q1 2026 -->
<g>
  <rect x="200" y="265" width="130" height="65" fill="var(--c2)"/>
  <rect x="200" y="225" width="130" height="40" fill="var(--c1)"/>
  <rect x="200" y="200" width="130" height="25" fill="var(--c4)"/>
  <rect x="200" y="170" width="130" height="30" fill="var(--c4b)" opacity="0.55"/>
  <text x="265" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q1'26</text>
  <text x="265" y="298" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$3.3M</text>
</g>

<!-- Q2 2026 -->
<g>
  <rect x="410" y="260" width="130" height="70" fill="var(--c2)"/>
  <rect x="410" y="215" width="130" height="45" fill="var(--c1)"/>
  <rect x="410" y="188" width="130" height="27" fill="var(--c4)"/>
  <rect x="410" y="155" width="130" height="33" fill="var(--c4b)" opacity="0.55"/>
  <text x="475" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q2'26</text>
  <text x="475" y="295" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$3.5M</text>
</g>

<!-- Q3 2026 -->
<g>
  <rect x="620" y="255" width="130" height="75" fill="var(--c2)"/>
  <rect x="620" y="205" width="130" height="50" fill="var(--c1)"/>
  <rect x="620" y="175" width="130" height="30" fill="var(--c4)"/>
  <rect x="620" y="140" width="130" height="35" fill="var(--c4b)" opacity="0.55"/>
  <text x="685" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q3'26</text>
  <text x="685" y="293" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$3.75M</text>
</g>

<!-- Q4 2026 -->
<g>
  <rect x="830" y="248" width="130" height="82" fill="var(--c2)"/>
  <rect x="830" y="195" width="130" height="53" fill="var(--c1)"/>
  <rect x="830" y="160" width="130" height="35" fill="var(--c4)"/>
  <rect x="830" y="118" width="130" height="42" fill="var(--c4b)" opacity="0.55"/>
  <text x="895" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q4'26</text>
  <text x="895" y="289" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$4.1M</text>
</g>

<!-- Q1 2027 -->
<g>
  <rect x="1040" y="253" width="130" height="77" fill="var(--c2)"/>
  <rect x="1040" y="200" width="130" height="53" fill="var(--c1)"/>
  <rect x="1040" y="168" width="130" height="32" fill="var(--c4)"/>
  <rect x="1040" y="130" width="130" height="38" fill="var(--c4b)" opacity="0.55"/>
  <text x="1105" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q1'27</text>
  <text x="1105" y="291" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$3.85M</text>
</g>

<!-- Q2 2027 -->
<g>
  <rect x="1250" y="245" width="130" height="85" fill="var(--c2)"/>
  <rect x="1250" y="188" width="130" height="57" fill="var(--c1)"/>
  <rect x="1250" y="152" width="130" height="36" fill="var(--c4)"/>
  <rect x="1250" y="108" width="130" height="44" fill="var(--c4b)" opacity="0.55"/>
  <text x="1315" y="356" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="var(--c3)">Q2'27</text>
  <text x="1315" y="287" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--ink)">$4.25M</text>
</g>

<!-- Footer note -->
<text x="72" y="380" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="var(--c3)" opacity="0.55">Commit = will close · Best Case = likely · Upside = stretch · Pipeline = unweighted · Dashed line = quota</text>
</svg>
