<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#a78bfa;--c2:#6d28d9;--c3:#c4b5fd;--c4:#fbbf24;--c4b:#fde68a;--ink:#1f0840;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#a78bfa)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#6d28d9)"/>
      <stop offset="1" style="stop-color:var(--c3,#c4b5fd)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#a78bfa)" stop-opacity="0.22"/>
      <stop offset="1" style="stop-color:var(--c1,#a78bfa)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Decorative nodes-and-pipes flow diagram on the right -->
  <g stroke="url(#accent)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- pipes -->
    <path d="M 980 120 L 1080 120 L 1130 170 L 1230 170"/>
    <path d="M 980 200 L 1130 200 L 1180 250 L 1330 250"/>
    <path d="M 980 280 L 1080 280 L 1130 230 L 1230 230"/>
    <path d="M 1230 170 L 1330 170 L 1380 200 L 1480 200"/>
    <path d="M 1330 250 L 1430 250 L 1480 200"/>
    <path d="M 1230 230 L 1280 230"/>
  </g>
  <!-- nodes (circles + small squares) -->
  <g opacity="0.98">
    <circle cx="980" cy="120" r="14" fill="var(--c2,#6d28d9)" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="980" cy="200" r="14" fill="var(--c2,#6d28d9)" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="980" cy="280" r="14" fill="var(--c2,#6d28d9)" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1216" y="156" width="28" height="28" rx="6" fill="var(--ink,#1f0840)" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1216" y="216" width="28" height="28" rx="6" fill="var(--ink,#1f0840)" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1316" y="236" width="28" height="28" rx="6" fill="var(--ink,#1f0840)" stroke="url(#accent)" stroke-width="3"/>
    <rect x="1316" y="156" width="28" height="28" rx="6" fill="var(--ink,#1f0840)" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1480" cy="200" r="18" fill="url(#accent)" opacity="0.95"/>
    <circle cx="1480" cy="200" r="8" fill="#0b0f17"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">THE NEW GTM ROLE</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">GTM Engineer.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Automate <tspan fill="url(#accent)">&#183;</tspan> Integrate <tspan fill="url(#accent)">&#183;</tspan> Compound</text>
</svg>
