<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#fbbf24;--c2:#d97706;--c3:#fde68a;--c4:#fb7185;--c4b:#fecdd3;--ink:#1a1203;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Decorative: dashed line struck through MQL with an arrow pointing forward -->
  <line x1="1040" y1="180" x2="1340" y2="180" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.9"/>
  <line x1="1040" y1="200" x2="1300" y2="200" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M1340,180 L1500,180 M1470,150 L1500,180 L1470,210" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1040" y="148" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#94a3b8">MQL</text>
  <text x="1430" y="148" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="url(#accent)">PQL</text>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">RUN THE NEW PLAYBOOK</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">MQL is dead.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="700" fill="#EDE5D8">Signals drive pipeline <tspan fill="url(#accent)">&#183;</tspan> 2027 is signal-based</text>

</svg>
