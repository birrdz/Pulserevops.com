<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>svg{--c1:#a3e635;--c2:#65a30d;--c3:#d9f99d;--c4:#22d3ee;--c4b:#a5f3fc;--ink:#0d1403;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/><stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c3,#FFD740)"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)"/></linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/></linearGradient>
    <linearGradient id="band4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
    <linearGradient id="band5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c3,#FFD740)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <text x="540" y="150" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#94a3b8">MARKETING</text>
  <text x="540" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="60" font-weight="900" fill="#FFFFFF">The Marketing Funnel</text>
  <polygon points="150,322 930,322 855,521 225,521" fill="url(#band1)"/>
  <text x="540" y="415" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">AWARENESS</text>
  <text x="540" y="455" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Reach the right audience</text>
  <polygon points="225,537 855,537 780,735 300,735" fill="url(#band2)"/>
  <text x="540" y="630" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">INTEREST</text>
  <text x="540" y="670" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Earn attention and clicks</text>
  <polygon points="300,751 780,751 705,950 375,950" fill="url(#band3)"/>
  <text x="540" y="844" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">CONSIDERATION</text>
  <text x="540" y="884" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Nurture toward intent</text>
  <polygon points="375,966 705,966 630,1164 450,1164" fill="url(#band4)"/>
  <text x="540" y="1059" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#FFFFFF">CONVERSION</text>
  <text x="540" y="1099" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" opacity="0.85">Turn interest into pipeline</text>

</svg>