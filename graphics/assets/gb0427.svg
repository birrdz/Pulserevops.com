<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#10b981;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130c;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Decorative: stepped ascending bar chart (coach to the top) -->
  <rect x="1140" y="290" width="48" height="56" rx="4" fill="#334155" opacity="0.7"/>
  <rect x="1200" y="250" width="48" height="96" rx="4" fill="#475569" opacity="0.75"/>
  <rect x="1260" y="200" width="48" height="146" rx="4" fill="#64748b" opacity="0.8"/>
  <rect x="1320" y="150" width="48" height="196" rx="4" fill="#94a3b8" opacity="0.85"/>
  <rect x="1380" y="90" width="48" height="256" rx="4" fill="url(#accent)" opacity="0.98"/>
  <line x1="1120" y1="350" x2="1450" y2="350" stroke="#475569" stroke-width="2" opacity="0.6"/>
  <polyline points="1164,318 1224,278 1284,228 1344,178 1404,118" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" stroke-dasharray="4 6"/>

  <text x="120" y="178" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">SALES LEADERSHIP</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Coach to the top.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Don't manage to the mean</text>

