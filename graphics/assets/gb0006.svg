<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <style>svg{--c1:#fbbf24;--c2:#d97706;--c3:#fde68a;--c4:#fb7185;--c4b:#fecdd3;--ink:#1a1203;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.6" r="0.55">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>

<text x="1810" y="900" text-anchor="end" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="900" font-weight="900" fill="url(#accent)" opacity="0.1">02</text>

<polyline points="154,360 320,360 372,360 404,300 440,432 476,360 596,360 636,360 670,318 706,408 742,360 920,360"
    stroke="url(#accent)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

<text x="156" y="600" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="12" fill="#94a3b8">SECTION 02</text>
  <text x="150" y="720" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="132" font-weight="900" fill="#FFFFFF">Pipeline Review</text>

<rect x="156" y="772" width="220" height="12" rx="6" fill="url(#accent)"/>

</svg>
