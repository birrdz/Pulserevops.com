<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
  <rect width="1584" height="396" fill="var(--bg1, #0b0f17)"/>
  <rect x="24" y="24" width="1536" height="348" rx="18" fill="var(--bg2, #0f172a)" stroke="var(--c2)" stroke-width="2" opacity="0.95"/>

  <text x="792" y="74" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="var(--c3)">Revenue by Channel</text>
  <text x="792" y="104" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="var(--c4b)" opacity="0.85">Source mix of new ARR — trailing four quarters</text>

  <!-- Pie chart group, centered at (396, 230), radius 130 -->
  <!-- Slices computed: Inbound 35% (126deg), Outbound 25% (90), Partner 18% (64.8), Self-serve 14% (50.4), Other 8% (28.8) -->
  <!-- Starting at angle -90 (top), going clockwise -->
  <g transform="translate(396 230)">
    <!-- Inbound: 35% — from -90 to 36 deg -->
    <path d="M 0 -130 A 130 130 0 0 1 105.146 76.477 L 0 0 Z" fill="var(--c1)" stroke="var(--ink)" stroke-width="2"/>
    <!-- Outbound: 25% — from 36 to 126 deg -->
    <path d="M 105.146 76.477 A 130 130 0 0 1 -76.477 105.146 L 0 0 Z" fill="var(--c2)" stroke="var(--ink)" stroke-width="2"/>
    <!-- Partner: 18% — from 126 to 190.8 deg -->
    <path d="M -76.477 105.146 A 130 130 0 0 1 -127.730 -24.385 L 0 0 Z" fill="var(--c4)" stroke="var(--ink)" stroke-width="2"/>
    <!-- Self-serve: 14% — from 190.8 to 241.2 deg -->
    <path d="M -127.730 -24.385 A 130 130 0 0 1 -62.660 -113.969 L 0 0 Z" fill="var(--c4b)" stroke="var(--ink)" stroke-width="2"/>
    <!-- Other: 8% — from 241.2 to 270 deg -->
    <path d="M -62.660 -113.969 A 130 130 0 0 1 0 -130 L 0 0 Z" fill="var(--c3)" stroke="var(--ink)" stroke-width="2"/>

    <!-- Center circle for donut-ish accent -->
    <circle cx="0" cy="0" r="42" fill="var(--bg2, #0f172a)" stroke="var(--c1)" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="var(--c4b)">New ARR</text>
    <text x="0" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--c3)">FY mix</text>

    <!-- Slice percent labels -->
    <text x="65" y="-30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">35%</text>
    <text x="35" y="75" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">25%</text>
    <text x="-78" y="38" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">18%</text>
    <text x="-85" y="-40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--ink)">14%</text>
    <text x="-35" y="-100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--ink)">8%</text>
  </g>

  <!-- Legend on the right side -->
  <g transform="translate(640 150)">
    <text x="0" y="-10" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--c3)">Channel mix</text>

    <!-- Inbound -->
    <rect x="0" y="10" width="28" height="22" rx="4" fill="var(--c1)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="42" y="27" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="var(--c4b)">Inbound</text>
    <text x="240" y="27" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--c1)">35%</text>
    <text x="310" y="27" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)" opacity="0.85">SEO, content, demo requests</text>

    <!-- Outbound -->
    <rect x="0" y="46" width="28" height="22" rx="4" fill="var(--c2)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="42" y="63" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="var(--c4b)">Outbound</text>
    <text x="240" y="63" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--c2)">25%</text>
    <text x="310" y="63" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)" opacity="0.85">SDR sequences, cold call, ABM</text>

    <!-- Partner -->
    <rect x="0" y="82" width="28" height="22" rx="4" fill="var(--c4)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="42" y="99" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="var(--c4b)">Partner</text>
    <text x="240" y="99" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--c4)">18%</text>
    <text x="310" y="99" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)" opacity="0.85">Referrals, channel, co-sell</text>

    <!-- Self-serve -->
    <rect x="0" y="118" width="28" height="22" rx="4" fill="var(--c4b)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="42" y="135" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="var(--c4b)">Self-serve</text>
    <text x="240" y="135" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--c4b)">14%</text>
    <text x="310" y="135" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)" opacity="0.85">PLG signup, free-to-paid</text>

    <!-- Other -->
    <rect x="0" y="154" width="28" height="22" rx="4" fill="var(--c3)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="42" y="171" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="var(--c4b)">Other</text>
    <text x="240" y="171" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--c3)">8%</text>
    <text x="310" y="171" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)" opacity="0.85">Events, community, PR</text>
  </g>

  <!-- Right-side callout block -->
  <g transform="translate(1140 140)">
    <rect x="0" y="0" width="380" height="200" rx="14" fill="var(--bg1, #0b0f17)" stroke="var(--c1)" stroke-width="1.5" opacity="0.92"/>
    <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--c3)">Read the mix</text>

    <circle cx="32" cy="64" r="5" fill="var(--c1)"/>
    <text x="48" y="70" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)">Inbound + Self-serve = 49% of ARR</text>

    <circle cx="32" cy="94" r="5" fill="var(--c2)"/>
    <text x="48" y="100" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)">SDR-sourced outbound holds 25% line</text>

    <circle cx="32" cy="124" r="5" fill="var(--c4)"/>
    <text x="48" y="130" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)">Partner channel up 6pp YoY (18%)</text>

    <circle cx="32" cy="154" r="5" fill="var(--c3)"/>
    <text x="48" y="160" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c4b)">Diversified — no channel above 40%</text>

    <text x="20" y="188" font-family="Inter, system-ui, sans-serif" font-size="13" fill="var(--c4b)" opacity="0.7">Replace shares with your own attribution.</text>
  </g>
</svg>
