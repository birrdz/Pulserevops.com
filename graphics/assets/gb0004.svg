<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#818cf8;--c2:#4f46e5;--c3:#c7d2fe;--c4:#22d3ee;--c4b:#a5f3fc;--ink:#0a0a23;}</style>
  <defs>
