<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#a3e635;--c2:#65a30d;--c3:#d9f99d;--c4:#a3e635;--c4b:#d9f99d;--ink:#172a04;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
