  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Build <tspan fill="url(#accent)">&#183;</tspan> Test <tspan fill="url(#accent)">&#183;</tspan> Mobilize <tspan fill="url(#accent)">&#183;</tspan> Reference</text>
