<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#f87171;--c2:#dc2626;--c3:#fca5a5;--c4:#fbbf24;--c4b:#fde68a;--ink:#1a0606;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/>
      <stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

<polyline points="720,82 900,82 940,82 974,28 1008,146 1044,82 1230,82 1268,82 1304,46 1340,124 1376,82 1520,82"
    stroke="url(#accent)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

<text x="668" y="240" font-family="Georgia,'Times New Roman',serif" font-size="180" font-weight="700" fill="url(#accent)" opacity="0.22">&#8220;</text>

<text x="700" y="248" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="92" font-weight="900" fill="#FFFFFF"><tspan fill="url(#accent)">Pipeline</tspan> cures all.</text>
  <text x="702" y="312" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="600" font-style="italic" fill="#94a3b8">&#8212; the one sales truth that never changes</text>

