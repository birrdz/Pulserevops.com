<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>svg{--c1:#fb7185;--c2:#e11d48;--c3:#fda4af;--c4:#fbbf24;--c4b:#fde68a;--ink:#1f0510;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/><stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c3,#FFD740)"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)"/></linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/></linearGradient>
    <linearGradient id="band4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
    <linearGradient id="band5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c3,#FFD740)"/><stop offset="1" style="stop-color:var(--c2,#E8710A)"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <text x="540" y="150" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#94a3b8">CUSTOMER JOURNEY</text>
  <text x="540" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="60" font-weight="900" fill="#FFFFFF">The Customer Journey</text>
  <polygon points="150,322 930,322 870,478 210,478" fill="url(#band1)"/>
  <text x="540" y="394" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">AWARE</text>
  <text x="540" y="434" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Discovers the problem</text>
  <polygon points="210,494 870,494 810,649 270,649" fill="url(#band2)"/>
  <text x="540" y="565" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">EVALUATE</text>
  <text x="540" y="605" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Compares solutions</text>
  <polygon points="270,665 810,665 750,821 330,821" fill="url(#band3)"/>
  <text x="540" y="737" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">BUY</text>
  <text x="540" y="777" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Commits and signs</text>
  <polygon points="330,837 750,837 690,992 390,992" fill="url(#band4)"/>
  <text x="540" y="909" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#FFFFFF">ADOPT</text>
  <text x="540" y="949" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" opacity="0.85">Gets to value</text>
  <polygon points="390,1008 690,1008 630,1164 450,1164" fill="url(#band5)"/>
  <text x="540" y="1080" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0b0f17">ADVOCATE</text>
  <text x="540" y="1120" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#0b0f17" opacity="0.78">Refers and expands</text>

</svg>