<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>
svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
.bg1{fill:var(--bg1,#0b0f17);}
.bg2{fill:var(--bg2,#0f172a);}
.title{font-family:'Inter',system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--c3);}
.stage{font-family:'Inter',system-ui,sans-serif;font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;}
.sub{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--c3);text-anchor:middle;}
.chan{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:500;fill:var(--c4b);text-anchor:middle;}
.num{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:800;fill:var(--c2);text-anchor:middle;}
.axis{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--c4);}
</style>

<rect class="bg1" width="1584" height="396"/>
<rect class="bg2" x="0" y="0" width="1584" height="60" opacity="0.6"/>

<text class="title" x="40" y="38">B2B Buyer Journey Map</text>
<text class="axis" x="40" y="380">Channels &amp; touchpoints aligned to each stage</text>

<defs>
<linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="var(--c2)" stop-opacity="0.35"/>
<stop offset="100%" stop-color="var(--c4)" stop-opacity="0.45"/>
</linearGradient>
<linearGradient id="aw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c3)"/><stop offset="100%" stop-color="var(--c1)"/></linearGradient>
<linearGradient id="co" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c1)"/><stop offset="100%" stop-color="var(--c2)"/></linearGradient>
<linearGradient id="de" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c2)"/><stop offset="100%" stop-color="var(--c1)"/></linearGradient>
<linearGradient id="on" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c4b)"/><stop offset="100%" stop-color="var(--c4)"/></linearGradient>
<linearGradient id="ad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c4)"/><stop offset="100%" stop-color="var(--c2)"/></linearGradient>
<linearGradient id="av" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c1)"/><stop offset="100%" stop-color="var(--c4)"/></linearGradient>
</defs>

<!-- Track bar -->
<rect x="80" y="170" width="1424" height="14" rx="7" fill="url(#track)"/>
<circle cx="80" cy="177" r="9" fill="var(--c3)"/>
<polygon points="1504,170 1524,177 1504,184" fill="var(--c4)"/>

<!-- Stage 1: Awareness -->
<g transform="translate(140,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#aw)" stroke="var(--c2)" stroke-width="2"/>
<text class="num" x="105" y="68">01</text>
<text class="stage" x="105" y="95">Awareness</text>
<text class="sub" x="105" y="118">Problem recognized</text>
</g>
<text class="chan" x="245" y="240">SEO &middot; Social</text>
<text class="chan" x="245" y="258">Podcasts &middot; PR</text>
<text class="chan" x="245" y="276">Analyst reports</text>

<!-- Stage 2: Consideration -->
<g transform="translate(360,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#co)" stroke="var(--c2)" stroke-width="2"/>
<text class="num" x="105" y="68">02</text>
<text class="stage" x="105" y="95">Consideration</text>
<text class="sub" x="105" y="118">Solutions compared</text>
</g>
<text class="chan" x="465" y="240">Webinars &middot; G2</text>
<text class="chan" x="465" y="258">Case studies</text>
<text class="chan" x="465" y="276">Peer reviews</text>

<!-- Stage 3: Decision -->
<g transform="translate(580,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#de)" stroke="var(--c2)" stroke-width="2"/>
<text class="num" x="105" y="68">03</text>
<text class="stage" x="105" y="95">Decision</text>
<text class="sub" x="105" y="118">Vendor selected</text>
</g>
<text class="chan" x="685" y="240">Demos &middot; POC</text>
<text class="chan" x="685" y="258">Security review</text>
<text class="chan" x="685" y="276">Procurement</text>

<!-- Stage 4: Onboarding -->
<g transform="translate(800,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#on)" stroke="var(--c4)" stroke-width="2"/>
<text class="num" x="105" y="68">04</text>
<text class="stage" x="105" y="95">Onboarding</text>
<text class="sub" x="105" y="118">First value delivered</text>
</g>
<text class="chan" x="905" y="240">Kickoff &middot; CSM</text>
<text class="chan" x="905" y="258">Implementation</text>
<text class="chan" x="905" y="276">Training docs</text>

<!-- Stage 5: Adoption -->
<g transform="translate(1020,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#ad)" stroke="var(--c2)" stroke-width="2"/>
<text class="num" x="105" y="68">05</text>
<text class="stage" x="105" y="95">Adoption</text>
<text class="sub" x="105" y="118">Daily usage scales</text>
</g>
<text class="chan" x="1125" y="240">QBRs &middot; in-app</text>
<text class="chan" x="1125" y="258">Health scores</text>
<text class="chan" x="1125" y="276">Expansion plays</text>

<!-- Stage 6: Advocacy -->
<g transform="translate(1240,80)">
<polygon points="0,40 180,40 210,90 180,140 0,140 30,90" fill="url(#av)" stroke="var(--c2)" stroke-width="2"/>
<text class="num" x="105" y="68">06</text>
<text class="stage" x="105" y="95">Advocacy</text>
<text class="sub" x="105" y="118">Referrals &amp; reviews</text>
</g>
<text class="chan" x="1345" y="240">Referrals &middot; NPS</text>
<text class="chan" x="1345" y="258">Case study co-pub</text>
<text class="chan" x="1345" y="276">Community</text>

<!-- Connector dots on track -->
<circle cx="245" cy="177" r="6" fill="var(--c3)"/>
<circle cx="465" cy="177" r="6" fill="var(--c1)"/>
<circle cx="685" cy="177" r="6" fill="var(--c2)"/>
<circle cx="905" cy="177" r="6" fill="var(--c4)"/>
<circle cx="1125" cy="177" r="6" fill="var(--c4)"/>
<circle cx="1345" cy="177" r="6" fill="var(--c1)"/>

<!-- Bottom rail label -->
<rect x="80" y="310" width="1424" height="2" fill="var(--c2)" opacity="0.4"/>
<text class="axis" x="80" y="335">Pre-sale</text>
<text class="axis" x="780" y="335" text-anchor="middle">Hand-off to CS</text>
<text class="axis" x="1504" y="335" text-anchor="end">Post-sale &amp; growth</text>

</svg>
