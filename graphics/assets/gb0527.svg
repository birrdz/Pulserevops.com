<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg1, #0b0f17)"/>
      <stop offset="1" stop-color="var(--bg2, #0f172a)"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1)" stop-opacity="0.18"/>
      <stop offset="1" stop-color="var(--c2)" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="finalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="var(--c4)" stop-opacity="0.45"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--c3)"/>
    </marker>
  </defs>

  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <text x="48" y="58" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="var(--c3)">Deal Inspection Flow</text>
  <text x="48" y="86" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)" opacity="0.75">Manager weekly review sequence</text>

  <!-- Step 1: MEDDPICC review -->
  <g>
    <rect x="60" y="140" width="320" height="200" rx="18" fill="url(#cardGrad)" stroke="var(--c1)" stroke-width="2"/>
    <circle cx="100" cy="180" r="22" fill="var(--c2)" stroke="var(--c1)" stroke-width="2"/>
    <text x="100" y="187" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">1</text>
    <text x="140" y="187" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--c3)">MEDDPICC Review</text>
    <line x1="80" y1="208" x2="360" y2="208" stroke="var(--c1)" stroke-width="1" opacity="0.45"/>
    <text x="80" y="236" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Metrics &amp; Economic Buyer</text>
    <text x="80" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Decision criteria + process</text>
    <text x="80" y="288" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Pain, Paper, Competition</text>
    <rect x="80" y="304" width="160" height="24" rx="6" fill="var(--c2)" opacity="0.55"/>
    <text x="160" y="322" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">SCORE 0–10</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="386" y1="240" x2="424" y2="240" stroke="var(--c3)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Champion test -->
  <g>
    <rect x="430" y="140" width="320" height="200" rx="18" fill="url(#cardGrad)" stroke="var(--c1)" stroke-width="2"/>
    <circle cx="470" cy="180" r="22" fill="var(--c2)" stroke="var(--c1)" stroke-width="2"/>
    <text x="470" y="187" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">2</text>
    <text x="510" y="187" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--c3)">Champion Test</text>
    <line x1="450" y1="208" x2="730" y2="208" stroke="var(--c1)" stroke-width="1" opacity="0.45"/>
    <text x="450" y="236" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Sells when you’re not there?</text>
    <text x="450" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Shares internal politics?</text>
    <text x="450" y="288" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Personal win identified?</text>
    <g transform="translate(450,304)">
      <circle cx="12" cy="12" r="11" fill="var(--c1)" opacity="0.85"/>
      <text x="12" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Y</text>
      <circle cx="42" cy="12" r="11" fill="var(--c1)" opacity="0.55"/>
      <text x="42" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Y</text>
      <circle cx="72" cy="12" r="11" fill="var(--c4)" opacity="0.85"/>
      <text x="72" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">?</text>
      <text x="96" y="17" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="var(--c3)">3-question audit</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="756" y1="240" x2="794" y2="240" stroke="var(--c3)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Procurement check -->
  <g>
    <rect x="800" y="140" width="320" height="200" rx="18" fill="url(#cardGrad)" stroke="var(--c1)" stroke-width="2"/>
    <circle cx="840" cy="180" r="22" fill="var(--c2)" stroke="var(--c1)" stroke-width="2"/>
    <text x="840" y="187" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">3</text>
    <text x="880" y="187" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--c3)">Procurement Check</text>
    <line x1="820" y1="208" x2="1100" y2="208" stroke="var(--c1)" stroke-width="1" opacity="0.45"/>
    <text x="820" y="236" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Vendor onboarding started?</text>
    <text x="820" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">Legal + Security in flight?</text>
    <text x="820" y="288" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c3)">PO path confirmed?</text>
    <g transform="translate(820,304)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="var(--c1)" opacity="0.55"/>
      <text x="30" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">LEGAL</text>
      <rect x="68" y="0" width="60" height="24" rx="4" fill="var(--c1)" opacity="0.55"/>
      <text x="98" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">SEC</text>
      <rect x="136" y="0" width="60" height="24" rx="4" fill="var(--c4)" opacity="0.75"/>
      <text x="166" y="17" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">PO</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <line x1="1126" y1="240" x2="1164" y2="240" stroke="var(--c3)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Forecast category set -->
  <g>
    <rect x="1170" y="140" width="356" height="200" rx="18" fill="url(#finalGrad)" stroke="var(--c4)" stroke-width="2.5"/>
    <circle cx="1210" cy="180" r="22" fill="var(--c4)" stroke="var(--c4b)" stroke-width="2"/>
    <text x="1210" y="187" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">4</text>
    <text x="1250" y="187" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--c4b)">Forecast Category Set</text>
    <line x1="1190" y1="208" x2="1506" y2="208" stroke="var(--c4)" stroke-width="1" opacity="0.55"/>
    <g transform="translate(1190,224)">
      <rect x="0" y="0" width="76" height="34" rx="6" fill="var(--c1)" opacity="0.7"/>
      <text x="38" y="22" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">COMMIT</text>
      <rect x="84" y="0" width="76" height="34" rx="6" fill="var(--c1)" opacity="0.45"/>
      <text x="122" y="22" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">BEST</text>
      <rect x="168" y="0" width="76" height="34" rx="6" fill="var(--c4)" opacity="0.75"/>
      <text x="206" y="22" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">PIPE</text>
      <rect x="252" y="0" width="76" height="34" rx="6" fill="var(--ink)" opacity="0.55" stroke="var(--c4b)" stroke-width="1"/>
      <text x="290" y="22" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--c4b)">OMIT</text>
    </g>
    <text x="1190" y="288" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c4b)">Manager owns the call</text>
    <text x="1190" y="314" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" fill="var(--c4b)">Locked into CRM weekly</text>
  </g>

  <!-- Footer rail -->
  <g opacity="0.7">
    <line x1="60" y1="370" x2="1524" y2="370" stroke="var(--c1)" stroke-width="1" opacity="0.35"/>
    <text x="60" y="388" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="var(--c3)" opacity="0.7">Inspect → Qualify → De-risk → Forecast</text>
  </g>
</svg>
