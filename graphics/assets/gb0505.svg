<rect x="0" y="0" width="406" height="84" rx="10" fill="url(#s1)"/>
<text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">Prospect</text>
<text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="var(--ink)">412</text>
<text x="386" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" text-anchor="end" opacity="0.7">32%</text>
