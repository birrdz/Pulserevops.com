<g transform="translate(60,340)" stroke="var(--c3)" stroke-opacity="0.25" stroke-width="1">
<line x1="0" y1="0" x2="1464" y2="0"/>
</g>
<text x="60" y="372" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c3)" opacity="0.6">Source: Pipeline snapshot - widths proportional to deal count</text>
<text x="1524" y="372" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--c3)" opacity="0.6" text-anchor="end">Stage 1 of 6 -&gt; Stage 6 of 6</text>
</svg>
