<text x="180" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" text-anchor="end" opacity="0.7">14%</text>
</g>

<g transform="translate(1178,0)">
<rect x="0" y="0" width="160" height="84" rx="10" fill="url(#s5)"/>
<text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">Negotiate</text>
<text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="var(--ink)">87</text>
<text x="140" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" text-anchor="end" opacity="0.7">7%</text>
</g>

<g transform="translate(1342,0)">
<rect x="0" y="0" width="122" height="84" rx="10" fill="url(#s6)"/>
<text x="14" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">Close</text>
<text x="14" y="62" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="var(--ink)">42</text>
<text x="108" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" text-anchor="end" opacity="0.7">3%</text>
</g>
