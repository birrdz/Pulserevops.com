<g transform="translate(60,250)" font-family="Inter, system-ui, sans-serif" font-size="18" fill="var(--c3)" opacity="0.85">
<g>
<circle cx="8" cy="-4" r="8" fill="var(--c1)"/>
<text x="26" y="2" font-weight="600">Open pipeline</text>
<text x="26" y="26" opacity="0.7">$18.4M weighted</text>
