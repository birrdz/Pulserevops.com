<g transform="translate(280,0)">
<circle cx="8" cy="-4" r="8" fill="var(--c4)"/>
<text x="26" y="2" font-weight="600">Late stage</text>
<text x="26" y="26" opacity="0.7">$6.2M committed</text>
</g>
<g transform="translate(540,0)">
<circle cx="8" cy="-4" r="8" fill="var(--c4b)"/>
<text x="26" y="2" font-weight="600">Closing this quarter</text>
<text x="26" y="26" opacity="0.7">42 deals - $2.8M</text>
</g>
<g transform="translate(880,0)">
<text y="2" font-weight="600">Conversion top-to-bottom</text>
<text y="26" font-weight="800" fill="var(--c1)" font-size="22">10.2%</text>
</g>
<g transform="translate(1180,0)">
<text y="2" font-weight="600">Avg cycle time</text>
<text y="26" font-weight="800" fill="var(--c1)" font-size="22">68 days</text>
</g>
