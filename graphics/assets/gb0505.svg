<rect width="1584" height="396" fill="url(#bgGrad)"/>

<text x="60" y="58" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="var(--c3)">Deal Stage Progression</text>
<text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="18" fill="var(--c3)" opacity="0.75">Pipeline distribution across 6 stages</text>

