<text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="var(--ink)">321</text>
<text x="296" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" text-anchor="end" opacity="0.7">25%</text>
</g>

<g transform="translate(730,0)">
<rect x="0" y="0" width="240" height="84" rx="10" fill="url(#s3)"/>
