<text x="1524" y="88" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="var(--c1)" text-anchor="end">1,284</text>

<g transform="translate(60,140)">
<rect x="0" y="0" width="1464" height="84" rx="10" fill="var(--ink)" opacity="0.35"/>

