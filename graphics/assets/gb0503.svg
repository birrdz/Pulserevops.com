<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;} .lbl{font-family:'Inter',system-ui,sans-serif;font-weight:700;fill:var(--ink);} .sub{font-family:'Inter',system-ui,sans-serif;font-weight:500;fill:var(--ink);opacity:.78;} .ttl{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--c3);letter-spacing:.5px;} .cnt{font-family:'Inter',system-ui,sans-serif;font-weight:800;fill:var(--c4);} .stp{font-family:'Inter',system-ui,sans-serif;font-weight:700;fill:var(--c1);letter-spacing:2px;font-size:14px;}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="var(--bg1, #0b0f17)"/>
<stop offset="1" stop-color="var(--bg2, #0f172a)"/>
</linearGradient>
<linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c3)"/>
<stop offset="1" stop-color="var(--c1)"/>
</linearGradient>
<linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c1)"/>
<stop offset="1" stop-color="var(--c2)"/>
</linearGradient>
<linearGradient id="t3" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c4b)"/>
<stop offset="1" stop-color="var(--c4)"/>
</linearGradient>
<linearGradient id="t4" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--c4)"/>
<stop offset="1" stop-color="var(--c2)"/>
</linearGradient>
</defs>
<rect width="1584" height="396" fill="url(#bg)"/>
<g opacity=".06" stroke="var(--c1)" stroke-width="1">
<line x1="0" y1="80" x2="1584" y2="80"/>
<line x1="0" y1="160" x2="1584" y2="160"/>
<line x1="0" y1="240" x2="1584" y2="240"/>
<line x1="0" y1="320" x2="1584" y2="320"/>
</g>
<text x="60" y="58" class="ttl" font-size="22">ABM INVERTED FUNNEL</text>
<text x="60" y="84" class="sub" font-size="16">Account-Based Marketing — Few, focused, high-fit accounts</text>
<g transform="translate(180,120)">
<polygon points="0,0 720,0 600,240 120,240" fill="url(#t1)" stroke="var(--c2)" stroke-width="2"/>
<text x="360" y="50" text-anchor="middle" class="stp">STAGE 1</text>
<text x="360" y="105" text-anchor="middle" class="lbl" font-size="42">TARGET ACCOUNTS</text>
<text x="360" y="145" text-anchor="middle" class="sub" font-size="20">ICP-fit named-account list • ZoomInfo + Clay + 6sense intent</text>
<text x="360" y="195" text-anchor="middle" class="cnt" font-size="44">500</text>
<text x="360" y="222" text-anchor="middle" class="sub" font-size="18">accounts in tier 1</text>
</g>
<g transform="translate(180,120)">
<polygon points="120,240 600,240 510,420 210,420" fill="url(#t2)" stroke="var(--c2)" stroke-width="2"/>
<text x="360" y="280" text-anchor="middle" class="stp" fill="var(--c3)">STAGE 2</text>
<text x="360" y="320" text-anchor="middle" class="lbl" font-size="32" fill="var(--ink)">ENGAGED CONTACTS</text>
<text x="360" y="350" text-anchor="middle" class="sub" font-size="17" fill="var(--ink)">Multi-thread • LinkedIn + email + ads + direct mail</text>
<text x="360" y="395" text-anchor="middle" class="cnt" font-size="34" fill="var(--ink)">220</text>
</g>
<g transform="translate(180,120)">
<polygon points="210,420 510,420 450,540 270,540" fill="url(#t3)" stroke="var(--c4)" stroke-width="2"/>
<text x="360" y="455" text-anchor="middle" class="stp" fill="var(--c2)">STAGE 3</text>
<text x="360" y="485" text-anchor="middle" class="lbl" font-size="24">OPPORTUNITIES</text>
<text x="360" y="515" text-anchor="middle" class="sub" font-size="15">SQL → stage 2+ pipeline created</text>
<text x="360" y="540" text-anchor="middle" class="cnt" font-size="26" fill="var(--ink)">68</text>
</g>
<g transform="translate(900,120)" opacity=".95">
<text x="0" y="0" class="ttl" font-size="18">FLIP THE SCRIPT</text>
<text x="0" y="34" class="lbl" font-size="22" fill="var(--c3)">Start narrow. Land wide.</text>
<g transform="translate(0,60)" font-family="Inter,system-ui,sans-serif" font-size="17" fill="var(--c3)">
<g transform="translate(0,0)">
<circle cx="10" cy="-5" r="6" fill="var(--c1)"/>
<text x="28" y="0" font-weight="700">1:1 ABM</text>
<text x="120" y="0" opacity=".75">Top 25 dream logos — bespoke plays, exec sponsor</text>
</g>
<g transform="translate(0,36)">
<circle cx="10" cy="-5" r="6" fill="var(--c4)"/>
<text x="28" y="0" font-weight="700">1:Few</text>
<text x="120" y="0" opacity=".75">25–75 accounts clustered by industry &amp; pain</text>
</g>
<g transform="translate(0,72)">
<circle cx="10" cy="-5" r="6" fill="var(--c4b)"/>
<text x="28" y="0" font-weight="700">1:Many</text>
<text x="120" y="0" opacity=".75">Programmatic intent + Demandbase orchestration</text>
</g>
<g transform="translate(0,108)">
<circle cx="10" cy="-5" r="6" fill="var(--c2)"/>
<text x="28" y="0" font-weight="700">Outcome</text>
<text x="120" y="0" opacity=".75">208% pipeline lift vs. spray-and-pray (ITSMA 2027)</text>
</g>
</g>
</g>
<g transform="translate(1320,140)">
<circle cx="80" cy="80" r="78" fill="none" stroke="var(--c2)" stroke-width="2" opacity=".5"/>
<circle cx="80" cy="80" r="58" fill="none" stroke="var(--c1)" stroke-width="2" opacity=".7"/>
<circle cx="80" cy="80" r="36" fill="url(#t4)" stroke="var(--c4)" stroke-width="2"/>
<text x="80" y="74" text-anchor="middle" class="stp" fill="var(--ink)" font-size="11">STAGE 4</text>
<text x="80" y="92" text-anchor="middle" class="lbl" font-size="22">WINS</text>
<text x="80" y="180" text-anchor="middle" class="cnt" font-size="28">21</text>
<text x="80" y="204" text-anchor="middle" class="sub" font-size="14" fill="var(--c3)">closed-won accounts</text>
<text x="80" y="226" text-anchor="middle" class="sub" font-size="13" fill="var(--c3)" opacity=".75">4.2% account → win rate</text>
</g>
<g stroke="var(--c1)" stroke-width="2" fill="none" opacity=".7">
<path d="M900,235 L1310,215" stroke-dasharray="6,4"/>
<polygon points="1310,215 1300,210 1300,221" fill="var(--c1)"/>
</g>
<text x="60" y="370" class="sub" font-size="13" opacity=".65">Conversion math: 500 → 220 (44%) → 68 (31%) → 21 (31%) • Tier-1 ACV $185K • Pipeline gen $12.6M</text>
</svg>
