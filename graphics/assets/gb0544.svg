<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
<style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}
.t{font-family:-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--ink);}
.title{font-size:26px;font-weight:700;fill:var(--c3);}
.label{font-size:20px;font-weight:600;}
.sub{font-size:16px;font-weight:500;opacity:0.85;}
.yn{font-size:14px;font-weight:700;fill:var(--c4b);}
.stage{font-size:13px;font-weight:700;fill:var(--c1);letter-spacing:2px;}
</style>
<rect width="1584" height="396" fill="var(--bg1,#0b0f17)"/>
<rect width="1584" height="396" fill="url(#bgGrad)" opacity="0.6"/>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--bg1,#0b0f17)"/>
    <stop offset="1" stop-color="var(--bg2,#0f172a)"/>
  </linearGradient>
  <linearGradient id="boxFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--c1)" stop-opacity="0.18"/>
    <stop offset="1" stop-color="var(--c2)" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="approveFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--c1)" stop-opacity="0.55"/>
    <stop offset="1" stop-color="var(--c2)" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="rejectFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--c4)" stop-opacity="0.35"/>
    <stop offset="1" stop-color="var(--c4)" stop-opacity="0.55"/>
  </linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--c3)"/>
  </marker>
  <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--c4)"/>
  </marker>
</defs>

<text x="40" y="44" class="t title">Hire Decision Framework — Adding the Next AE</text>
<text x="40" y="68" class="t sub">Walk every requisition through four gates. Skip one, you bleed cash or stall ramp.</text>

<!-- Stage labels -->
<text x="148" y="118" text-anchor="middle" class="t stage">GATE 1</text>
<text x="438" y="118" text-anchor="middle" class="t stage">GATE 2</text>
<text x="728" y="118" text-anchor="middle" class="t stage">GATE 3</text>
<text x="1018" y="118" text-anchor="middle" class="t stage">GATE 4</text>
<text x="1352" y="118" text-anchor="middle" class="t stage">OUTCOME</text>

<!-- Gate 1: Capacity gap (diamond) -->
<polygon points="148,140 268,220 148,300 28,220" fill="url(#boxFill)" stroke="var(--c1)" stroke-width="2.5"/>
<text x="148" y="200" text-anchor="middle" class="t label">Capacity</text>
<text x="148" y="226" text-anchor="middle" class="t label">Gap?</text>
<text x="148" y="252" text-anchor="middle" class="t sub">&gt;85% quota cov.</text>
<text x="148" y="272" text-anchor="middle" class="t sub">forecast next Q</text>

<!-- Gate 2: Ramp budget -->
<polygon points="438,140 558,220 438,300 318,220" fill="url(#boxFill)" stroke="var(--c1)" stroke-width="2.5"/>
<text x="438" y="200" text-anchor="middle" class="t label">Ramp</text>
<text x="438" y="226" text-anchor="middle" class="t label">Budget?</text>
<text x="438" y="252" text-anchor="middle" class="t sub">6mo salary+OTE</text>
<text x="438" y="272" text-anchor="middle" class="t sub">in CAC payback</text>

<!-- Gate 3: Manager bandwidth -->
<polygon points="728,140 848,220 728,300 608,220" fill="url(#boxFill)" stroke="var(--c1)" stroke-width="2.5"/>
<text x="728" y="200" text-anchor="middle" class="t label">Manager</text>
<text x="728" y="226" text-anchor="middle" class="t label">Bandwidth?</text>
<text x="728" y="252" text-anchor="middle" class="t sub">&lt;7 direct reps,</text>
<text x="728" y="272" text-anchor="middle" class="t sub">1:1s on cal.</text>

<!-- Gate 4: Pipeline -->
<polygon points="1018,140 1138,220 1018,300 898,220" fill="url(#boxFill)" stroke="var(--c1)" stroke-width="2.5"/>
<text x="1018" y="200" text-anchor="middle" class="t label">Territory +</text>
<text x="1018" y="226" text-anchor="middle" class="t label">Pipeline?</text>
<text x="1018" y="252" text-anchor="middle" class="t sub">Named accts,</text>
<text x="1018" y="272" text-anchor="middle" class="t sub">3x quota in TAM</text>

<!-- APPROVE outcome -->
<rect x="1208" y="148" width="288" height="86" rx="14" fill="url(#approveFill)" stroke="var(--c1)" stroke-width="3"/>
<text x="1352" y="184" text-anchor="middle" class="t label" fill="var(--ink)">APPROVE REQ</text>
<text x="1352" y="210" text-anchor="middle" class="t sub" fill="var(--ink)">Post job, kick recruiter</text>
<text x="1352" y="226" text-anchor="middle" class="t sub" fill="var(--ink)">SLA 45 days to start</text>

<!-- HOLD outcome -->
<rect x="1208" y="252" width="288" height="86" rx="14" fill="url(#rejectFill)" stroke="var(--c4)" stroke-width="3"/>
<text x="1352" y="288" text-anchor="middle" class="t label">HOLD / REWORK</text>
<text x="1352" y="312" text-anchor="middle" class="t sub">Fix gap, revisit at</text>
<text x="1352" y="328" text-anchor="middle" class="t sub">next monthly review</text>

<!-- YES arrows (gates to next gate) -->
<line x1="268" y1="220" x2="318" y2="220" stroke="var(--c3)" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="293" y="210" text-anchor="middle" class="t yn">YES</text>

<line x1="558" y1="220" x2="608" y2="220" stroke="var(--c3)" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="583" y="210" text-anchor="middle" class="t yn">YES</text>

<line x1="848" y1="220" x2="898" y2="220" stroke="var(--c3)" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="873" y="210" text-anchor="middle" class="t yn">YES</text>

<line x1="1138" y1="200" x2="1208" y2="190" stroke="var(--c3)" stroke-width="3" marker-end="url(#arr)"/>
<text x="1170" y="180" text-anchor="middle" class="t yn">YES</text>

<!-- NO arrows down to HOLD lane -->
<path d="M 148,300 L 148,355 L 1208,355 L 1208,310" fill="none" stroke="var(--c4)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrY)"/>
<path d="M 438,300 L 438,345" fill="none" stroke="var(--c4)" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 728,300 L 728,345" fill="none" stroke="var(--c4)" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 1018,300 L 1018,345" fill="none" stroke="var(--c4)" stroke-width="2" stroke-dasharray="6 4"/>

<text x="125" y="324" class="t yn" fill="var(--c4)">NO</text>
<text x="415" y="324" class="t yn" fill="var(--c4)">NO</text>
<text x="705" y="324" class="t yn" fill="var(--c4)">NO</text>
<text x="995" y="324" class="t yn" fill="var(--c4)">NO</text>

</svg>
