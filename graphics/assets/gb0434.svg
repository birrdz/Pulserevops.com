<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#fbbf24;--c2:#d97706;--c3:#fde68a;--c4:#fbbf24;--c4b:#fde68a;--ink:#1f0510;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#fbbf24)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#d97706)"/>
      <stop offset="1" style="stop-color:var(--c3,#fde68a)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#fbbf24)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#fbbf24)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Three-stage funnel outline on the right -->
  <g stroke="url(#accent)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Stage 1: widest -->
    <polygon points="980,100 1500,100 1430,160 1050,160"/>
    <!-- Stage 2: middle -->
    <polygon points="1060,180 1420,180 1360,240 1120,240"/>
    <!-- Stage 3: narrowest -->
    <polygon points="1130,260 1350,260 1290,320 1190,320"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">MID-MARKET</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Account Executive.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="30" font-weight="700" fill="#EDE5D8">Prospect <tspan fill="url(#accent)">&#183;</tspan> Qualify <tspan fill="url(#accent)">&#183;</tspan> Close</text>
</svg>
