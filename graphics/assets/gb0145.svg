  <text x="540" y="280" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="240" font-weight="900" fill="url(#accent)" opacity="0.9">&#8220;</text>
  <text x="540" y="525" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-1">A confused buyer</text>
  <text x="540" y="632" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="92" font-weight="800" fill="url(#accent)" letter-spacing="-1">never buys.</text>
