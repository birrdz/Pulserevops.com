  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Forecast First, Pipeline Second.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Commit <tspan fill="url(#accent)">&#183;</tspan> Best Case <tspan fill="url(#accent)">&#183;</tspan> Pipeline <tspan fill="url(#accent)">&#183;</tspan> Coverage</text>
