<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#047857;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#062019;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/>
      <stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#34d399)"/>
      <stop offset="0.55" style="stop-color:var(--c2,#047857)"/>
      <stop offset="1" style="stop-color:var(--c3,#a7f3d0)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" style="stop-color:var(--c1,#34d399)" stop-opacity="0.18"/>
      <stop offset="1" style="stop-color:var(--c1,#34d399)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1584" height="396" fill="url(#bg)"/>
  <rect x="0" y="0" width="1584" height="396" fill="url(#glow)"/>

  <!-- Circuit / node topology (right side) -->
  <g opacity="0.95">
    <!-- connecting traces (drawn first so nodes sit on top) -->
    <path d="M 940,120 L 1020,120 L 1040,140 L 1120,140" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 1120,140 L 1200,140 L 1220,160 L 1300,160" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 1300,160 L 1400,160 L 1420,180 L 1480,180" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <path d="M 940,260 L 1010,260 L 1030,240 L 1120,240" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 1120,240 L 1200,240 L 1220,220 L 1300,220" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 1300,220 L 1400,220 L 1420,200 L 1480,200" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- vertical bridges -->
    <line x1="1120" y1="140" x2="1120" y2="240" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
    <line x1="1300" y1="160" x2="1300" y2="220" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

    <!-- center spine node cluster -->
    <path d="M 1200,300 L 1200,260 L 1240,260" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 1340,90 L 1340,140 L 1380,140" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- nodes -->
    <circle cx="940" cy="120" r="7" fill="url(#accent)"/>
    <circle cx="940" cy="260" r="7" fill="url(#accent)"/>
    <circle cx="1120" cy="140" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1120" cy="140" r="3" fill="url(#accent)"/>
    <circle cx="1120" cy="240" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1120" cy="240" r="3" fill="url(#accent)"/>
    <circle cx="1300" cy="160" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1300" cy="160" r="3" fill="url(#accent)"/>
    <circle cx="1300" cy="220" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1300" cy="220" r="3" fill="url(#accent)"/>
    <circle cx="1480" cy="180" r="11" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1480" cy="180" r="4" fill="url(#accent)"/>
    <circle cx="1480" cy="200" r="11" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1480" cy="200" r="4" fill="url(#accent)"/>

    <!-- corner chip squares -->
    <rect x="1192" y="292" width="16" height="16" rx="2" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="1332" y="82" width="16" height="16" rx="2" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="1240" y="252" width="16" height="16" rx="2" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="1380" y="132" width="16" height="16" rx="2" fill="none" stroke="url(#accent)" stroke-width="2"/>
  </g>

  <text x="120" y="180" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94a3b8">TECHNICAL SALES</text>
  <text x="118" y="262" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">Sales Engineer.</text>
  <text x="120" y="316" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="28" font-weight="700" fill="#EDE5D8">Architect <tspan fill="url(#accent)">&#183;</tspan> Validate <tspan fill="url(#accent)">&#183;</tspan> Win</text>
</svg>
