<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <style>svg{--c1:#34d399;--c2:#059669;--c3:#a7f3d0;--c4:#fbbf24;--c4b:#fde68a;--ink:#03130d;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--bg1, #0b0f17)"/>
      <stop offset="100%" stop-color="var(--bg2, #0f172a)"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c3)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="var(--c1)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c1)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="var(--c2)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c4b)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="var(--c4)" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c4)" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="var(--c2)" stop-opacity="0.98"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c4)"/>
    </marker>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Title -->
  <text x="792" y="50" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="var(--c3)" letter-spacing="2">SALES FUNNEL — 4 STAGES</text>
  <line x1="660" y1="66" x2="924" y2="66" stroke="var(--c1)" stroke-width="2" opacity="0.6"/>

  <!-- Stage 1: Lead (widest) -->
  <polygon points="80,110 380,110 350,290 110,290" fill="url(#s1)" stroke="var(--c1)" stroke-width="2"/>
  <text x="230" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="var(--ink)">LEAD</text>
  <text x="230" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" opacity="0.85">Top of Funnel</text>
  <text x="230" y="255" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="var(--ink)">100%</text>
  <text x="230" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">10,000 contacts</text>

  <!-- Arrow 1 -->
  <line x1="395" y1="200" x2="445" y2="200" stroke="var(--c4)" stroke-width="4" marker-end="url(#arr)"/>
  <text x="420" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--c4)">25%</text>

  <!-- Stage 2: Qualified -->
  <polygon points="460,140 720,140 695,290 485,290" fill="url(#s2)" stroke="var(--c1)" stroke-width="2"/>
  <text x="590" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="var(--ink)">QUALIFIED</text>
  <text x="590" y="225" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" opacity="0.85">SQL / MQL</text>
  <text x="590" y="265" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="var(--ink)">25%</text>
  <text x="590" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">2,500 contacts</text>

  <!-- Arrow 2 -->
  <line x1="735" y1="215" x2="785" y2="215" stroke="var(--c4)" stroke-width="4" marker-end="url(#arr)"/>
  <text x="760" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--c4)">40%</text>

  <!-- Stage 3: Proposal -->
  <polygon points="800,170 1010,170 990,290 820,290" fill="url(#s3)" stroke="var(--c4)" stroke-width="2"/>
  <text x="905" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="var(--ink)">PROPOSAL</text>
  <text x="905" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--ink)" opacity="0.85">Quote Sent</text>
  <text x="905" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="var(--ink)">10%</text>
  <text x="905" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">1,000 contacts</text>

  <!-- Arrow 3 -->
  <line x1="1025" y1="230" x2="1075" y2="230" stroke="var(--c4)" stroke-width="4" marker-end="url(#arr)"/>
  <text x="1050" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--c4)">30%</text>

  <!-- Stage 4: Closed Won (narrowest) -->
  <polygon points="1090,200 1260,200 1245,290 1105,290" fill="url(#s4)" stroke="var(--c4)" stroke-width="2"/>
  <text x="1175" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="var(--ink)">CLOSED WON</text>
  <text x="1175" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="var(--ink)">3%</text>
  <text x="1175" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">300 customers</text>

  <!-- Right-side conversion summary -->
  <rect x="1300" y="120" width="240" height="170" rx="12" fill="var(--ink)" opacity="0.35" stroke="var(--c1)" stroke-width="1.5"/>
  <text x="1420" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--c3)" letter-spacing="1">END-TO-END</text>
  <text x="1420" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="var(--c4)">3%</text>
  <text x="1420" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">Lead → Closed</text>
  <text x="1420" y="270" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="var(--c1)">300 / 10,000</text>

  <!-- Footer stage rail -->
  <line x1="80" y1="350" x2="1540" y2="350" stroke="var(--c1)" stroke-width="1" opacity="0.4" stroke-dasharray="4 6"/>
  <text x="230" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">Awareness</text>
  <text x="590" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">Interest</text>
  <text x="905" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">Decision</text>
  <text x="1175" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="var(--c3)">Action</text>
</svg>
