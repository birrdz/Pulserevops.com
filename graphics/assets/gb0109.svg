<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>svg{--c1:#FFD740;--c2:#b8860b;--c3:#fff3c4;--c4:#e8710a;--c4b:#ffb066;--ink:#1a1403;}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--bg1,#0b0f17)"/><stop offset="1" style="stop-color:var(--bg2,#0f172a)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)"/><stop offset="0.55" style="stop-color:var(--c2,#E8710A)"/><stop offset="1" style="stop-color:var(--c3,#FFD740)"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--c4,#22d3ee)"/><stop offset="1" style="stop-color:var(--c4b,#67e8f9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.6">
      <stop offset="0" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0.16"/><stop offset="1" style="stop-color:var(--c1,#FF8C1A)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <text x="540" y="150" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#94a3b8">FORECASTING</text>
  <text x="540" y="226" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">4 Forecast Categories</text>
  <g>
    <rect x="76" y="300" width="928" height="209" rx="20" fill="#111a2b" stroke="#1f2a3d" stroke-width="2"/>
    <circle cx="178" cy="405" r="52" fill="url(#accent)"/>
    <text x="178" y="423" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">1</text>
    <text x="268" y="397" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Commit</text>
    <text x="268" y="434" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Will close — bet on it</text>
  </g>
  <g>
    <rect x="76" y="525" width="928" height="209" rx="20" fill="#111a2b" stroke="#1f2a3d" stroke-width="2"/>
    <circle cx="178" cy="630" r="52" fill="url(#accent)"/>
    <text x="178" y="648" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">2</text>
    <text x="268" y="622" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Best Case</text>
    <text x="268" y="659" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Upside if things go right</text>
  </g>
  <g>
    <rect x="76" y="750" width="928" height="209" rx="20" fill="#111a2b" stroke="#1f2a3d" stroke-width="2"/>
    <circle cx="178" cy="855" r="52" fill="url(#accent)"/>
    <text x="178" y="873" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">3</text>
    <text x="268" y="847" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Pipeline</text>
    <text x="268" y="884" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Active but unqualified to commit</text>
  </g>
  <g>
    <rect x="76" y="975" width="928" height="209" rx="20" fill="#111a2b" stroke="#1f2a3d" stroke-width="2"/>
    <circle cx="178" cy="1080" r="52" fill="url(#accent)"/>
    <text x="178" y="1098" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="52" font-weight="900" fill="#0b0f17">4</text>
    <text x="268" y="1072" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Omitted</text>
    <text x="268" y="1109" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8">Not this period</text>
  </g>

</svg>