  <script>
    (function(){
      const preview = document.getElementById('lc-char-preview');
      const previewImg = document.getElementById('lc-char-preview-img');
      let hoverHideTimer = null;
      let selectedSrc = null;
      const BACKDROP_OPACITY = '0.18';
      const HOVER_OPACITY    = '0.4';
      function setPreviewSrc(src) {
        if (!previewImg || !src) return;
        if (previewImg.src !== src) {
          previewImg.src = src;
          previewImg.style.transform = 'scale(0.96)';
          requestAnimationFrame(() => { previewImg.style.transform = 'scale(1)'; });
        }
      }
      function showPreview(src) {
        if (!preview || !previewImg || !src) return;
        if (hoverHideTimer) { clearTimeout(hoverHideTimer); hoverHideTimer = null; }
        setPreviewSrc(src);
        preview.style.opacity = HOVER_OPACITY;
      }
      function hidePreview() {
        if (!preview) return;
        hoverHideTimer = setTimeout(() => {
          if (selectedSrc) { setPreviewSrc(selectedSrc); preview.style.opacity = BACKDROP_OPACITY; }
          else { preview.style.opacity = '0'; }
        }, 120);
      }
      function setBackdrop(src) {
        selectedSrc = src;
        if (!preview || !previewImg || !src) return;
        setPreviewSrc(src);
        preview.style.opacity = BACKDROP_OPACITY;
      }
      let prevActive = document.querySelector('.lc-char.active');
      window.lcSelectCharacter = function(btn) {
        if (btn === prevActive) {
          const img = btn.querySelector('img');
          if (img && img.src) setBackdrop(img.src);
          return;
        }
        if (prevActive) {
          prevActive.classList.remove('active');
          const pav = prevActive.querySelector('.lc-char-avatar');
          if (pav) { pav.style.borderColor = 'rgba(255,255,255,0.18)'; pav.style.boxShadow = ''; }
        }
        btn.classList.add('active');
        const av = btn.querySelector('.lc-char-avatar');
        if (av) { av.style.borderColor = '#FF8C1A'; av.style.boxShadow = '0 0 0 3px rgba(232,113,10,0.18),0 4px 14px rgba(232,113,10,0.3)'; }
        prevActive = btn;
        try { localStorage.setItem('pulse_character', btn.dataset.char); } catch(e) {}
        const img = btn.querySelector('img');
        if (img && img.src) {
          if (hoverHideTimer) { clearTimeout(hoverHideTimer); hoverHideTimer = null; }
          setBackdrop(img.src);
        }
      };
      document.querySelectorAll('.lc-char').forEach(btn => {
        const img = btn.querySelector('img');
        if (!img) return;
        btn.addEventListener('mouseenter', () => showPreview(img.src));
        btn.addEventListener('mouseleave', hidePreview);
        btn.addEventListener('focus', () => showPreview(img.src));
        btn.addEventListener('blur', hidePreview);
      });
      try {
        const saved = localStorage.getItem('pulse_character');
        const btn = saved
          ? document.querySelector('.lc-char[data-char="' + saved + '"]')
          : document.querySelector('.lc-char.active');
        if (btn) {
          const img = btn.querySelector('img');
          if (img && img.src) setBackdrop(img.src);
        }
      } catch(e) {}

      // ── Preload + decode all character preview PNGs after first paint so
      //    hover/click transitions are instant. Each PNG is 6-8MB; without
      //    this the first hover stalls while the image fetches and decodes.
      if ('requestIdleCallback' in window) {
        requestIdleCallback(preloadCharacters, { timeout: 1500 });
      } else {
        setTimeout(preloadCharacters, 800);
      }
      function preloadCharacters() {
        document.querySelectorAll('.lc-char img').forEach(function(thumb, i) {
          if (!thumb.src) return;
          // Stagger so we don't saturate the network with parallel large fetches
          setTimeout(function() {
            var p = new Image();
            if (p.decode) {
              p.src = thumb.src;
              p.decode().catch(function(){});
            } else {
              p.src = thumb.src;
            }
          }, i * 80);
        });
      }

      // Snappier UI: drop the per-hover scale animation that triggers a
      // re-decode of the large backdrop PNG every time
      if (typeof setPreviewSrc === 'function') {
        // already defined; nothing to do
      }
    })();
  </script>
