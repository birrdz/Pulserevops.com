<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kory White Projects</title>
<style>
  :root{--bg:#0b0f14;--card:#121a23;--line:#22303d;--t:#ECE3D2;--mut:#8aa0ad;--accent:#13c2c2;--bad:#e05a5a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:26px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:1.5rem;margin:0} .sub{color:var(--mut);font-size:.85rem}
  /* gate */
  #gate{position:fixed;inset:0;background:#0b0f14;display:flex;align-items:center;justify-content:center;z-index:99}
  .gatebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;text-align:center;max-width:340px;width:90%}
  .gatebox h2{margin:0 0 6px} .gatebox p{color:var(--mut);font-size:.85rem;margin:0 0 16px}
  .gatebox input{width:100%;padding:12px;font-size:1.3rem;text-align:center;letter-spacing:.4em;border-radius:10px;border:1px solid var(--line);background:#0f161e;color:var(--t)}
  .gatebox button{margin-top:12px;width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#06121a;font-weight:800;font-size:.95rem;cursor:pointer}
  .gateerr{color:var(--bad);font-size:.82rem;margin-top:10px;min-height:18px}
  #app{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--t);text-decoration:none;transition:border-color .2s}
  .card:hover{border-color:var(--accent)}
  .card .ct{font-weight:700;margin:0 0 6px;font-size:1rem} .card .cd{color:var(--mut);font-size:.8rem}
  .empty{color:var(--mut);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <h2>🔒 Kory White Projects</h2>
    <p>Private. Enter the passcode to continue.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="8" autofocus placeholder="••••">
    <button onclick="tryUnlock()">Unlock</button>
    <div class="gateerr" id="gerr"></div>
  </div>
</div>
<div id="app"><div class="wrap">
  <header>
    <div><h1>🛠️ Kory White Projects</h1><div class="sub" id="meta">private workspace</div></div>
    <a href="/" class="sub" style="color:var(--accent)">← Pulse home</a>
  </header>
  <div id="grid"><div class="empty">Loading…</div></div>
</div></div>
<script>
const KEY_SS='kwp_key', CODE='4444';
const $=s=>document.querySelector(s);
function tryUnlock(){ var v=$('#pw').value.trim(); if(v===CODE){ try{localStorage.setItem(KEY_SS,v)}catch(e){} open(); } else { $('#gerr').textContent='Wrong passcode'; $('#pw').value=''; } }
$('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
function open(){ $('#gate').style.display='none'; $('#app').style.display='block'; load(); }
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
async function load(){
  try{
    const r=await fetch('/.netlify/functions/pulse-machine-library-list?pillar=kw&recent=25000',{cache:'no-store'});
    const d=await r.json(); const arr=(d&&d.entries)||[];
    $('#meta').textContent=arr.length+' project'+(arr.length===1?'':'s');
    $('#grid').innerHTML = arr.length ? arr.map(e=>`<a class="card" href="/kory-white-projects/${esc(e.id)}"><div class="ct">${esc(e.question||e.id)}</div><div class="cd">${esc(e.id)}</div></a>`).join('')
      : '<div class="empty">No projects yet — add entries with the <code>kw</code> prefix.</div>';
  }catch(e){ $('#grid').innerHTML='<div class="empty">Load error: '+esc(e.message)+'</div>'; }
}
// auto-unlock if previously entered
try{ if(localStorage.getItem(KEY_SS)===CODE) open(); }catch(e){}
</script>
<script src="/pulse-ambient.js" defer></script>
</body>
</html>
