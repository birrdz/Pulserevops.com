<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background gradient + hex grid + orange/green radial glow -->
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,1 59,17 59,49 30,65 1,49 1,17" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="glowOrange" cx="78%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF6B30" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FF6B30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="14%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0E0E1A"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <filter id="orangeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#09090F"/>
  <rect width="1200" height="627" fill="url(#hex)"/>
  <rect width="1200" height="627" fill="url(#glowOrange)"/>
  <rect width="1200" height="627" fill="url(#glowGreen)"/>

  <!-- Brand strip (top-left) -->
  <g transform="translate(56, 50)">
    <!-- LIVE pill -->
    <g>
      <rect x="0" y="0" width="58" height="28" rx="14" fill="rgba(255,107,48,0.15)" stroke="rgba(255,107,48,0.35)" stroke-width="1"/>
      <circle cx="13" cy="14" r="4" fill="#FF6B30"/>
      <text x="22" y="19" font-size="11" font-weight="800" letter-spacing="1.2" fill="#FF6B30">LIVE</text>
    </g>
    <!-- PULSE wordmark -->
    <text x="74" y="22" font-size="34" font-weight="900" letter-spacing="-1.5" fill="#FF6B30">PULSE</text>
    <!-- Subtitle -->
    <text x="186" y="11" font-size="11" font-weight="700" fill="#EEEEF5">The #1 Source of Truth</text>
    <text x="186" y="26" font-size="11" font-weight="500" fill="#8A8BA6">for RevOps Leaders &middot; Built by a fractional CRO</text>
  </g>

  <!-- Top-right header stats chips -->
  <g transform="translate(800, 50)" font-size="11" font-weight="700">
    <g transform="translate(0, 0)">
      <rect width="116" height="28" rx="14" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)"/>
      <circle cx="12" cy="14" r="3" fill="#22C55E"/>
      <text x="21" y="19" fill="#4ADE80">5,538+ Entries</text>
    </g>
    <g transform="translate(124, 0)">
      <rect width="116" height="28" rx="14" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)"/>
      <circle cx="12" cy="14" r="3" fill="#A78BFA"/>
      <text x="21" y="19" fill="#C4B5FD">427 Trainings</text>
    </g>
    <g transform="translate(248, 0)">
      <rect width="100" height="28" rx="14" fill="rgba(255,107,48,0.08)" stroke="rgba(255,107,48,0.2)"/>
      <circle cx="12" cy="14" r="3" fill="#FF6B30"/>
      <text x="21" y="19" fill="#FF9562">400 KPIs</text>
    </g>
  </g>

  <!-- Hero card background -->
  <g transform="translate(56, 120)">
    <rect x="0" y="0" width="1088" height="430" rx="26" fill="rgba(14,14,26,0.6)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- LIVE AI pill -->
    <g transform="translate(40, 36)">
      <rect width="74" height="26" rx="13" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)"/>
      <circle cx="13" cy="13" r="3.5" fill="#22C55E"/>
      <text x="22" y="18" font-size="10" font-weight="800" letter-spacing="1" fill="#4ADE80">LIVE AI</text>
    </g>

    <!-- Headline -->
    <text x="40" y="148" font-size="68" font-weight="900" letter-spacing="-1.8" line-height="1.05">
      <tspan fill="#EEEEF5">The </tspan><tspan fill="#FF6B30">Machine</tspan>
    </text>
    <text x="40" y="222" font-size="68" font-weight="900" letter-spacing="-1.8" fill="#EEEEF5">is live.</text>

    <!-- Subtitle -->
    <text x="40" y="270" font-size="16" fill="#8A8BA6" font-weight="500">
      <tspan x="40" dy="0">AI machine &middot; ask anything &middot; live. The most advanced RevOps</tspan>
      <tspan x="40" dy="24">intelligence engine available &mdash; completely free. Pipeline math,</tspan>
      <tspan x="40" dy="24">comp design, GTM architecture, all of it.</tspan>
    </text>

    <!-- CTA button -->
    <g transform="translate(40, 348)" filter="url(#orangeShadow)">
      <rect width="266" height="48" rx="24" fill="#FF6B30"/>
      <text x="133" y="31" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">Enter The Machine &nbsp;&rarr;</text>
    </g>

    <!-- Right-side info chips -->
    <g transform="translate(760, 70)">
      <g transform="translate(0, 0)">
        <rect width="288" height="78" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.09)"/>
        <text x="20" y="28" font-size="11" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">KNOWLEDGE BASE</text>
        <text x="20" y="58" font-size="22" font-weight="800" fill="#EEEEF5">5,538+ entries</text>
      </g>
      <g transform="translate(0, 100)">
        <rect width="288" height="78" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.09)"/>
        <text x="20" y="28" font-size="11" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">STATUS</text>
        <circle cx="29" cy="56" r="6" fill="#22C55E"/>
        <text x="44" y="61" font-size="20" font-weight="800" fill="#EEEEF5">Running live</text>
      </g>
      <g transform="translate(0, 200)">
        <rect width="288" height="78" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.09)"/>
        <text x="20" y="28" font-size="11" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">COST</text>
        <text x="20" y="59" font-size="22" font-weight="800" fill="#22C55E">100% Free</text>
      </g>
    </g>
  </g>

  <!-- Footer URL strip -->
  <g transform="translate(56, 585)">
    <text font-size="14" font-weight="700" fill="rgba(238,238,245,0.55)" letter-spacing="0.5">pulserevops.com</text>
    <text x="1088" text-anchor="end" font-size="12" font-weight="600" fill="rgba(255,107,48,0.7)" letter-spacing="0.8">&#10031; AI &middot; OPERATOR-GRADE &middot; 100% FREE</text>
  </g>
</svg>
