<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE Scrub Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFB81C;--bg:#1A0710;--card:#2a1019;--line:#3a1f2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e8dfe4;font-family:system-ui,-apple-system,sans-serif;padding:20px}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--gold);margin:0 0 12px}
h1{font-size:1.7rem}h2{font-size:1.2rem;margin-top:26px}
.muted{color:#a98;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.pcard .code{font-weight:900;color:#fff}.pcard .st{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:4px 0}
.bar{height:8px;background:#160b11;border-radius:5px;overflow:hidden;margin:7px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c98,var(--gold))}
.st.DONE{color:#2ecc71}.st.IN{color:var(--gold)}.st.NOT{color:#7a6}.st.STOPPED{color:#f87171}
.banner{background:#3a0d12;border:1px solid #f87171;color:#fca5a5;padding:12px 16px;border-radius:10px;margin:10px 0;font-weight:700}
.strip{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:1rem}
.strip b{color:var(--gold);font-size:1.3rem;display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--gold);font-weight:700}a{color:#93c5fd}
.hm{display:grid;grid-template-columns:90px repeat(13,1fr);gap:2px;font-size:.62rem}
.hm .h{color:var(--gold);text-align:center;padding:2px}.hm .rl{color:#cbb;padding:2px 4px;text-align:right}
.cell{height:20px;border-radius:2px;background:#241019}
.retry{background:var(--gold);color:#1a0710;border:0;border-radius:6px;padding:4px 10px;font-weight:800;cursor:pointer}
.stat{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:0 10px 10px 0}
.stat b{color:var(--gold);font-size:1.4rem;display:block}
</style></head><body>
<h1>PULSE — Scrub Dashboard</h1>
<div class="muted" id="updated">loading…</div>
<div id="breaker"></div>

<h2>Live batch</h2>
<div class="strip" id="strip"><span class="muted">waiting for the run to start…</span></div>

<h2>Pillar board</h2>
<div class="grid" id="board"></div>

<h2>Failure heatmap <span class="muted">(13 criteria × pillars — dark column = template defect, dark row = rotten pillar)</span></h2>
<div class="hm" id="heat"></div>

<h2>Image stats</h2>
<div id="imgstats"></div>

<h2>Hold queue</h2>
<table id="hold"><thead><tr><th>Page</th><th>Score</th><th>Failed</th><th>Image flags</th><th></th></tr></thead><tbody></tbody></table>

<script>
const CRIT=['1 words','2 answer','3 full','4 faq','5 merm2','6 mermOK','7 src','8 related','9 links','10 hero','11 media','12 imgs','13 fab'];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
async function j(u){try{const r=await fetch(u+'?t='+Date.now());if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function t(u){try{const r=await fetch(u+'?t='+Date.now());if(!r.ok)return'';return await r.text()}catch(e){return''}}
function heatColor(rate){if(rate==null)return'#241019';const a=Math.min(1,rate*3);return'rgba(248,113,113,'+(0.12+a*0.8)+')'}
async function tick(){
  const s=await j('/_master_status.json');
  document.getElementById('updated').textContent = s? ('updated '+new Date(s.updated).toLocaleTimeString()+' · registry '+(s.registrySize||0)+' images') : 'no run yet — launch: node _master_scrub.js';
  if(!s){return;}
  const stopped=(s.pillars||[]).find(p=>p.state==='STOPPED-PATTERN');
  document.getElementById('breaker').innerHTML = stopped? ('<div class="banner">🛑 STOPPED on '+esc(stopped.code)+' — '+esc(stopped.breaker||'systematic defect')+'. Fix the template once, then resume.</div>'):'';
  const L=s.live;
  document.getElementById('strip').innerHTML = L? (
    '<span>Pillar<b>'+esc(L.pillar)+'</b></span><span>Batch<b>'+L.batch+'/'+L.totalBatches+'</b></span>'+
    '<span>Passed<b>'+L.passed+'</b></span><span>Held<b>'+L.held+'</b></span><span>Dupes rejected<b>'+L.dupes+'</b></span>'
  ) : '<span class="muted">between pillars…</span>';
  document.getElementById('board').innerHTML=(s.pillars||[]).map(p=>{
    const pct=p.n? Math.round((p.done||0)/p.n*100):0;
    const passPct=(p.done)? Math.round((p.passed||0)/p.done*100):0;
    const cls=p.state==='DONE'?'DONE':p.state==='STOPPED-PATTERN'?'STOPPED':/IN PROGRESS/.test(p.state)?'IN':'NOT';
    const chk=p.state==='DONE'?' ✓':'';
    return '<div class="pcard"><div class="code">'+esc(p.code)+' '+esc(p.name)+chk+'</div>'+
      '<div class="st '+cls+'">'+esc(p.state)+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="muted">'+(p.done||0)+'/'+p.n+' · pass '+passPct+'% · held '+(p.held||0)+'</div></div>';
  }).join('');
  let hm='<div></div>'+CRIT.map((c,i)=>'<div class="h" title="'+esc(c)+'">'+(i+1)+'</div>').join('');
  (s.pillars||[]).forEach(p=>{ hm+='<div class="rl">'+esc(p.code)+'</div>';
    for(let c=1;c<=13;c++){ const fc=(p.failCounts||{})[c]||0; const rate=p.done? fc/p.done:null; hm+='<div class="cell" style="background:'+heatColor(p.done?rate:null)+'" title="'+esc(p.code)+' crit '+c+': '+fc+'"></div>'; } });
  document.getElementById('heat').innerHTML=hm;
  document.getElementById('imgstats').innerHTML='<div class="stat"><b>'+(s.registrySize||0)+'</b>images in registry (self-hosted + deduped)</div>'+
    '<div class="stat"><b>'+((s.pillars||[]).reduce((a,p)=>a+(p.dupes||0),0))+'</b>dupes rejected</div>';
  const csv=await t('/_master_scrub.csv');
  const rows=csv.split(/\r?\n/).slice(1).filter(Boolean).map(r=>(r.match(/("([^"]|"")*"|[^,]*)/g)||[]).filter((_,i)=>i%2===0).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"')));
  const held=rows.filter(r=>/re-scrub|parked|hold/i.test(r[4]||'')).slice(-60).reverse();
  document.querySelector('#hold tbody').innerHTML = held.length? held.map(r=>{
    const url='https://pulserevops.com'+esc(r[0]); const id=(r[0]||'').split('/').pop();
    return '<tr><td><a href="'+url+'" target="_blank">'+esc(r[0])+'</a></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td><button class="retry" onclick="retry(\''+esc(id)+'\')">Retry</button></td></tr>';
  }).join(''):'<tr><td colspan="5" class="muted">no held pages</td></tr>';
}
async function retry(id){ try{ await fetch('http://localhost:8899/scrub-retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'4444',id:id})}); alert('re-queued '+id);}catch(e){alert('retry endpoint not wired yet')} }
tick(); setInterval(tick,10000);
</script></body></html>
