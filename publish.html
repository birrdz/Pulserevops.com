<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/publish-manifest.webmanifest">
<meta name="theme-color" content="#E0A93C">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse Publisher">
<title>✍️ Pulse Publisher</title>
<style>
  :root{--bg:#0c0a07;--card:#171208;--line:rgba(224,169,60,.18);--t:#f3ead7;--mut:#a99b86;--gold:#E0A93C;--ok:#7CCF6A;--accent:#C8821E}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  h1{font-size:1.6rem;margin:0} .pill{font-size:.6rem;background:var(--gold);color:#1a1407;padding:2px 8px;border-radius:20px;font-weight:800;vertical-align:middle}
  .sub{color:var(--mut);font-size:.85rem}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite} @keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:18px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .n{font-size:2rem;font-weight:800;line-height:1;color:var(--gold)} .stat .l{color:var(--mut);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
  .stat.big .n{color:var(--t)} .stat.ok .n{color:var(--ok)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:1rem;margin:0 0 12px}
  .bar{height:10px;background:#241a0b;border-radius:6px;overflow:hidden;margin:6px 0} .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .row{display:flex;justify-content:space-between;font-size:.85rem;margin:7px 0}
  .feed div{font-size:.82rem;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--line)} .feed b{color:var(--t)}
  /* gate */
  #gate{position:fixed;inset:0;background:#0c0a07;display:flex;align-items:center;justify-content:center;z-index:200}
  .gatebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;text-align:center;max-width:340px;width:90%}
  .gatebox input{width:100%;padding:12px;font-size:1.3rem;text-align:center;letter-spacing:.4em;border-radius:10px;border:1px solid var(--line);background:#241a0b;color:var(--t)}
  .gatebox button{margin-top:12px;width:100%;padding:11px;border:none;border-radius:10px;background:var(--gold);color:#1a1407;font-weight:800;cursor:pointer}
  .gerr{color:#e05a5a;font-size:.82rem;margin-top:10px;min-height:16px}
  #app{display:none}
  /* install popup */
  #installpop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw}
  #installpop b{color:var(--gold)} #installpop button{background:var(--gold);color:#1a1407;border:none;border-radius:8px;padding:7px 14px;font-weight:800;cursor:pointer}
  #installpop .x{color:var(--mut);cursor:pointer;font-size:1.2rem;padding:0 4px}
</style>
</head>
<body>
<div id="gate"><div class="gatebox"><h2>✍️ Pulse Publisher</h2><p class="sub">Private. Enter the passcode.</p><input id="pw" type="password" inputmode="numeric" maxlength="8" autofocus placeholder="••••"><button onclick="tryUnlock()" type="button">Unlock</button><div class="gerr" id="gerr"></div></div></div>
<div id="installpop">📲 <span>Install <b>Pulse Publisher</b> as an app</span><button data-pulse-install type="button">Install</button><span class="x" onclick="document.getElementById('installpop').style.display='none'">×</span></div>
<div id="app"><div class="wrap">
  <header>
    <div><h1>✍️ Pulse Publisher <span class="pill">live</span> <a href="/seo" style="font-size:.8rem;color:var(--gold);text-decoration:none;font-weight:700">🕷️ Spider →</a></h1><div class="sub" id="meta">loading production stats…</div></div>
    <div><button id="installbtn" data-pulse-install type="button" style="background:var(--gold);color:#1a1407;border:none;border-radius:8px;padding:8px 14px;font-weight:800;cursor:pointer;margin-right:10px;font-size:.9rem">📲 Install app</button><span class="sub"><span class="dot"></span> auto-refresh · <span id="ago">—</span></span></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="panel"><h2>⚙️ Currently happening <span class="dot"></span></h2><div id="nowdoing"></div></div>
  <div class="panel"><h2>📊 Quality distribution (score)</h2><div id="scores"></div></div>
  <div class="panel"><h2>⚡ Live activity — recently published / rewritten</h2><div class="feed" id="feed"></div></div>
  <div class="sub" id="fresh"></div>
</div></div>
<script>
const KEY_SS='pulse_pub_key', CODE='4444';
const $=s=>document.querySelector(s);
let last=null;
function fmtAgo(ms){if(!ms)return '—';const s=Math.round((Date.now()-ms)/1000);if(s<60)return s+'s ago';if(s<3600)return Math.round(s/60)+'m ago';return Math.round(s/3600)+'h ago';}
function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function tryUnlock(){if($('#pw').value.trim()===CODE){try{localStorage.setItem(KEY_SS,CODE)}catch(e){}openApp();}else{$('#gerr').textContent='Wrong passcode';$('#pw').value='';}}
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
function openApp(){$('#gate').style.display='none';$('#app').style.display='block';load();setInterval(()=>{$('#ago').textContent=fmtAgo(last);},1000);setInterval(load,30000);maybePopup();}
async function load(){
  let d;try{const r=await fetch('/.netlify/functions/pulse-machine-library-list?status=1&t='+Date.now());d=await r.json();}catch(e){$('#meta').textContent='fetch error';return;}
  last=Date.now();const tot=d.library_total||0;
  $('#meta').innerHTML='<b>'+tot.toLocaleString()+'</b> answers published · '+(d.run_rate_per_hour||0)+'/hr right now';
  $('#stats').innerHTML=[['Total published',tot,'big'],['Published today',d.added_today||0,''],['Last hour',d.last_hour||0,''],['Rate / hour',d.run_rate_per_hour||0,''],['💎 10/10 gold',d.ten_of_ten_count||0,'ok'],['🔎 Indexed',d.indexed_count||0,''],['✨ Polishing queue',d.polishing_queue_depth||0,''],['📥 Write queue',d.queue_depth||0,'']].map(([l,n,c])=>'<div class="stat '+c+'"><div class="n">'+(typeof n==='number'?n.toLocaleString():n)+'</div><div class="l">'+l+'</div></div>').join('');
  const ap=d.audit_progress||{};
  const acts=[
    ['✍️','Writing answers',(d.run_rate_per_hour||0)+'/hr · '+(d.last_hour||0)+' in last hour',(d.run_rate_per_hour||0)>0],
    ['🔍','Auditing quality',ap.in_progress?('running — '+(ap.audited||0)+' checked · '+(ap.demoted||0)+' re-flagged'):'idle',!!ap.in_progress],
    ['✨','Polishing → 10/10',(d.polishing_queue_depth||0).toLocaleString()+' in queue',(d.polishing_queue_depth||0)>0],
    ['🛠️','SEO auto-fix (spider)','running 24/7 — see Spider →',true],
    ['🖼️','DDG image backfill','image lanes active',true]
  ];
  $('#nowdoing').innerHTML=acts.map(a=>'<div class="row"><span>'+a[0]+' <b>'+a[1]+'</b></span><span style="color:'+(a[3]?'var(--ok)':'var(--mut)')+'">'+(a[3]?'● ':'○ ')+a[2]+'</span></div>').join('');
  const sb=d.score_breakdown||{};const order=['10','9','8','7','6','5'];const max=Math.max(1,...order.map(k=>+sb[k]||0));
  $('#scores').innerHTML=order.map(k=>{const v=+sb[k]||0;const pct=Math.round(v/max*100);return '<div class="row"><span>'+(k==='10'?'10/10 ✅':k+'/10')+'</span><span>'+v.toLocaleString()+'</span></div><div class="bar"><div style="width:'+pct+'%"></div></div>';}).join('');
  const rw=(d.claude_opus_progress&&d.claude_opus_progress.rewritten)||[];
  $('#feed').innerHTML=rw.length?rw.slice(0,30).map(id=>'<div>✍️ rewrote <b>'+esc(id)+'</b> → <a href="/knowledge/'+esc(id)+'" target="_blank" style="color:var(--gold)">view</a></div>').join(''):'<div>warming up…</div>';
  $('#fresh').textContent='Pulse Publisher · front-of-house production monitor · refreshes every 30s';
}
function maybePopup(){} // install handled by /js/pwa-install.js (proven one-tap install)
// auto-unlock from saved code / ?code=
(()=>{const p=new URLSearchParams(location.search).get('code');let saved=null;try{saved=localStorage.getItem(KEY_SS)}catch(e){}if(p===CODE||saved===CODE){openApp();}})();
</script>
<script src="/js/pwa-install.js" defer></script>
<script src="/pulse-ambient.js" defer></script>
</body>
</html>
